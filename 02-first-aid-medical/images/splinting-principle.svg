<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Splinting principle — immobilize the joint above and below the break, in the position found</title>

  <!-- limb, slightly angled at the fracture point (position found, not realigned) -->
  <path d="M50,150 L220,150 L235,175 L400,175" stroke-width="18" stroke="#1a1a1a" stroke-opacity="0.08"/>
  <path d="M50,141 L220,141 M50,159 L220,159" stroke-width="1.6"/>
  <path d="M235,166 L400,166 M235,184 L400,184" stroke-width="1.6"/>
  <path d="M50,141 L50,159 M400,166 L400,184" stroke-width="1.6"/>

  <!-- fracture break mark -->
  <g stroke-width="2">
    <line x1="212" y1="140" x2="228" y2="160"/>
    <line x1="228" y1="140" x2="212" y2="160"/>
  </g>

  <!-- rigid splint material along both sides -->
  <rect x="65" y="115" width="330" height="10" rx="3" fill="#1a1a1a" fill-opacity="0.15" transform="rotate(7 230 120)"/>
  <rect x="65" y="188" width="330" height="10" rx="3" fill="#1a1a1a" fill-opacity="0.15" transform="rotate(7 230 193)"/>

  <!-- ties above and below the break -->
  <g stroke-width="2.2">
    <line x1="95" y1="105" x2="95" y2="200"/>
    <line x1="150" y1="103" x2="150" y2="205"/>
    <line x1="310" y1="128" x2="310" y2="225"/>
    <line x1="365" y1="135" x2="365" y2="232"/>
  </g>

  <text x="122" y="90" text-anchor="middle" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">Tied above the break</text>
  <text x="337" y="250" text-anchor="middle" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">Tied below the break</text>

  <!-- padding note -->
  <text x="230" y="30" text-anchor="middle" font-size="13" font-weight="700" stroke="none" fill="#1a1a1a">Pad between splint and skin — check circulation every 15-30 min</text>
</svg>
