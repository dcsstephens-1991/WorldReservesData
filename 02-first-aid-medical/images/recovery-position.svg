<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Recovery position — unconscious but breathing, keeps the airway clear</title>

  <!-- ground line -->
  <line x1="30" y1="240" x2="450" y2="240" stroke-width="1.4" stroke-dasharray="1,6"/>

  <!-- torso, lying on side -->
  <path d="M120,230 C120,190 180,170 240,175 C290,178 320,190 330,205" fill="none" stroke-width="3"/>
  <!-- head, tilted back to keep airway open -->
  <circle cx="100" cy="205" r="26" fill="#1a1a1a" fill-opacity="0.06" stroke-width="2.4"/>
  <path d="M124,210 C132,214 136,222 134,232" stroke-width="2"/>

  <!-- lower arm tucked under head (cheek support) -->
  <path d="M100,231 C95,225 90,215 96,206" stroke-width="2"/>
  <!-- upper arm bent, hand near face for stability -->
  <path d="M150,190 C165,180 175,190 172,205 C170,214 155,214 148,206" stroke-width="2"/>

  <!-- lower leg mostly straight -->
  <path d="M330,205 C350,215 365,225 372,238" stroke-width="3"/>
  <!-- upper leg bent forward for stability (the key stabilizing bend) -->
  <path d="M300,196 C320,175 350,178 360,200 C366,214 350,224 335,220" stroke-width="3"/>

  <g stroke="none" fill="#1a1a1a" font-size="12">
    <line x1="100" y1="180" x2="70" y2="130" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="30" y="126" font-size="12" font-weight="700">Head tilted back —</text>
    <text x="30" y="141" font-size="11">airway stays open</text>

    <line x1="335" y1="200" x2="400" y2="150" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="360" y="140" font-size="12" font-weight="700" text-anchor="start">Top leg bent forward —</text>
    <text x="360" y="155" font-size="11">stops the body rolling</text>
  </g>

  <text x="240" y="275" text-anchor="middle" font-size="12" font-style="italic" stroke="none" fill="#1a1a1a">Only for someone breathing on their own who does not respond — never move a suspected spinal injury</text>
</svg>
