<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Tourniquet placement — 2-3 inches above the wound, never on a joint</title>

  <!-- forearm/limb as a simple straight tube -->
  <rect x="60" y="132" width="360" height="36" rx="18" fill="#1a1a1a" fill-opacity="0.05" stroke-width="2.2"/>

  <!-- wound mark -->
  <g stroke-width="2">
    <line x1="97" y1="140" x2="113" y2="156"/>
    <line x1="113" y1="140" x2="97" y2="156"/>
  </g>
  <text x="105" y="190" text-anchor="middle" font-size="12" stroke="none" fill="#1a1a1a">Wound</text>

  <!-- 2-3in gap indicator -->
  <line x1="115" y1="118" x2="185" y2="118" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="115" y1="112" x2="115" y2="124" stroke-width="1.2"/>
  <line x1="185" y1="112" x2="185" y2="124" stroke-width="1.2"/>
  <text x="150" y="106" text-anchor="middle" font-size="12" stroke="none" fill="#1a1a1a">2-3 in</text>

  <!-- tourniquet band -->
  <rect x="185" y="126" width="46" height="48" rx="4" fill="#1a1a1a" fill-opacity="0.2" stroke-width="2.4"/>
  <!-- windlass rod: straight stick with a perpendicular T-handle -->
  <line x1="208" y1="126" x2="208" y2="82" stroke-width="3.2"/>
  <line x1="192" y1="82" x2="224" y2="82" stroke-width="3.2"/>
  <text x="208" y="52" text-anchor="middle" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">Twist and tighten</text>
  <text x="208" y="66" text-anchor="middle" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">until bleeding stops</text>

  <!-- label leader to band -->
  <line x1="231" y1="150" x2="290" y2="150" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="296" y="140" font-size="13" font-weight="700" stroke="none" fill="#1a1a1a">Tourniquet band</text>
  <text x="296" y="162" font-size="11" stroke="none" fill="#1a1a1a">never placed over a joint</text>

  <!-- time note -->
  <rect x="60" y="220" width="360" height="50" rx="6" fill="#1a1a1a" fill-opacity="0.06" stroke-width="1.6"/>
  <text x="240" y="242" text-anchor="middle" font-size="13" font-weight="700" stroke="none" fill="#1a1a1a">Note the time applied — write it on the limb/tag</text>
  <text x="240" y="260" text-anchor="middle" font-size="11" stroke="none" fill="#1a1a1a">Do not loosen once applied. Full text: triage-and-first-aid-card.md</text>
</svg>
