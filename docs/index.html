<script id="archive-data" type="application/json">{"folders": [{"id": "root", "label": "Overview", "files": [{"path": "README.md", "title": "README", "group": null, "content": "# World Reserves Data\n\nAn offline, self-hosted knowledge repository for survival and civilization rebuilding \u2014 designed to live on a standalone SSD/HDD and remain useful with zero internet access.\n\n## Goals\n\n- **Survive** \u2014 first aid, water, food, shelter, safety in the first days/weeks of a crisis.\n- **Sustain** \u2014 agriculture, food preservation, animal husbandry, basic medicine, sanitation.\n- **Rebuild** \u2014 engineering, chemistry, energy, manufacturing, education, governance \u2014 the knowledge needed to climb back up the tech tree.\n\n## Design principles\n\n1. **Offline-first.** Nothing here depends on a live internet connection to be useful. Prefer downloadable archives (ZIM, PDF, EPUB, plain text/markdown) over links.\n2. **Redundant & durable.** Plan for multiple drive copies, checksums, and a filesystem/format that survives partial corruption and doesn't require exotic software to read in 10-20 years.\n3. **Legally reusable.** Prioritize public-domain, government (e.g. US military FM manuals, USDA, CDC/WHO), Creative Commons, or open-license sources so the archive can be freely copied and shared.\n4. **Human-readable without power-hungry tools.** Plain text/markdown/PDF that can be read from any device, including a phone or e-reader running off a small battery/solar setup.\n5. **Indexed and navigable without search infrastructure.** A human should be able to find what they need by browsing folders alone if the search index is unavailable.\n\n## Repository layout\n\n```\n01-quick-reference/     Grab-and-go: triage cards, checklists, cheat sheets\n02-first-aid-medical/   First aid, field medicine, \"Where There Is No Doctor\"-type refs\n03-water/               Sourcing, purification, storage\n04-food-agriculture/    Growing, foraging, animal husbandry, food preservation\n05-plants-fungi/        Identification, edibility, toxicity, medicinal use\n06-animals-insects/     Identification, husbandry, hunting/trapping, hazards\n07-shelter-construction/Building, carpentry, masonry, structural basics\n08-energy-power/        Off-grid power, batteries, mechanical power, fuels\n09-tools-manufacturing/ Blacksmithing, machining, tool-making, repair\n10-chemistry-materials/ Basic chemistry, soap, fuels, materials science\n11-navigation-comms/    Maps, navigation, radio, signaling\n12-science-education/   Core science/math textbooks for re-teaching a generation\n13-governance-society/  Law, economics, history of civilization collapse/recovery\n14-software-digital/    This archive's own tooling (Kiwix, readers, indexes)\nscripts/                 Download/build/verify scripts\ndocs/                    Hardware plan, curation policy, master index\n```\n\n## Getting started\n\n- Read [`docs/PLAN.md`](docs/PLAN.md) for the full build plan.\n- Read [`docs/HARDWARE.md`](docs/HARDWARE.md) for drive/format/redundancy choices.\n- Read [`docs/CURATION.md`](docs/CURATION.md) for sourcing and licensing rules.\n- Read [`docs/REGIONS.md`](docs/REGIONS.md) for the geography taxonomy used by any region-specific content (lat/long-anchored, since political borders drift).\n- Run scripts in [`scripts/`](scripts/) to pull the recommended offline content packs (Kiwix ZIMs, Project Gutenberg sets, etc.).\n\n## Status\n\nEvery folder (01-14) now has real starter content \u2014 breadth-first, with each file flagging what still needs deeper research. Bulk encyclopedic content packs (Kiwix ZIMs) still need to be downloaded per `docs/PLAN.md` Phase 2. See each folder's README for its specific \"still to build\" list.\n"}, {"path": "docs/PLAN.md", "title": "PLAN", "group": null, "content": "# Build Plan\n\n## Phase 0 \u2014 Foundation (this scaffold)\n- Folder taxonomy, curation policy, hardware/format decisions.\n- `scripts/` for reproducible downloads so content can be re-pulled/updated later.\n\n## Phase 1 \u2014 Quick-reference core (target: <2 GB, fits on a phone)\nThe \"first 72 hours\" layer. Should be the first thing copied to any device.\n- Triage & first aid quick cards\n- Water purification quick steps\n- Edible/poisonous plant quick ID (regional)\n- Basic knots, fire-starting, shelter\n- Master index / \"how to use this drive\" README\n\n## Phase 2 \u2014 Deep reference packs (target: 50-200 GB, the SSD/HDD proper)\nBulk offline encyclopedic content, mostly via **Kiwix ZIM files** (see `scripts/download-kiwix.sh`):\n- Wikipedia (full or \"medicine/school\" subset)\n- WikiHow, Wikibooks, Wikiversity, Wiktionary\n- Project Gutenberg (public-domain books: agriculture, medicine, engineering, history)\n- Where There Is No Doctor / Where There Is No Dentist (Hesperian, CC-licensed)\n- iFixit (repair guides)\n- Appropedia (appropriate technology / off-grid living)\n- Survivor Library-style engineering/trade manuals (pre-1930 public domain texts covering everything from blacksmithing to steam engines)\n- USDA / extension office agriculture guides\n- Army/Marine Corps field manuals (FM 21-76 Survival, FM 4-25.11 First Aid, etc. \u2014 public domain, US Gov works)\n\n## Phase 3 \u2014 Category curation\nWork through each numbered folder and populate it with:\n1. A `README.md` describing scope and the best 3-5 authoritative sources.\n2. Primary source files (PDF/EPUB/markdown) organized by subtopic.\n3. A short \"cheat sheet\" markdown summarizing the folder for offline browsing without opening large files.\n\nSuggested order (survival-critical first): 02 \u2192 03 \u2192 04 \u2192 05/06 \u2192 07 \u2192 08 \u2192 01 (compile the quick-reference layer last, once source material exists to summarize) \u2192 09 \u2192 10 \u2192 11 \u2192 12 \u2192 13.\n\n## Phase 4 \u2014 Hardware build\nSee `docs/HARDWARE.md`. Buy/format drives, load content, verify checksums, store copies in separate physical locations (home, vehicle, off-site).\n\n## Phase 5 \u2014 Maintenance\n- Re-run `scripts/` yearly to pull updated ZIM snapshots.\n- Regenerate checksums (`scripts/verify.sh`) after every content change.\n- Keep a `docs/CHANGELOG.md` of what was added/updated and when.\n\n## Non-goals\n- Not attempting to mirror the entire internet. Curated, prioritized, and space-conscious beats exhaustive.\n- Not building custom software \u2014 leaning on mature offline tools (Kiwix, standard PDF/EPUB readers) that will still exist and be installable from local copies in the future.\n"}, {"path": "docs/HARDWARE.md", "title": "HARDWARE", "group": null, "content": "# Hardware & Storage Plan\n\n## Drive selection\n- **HDD over SSD for cold long-term storage.** HDDs (properly stored, spun up occasionally) tend to retain data reliably for 5-10+ years unpowered; SSD NAND can lose charge/data within 1-2 years unpowered, especially in heat. For a \"bury it and forget it\" reserve copy, HDD wins.\n- **SSD for the active/portable copy** you'll actually use day-to-day (faster, shock-resistant, no moving parts) \u2014 but re-power and refresh it periodically (annually).\n- Capacity target: 2-4 TB is plenty for Phase 1+2 content with headroom; the encyclopedic ZIM packs are the biggest line items (tens of GB each).\n\n## The 3-2-1 rule, adapted for offline survival data\n- **3 copies** minimum.\n- **2 different media types** (e.g. one SSD, one HDD, or add optical/M-DISC for a truly archival third copy).\n- **1 copy off-site** (different physical location: relative's house, safe deposit box, vehicle bug-out bag) so a single fire/flood/theft can't wipe everything.\n\n## Filesystem\n- **exFAT** for the portable/shared drives \u2014 universally readable (Windows/Mac/Linux/Android) without special drivers, no journaling overhead, simple recovery tools if corrupted.\n- Avoid proprietary/journaled filesystems (NTFS/APFS) for the archival copy \u2014 exFAT keeps it accessible from any future OS with minimal tooling.\n- Keep a copy of a simple recovery tool (e.g. `testdisk`/`photorec` binaries) *on the drive itself* in `14-software-digital/`.\n\n## Format & partitioning\n- Single exFAT partition, no encryption on the archival copies (encryption keys get lost; if security is a concern, keep one encrypted \"operational\" copy and unencrypted \"doomsday\" copies).\n- Label drives clearly and physically (label maker, not just a digital volume name).\n\n## Power-independent access\nData is useless without a way to read it. Plan for:\n- A cheap, sturdy, replaceable device that can read USB drives without a full PC: a basic Android tablet/e-reader, or a Raspberry Pi + small monitor, kept with the drive.\n- A small solar panel + battery bank/power station sized to charge that reading device.\n- Printed copies of the Phase 1 quick-reference layer as an ultimate no-power fallback.\n\n## Verification & integrity\n- Generate checksums for the whole tree after every update: `scripts/verify.sh` (SHA-256 manifest).\n- Re-verify checksums whenever a copy is made or once a year, whichever comes first.\n- Keep the manifest itself backed up separately from the drive (e.g. in this git repo) so corruption can be detected even if the drive's own manifest is damaged.\n\n## Physical care\n- Store drives in anti-static bags inside a hard case with desiccant packs.\n- Avoid extreme temperature/humidity swings; a basement or interior closet beats a garage or attic.\n- Spin up/power on stored drives every 6-12 months to keep bearings/electronics healthy (HDD) or refresh charge (SSD).\n"}, {"path": "docs/CURATION.md", "title": "CURATION", "group": null, "content": "# Curation Policy\n\n## Licensing priorities (in order)\n1. **Public domain** \u2014 pre-1929 US works, US federal government works (military manuals, USDA, CDC, NOAA, NASA are all public domain by default).\n2. **Creative Commons (CC0, CC-BY, CC-BY-SA)** \u2014 e.g. Wikipedia/Wikimedia projects, Hesperian Health Guides, Appropedia, OpenStax textbooks.\n3. **Freely redistributable with attribution** \u2014 check each source's terms explicitly; keep a note of the license in the folder's README.\n4. Avoid copyrighted commercial material unless you personally own it and this is a private, non-distributed copy \u2014 don't build the \"shareable\" archive out of pirated content.\n\n## Source quality bar\nFor each topic, prefer (in order):\n1. A **practical field manual** written for non-experts under real constraints (military FM/TM manuals, Hesperian guides, agricultural extension bulletins).\n2. A **comprehensive reference** (textbook, encyclopedia article) for depth once the practical guide is in place.\n3. **Multiple independent sources** for anything safety-critical (first aid, edibility of plants/fungi, structural engineering) \u2014 cross-check before trusting a single source.\n\n## Safety-critical categories \u2014 extra scrutiny\nMedical (02), food/water (03-04), and plant/fungi identification (05) entries must:\n- Cite the source and edition/date.\n- Flag any content that is regionally specific (e.g. \"temperate North America\" plant ID doesn't transfer to other continents).\n- Never rely on a single photo/description for \"safe to eat\" determinations \u2014 require at least two independent identification criteria (this should be stated in the content itself, e.g. Hesperian and military manuals already do this well).\n\n## File format standards\n- Prefer **PDF** for anything with diagrams/original formatting (field manuals, textbooks).\n- Prefer **plain Markdown** for anything you write/summarize yourself (cheat sheets, indexes) \u2014 smallest, most durable, most easily searched/printed.\n- Use **EPUB** only when a good PDF/markdown isn't available.\n- Avoid proprietary formats (.docx, .pages) for anything meant to last decades.\n\n## Naming convention\n`NN-category/subtopic/short-descriptive-title_source-or-org_year.ext`\n\nExample: `02-first-aid-medical/trauma/tourniquet-application_us-army-fm4-25.11_2002.pdf`\n\n## Attribution log\nEvery folder should have a `SOURCES.md` listing: title, author/publisher, license, retrieval URL (for provenance even though the archive is offline), and retrieval date.\n"}, {"path": "docs/REGIONS.md", "title": "REGIONS", "group": null, "content": "# Region & Geography Taxonomy\n\nA shared standard for any content in this archive that varies by geography (medical risk profiles, plant/fungi identification, venomous species, climate-driven construction, agriculture). Used by `02-first-aid-medical/`, `05-plants-fungi/`, `06-animals-insects/`, `04-food-agriculture/`, and others.\n\n## Why lat/long is the ground truth, not country names\n\nPolitical borders and country names change \u2014 sometimes within a person's lifetime (South Sudan's independence in 2011, Yugoslavia's breakup, colonial-era boundaries redrawn post-independence, contested territories that vary by which map you're reading). A country name in this archive can go stale or become disputed; a latitude/longitude coordinate cannot. So:\n\n- **Latitude/longitude bounding boxes are the stable, primary identifier** for any region referenced here.\n- **Country and subnational-territory names are a convenience label**, attached as of a stated date, and expected to need updates over time without touching the underlying geographic data.\n- When in doubt, describe a region by coordinates + biome/climate first, political geography second.\n\n## The four levels\n\n| Level | Description | Example | Stability |\n|---|---|---|---|\n| 1 \u2014 Macro-region | Continent-scale, ~1000+ km across | \"Sub-Saharan Africa\" | Very stable |\n| 2 \u2014 Subregion | Climate/ecological cluster within a macro-region | \"East African Highlands\" | Stable |\n| 3 \u2014 Country | Current sovereign state, ISO 3166-1 code | \"Kenya (KE)\" | Changes over decades |\n| 4 \u2014 Subnational/territory | State/province/administrative division, ISO 3166-2 code | \"Kenya, Nairobi County (KE-30)\" | Changes most often |\n\nEvery region-specific file should reference Level 1-2 (macro-region/subregion) as the primary heading, and note Level 3-4 only inside the content, always paired with an \"as of [year]\" note.\n\n## Required header block for any region-specific content file\n\n```\nRegion: [Subregion], [Macro-region]\nApprox. bounding box: [lat]\u00b0N\u2013[lat]\u00b0N, [long]\u00b0W/E\u2013[long]\u00b0W/E\nCountries/territories (as of [year]): [list \u2014 informational only, not the primary key]\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n```\n\n## Macro-regions (Level 1) \u2014 reference bounding boxes\n\n| Macro-region | Approx. bounding box (lat, long) |\n|---|---|\n| North America | 15\u00b0N\u201383\u00b0N, 170\u00b0W\u201350\u00b0W |\n| Central America & Caribbean | 7\u00b0N\u201323\u00b0N, 118\u00b0W\u201359\u00b0W |\n| South America | 56\u00b0S\u201313\u00b0N, 82\u00b0W\u201334\u00b0W |\n| Europe | 35\u00b0N\u201371\u00b0N, 25\u00b0W\u201360\u00b0E |\n| North Africa & Middle East | 12\u00b0N\u201342\u00b0N, 17\u00b0W\u201363\u00b0E |\n| Sub-Saharan Africa | 35\u00b0S\u201320\u00b0N, 18\u00b0W\u201352\u00b0E |\n| South Asia | 5\u00b0N\u201338\u00b0N, 60\u00b0E\u201398\u00b0E |\n| East Asia | 18\u00b0N\u201354\u00b0N, 73\u00b0E\u2013150\u00b0E |\n| Southeast Asia | 11\u00b0S\u201329\u00b0N, 92\u00b0E\u2013141\u00b0E |\n| Central Asia | 35\u00b0N\u201356\u00b0N, 46\u00b0E\u201388\u00b0E |\n| Oceania & Pacific Islands | 47\u00b0S\u201320\u00b0N, 110\u00b0E\u2013130\u00b0W |\n| Arctic | 66\u00b0N\u201390\u00b0N, all longitudes |\n| Antarctic | 90\u00b0S\u201360\u00b0S, all longitudes |\n\nSubregions (Level 2) are defined inside each macro-region's content as needed \u2014 e.g. North America splits into Pacific Northwest, Desert Southwest, Great Plains, Northeast/Mid-Atlantic, Southeast, Boreal Canada, etc. Don't pre-define every subregion globally; define one the first time a file needs it, and reuse it after.\n\n## File naming convention\n\n`[macro-region-slug]_[subregion-slug].md`, e.g. `north-america_pacific-northwest.md`. Do not encode country names into filenames \u2014 countries belong inside the content, not the path, since they're the least stable part of the classification.\n\n## What stays political on purpose\n\nSome content is inherently tied to nation-states regardless of geography \u2014 law, currency, governance systems (`13-governance-society/`), and some cultural/religious practice notes. For that content, use country/territory names directly and just date-stamp them; forcing lat/long onto content that's actually about human institutions adds no reliability. Use this taxonomy for anything where the underlying reality is physical/ecological (climate, species, terrain, disease vectors) \u2014 that's where borders drift but geography doesn't.\n"}]}, {"id": "01", "label": "01 \u00b7 Quick Reference", "files": [{"path": "01-quick-reference/README.md", "title": "README", "group": null, "content": "# 01 \u2014 Quick Reference\n\nThe \"first 72 hours\" layer. Small, printable, phone-friendly. This is the last thing you compile (it summarizes folders 02-13) but the first thing anyone should open.\n\n## Contents\n- [x] `emergency-type-triage.md` \u2014 identify the type of emergency (earthquake, landslide, flood, wildfire, storm, nuclear/radiological, pandemic, war, civil unrest, breakdown of civil order) and the correct first response for each\n- [x] `triage-and-first-aid-card.md` \u2014 one-page ABCs, bleeding control, shock, CPR steps\n- [x] `water-purification-quicksteps.md` \u2014 boil times, bleach ratios, filtration order of operations\n- [ ] `edible-plant-quick-id_[region].md` \u2014 regional, needs a target region before it can be written safely; see `edible-plant-quick-id_TEMPLATE.md`\n- [x] `fire-shelter-signal.md` \u2014 fire starting methods, emergency shelter types, signaling for rescue\n- [x] `evacuation-bugout-checklist.md`\n- [x] `master-index.md` \u2014 one-page map of the entire drive with folder descriptions\n\n## Format\nMarkdown, one page each when printed. No dependency on opening large PDFs/ZIMs.\n"}, {"path": "01-quick-reference/edible-plant-quick-id_TEMPLATE.md", "title": "Edible Plant Quick Id \u2014 TEMPLATE", "group": null, "content": "# Edible Plant Quick ID \u2014 [REGION NAME]\n\n**Not filled in yet.** Plant identification is region-specific and safety-critical \u2014 see `docs/CURATION.md`. This template shows the format to follow once a region is picked (e.g. \"Pacific Northwest, USA\" or \"Mediterranean Europe\").\n\nCopy this file to `edible-plant-quick-id_[region].md` per region you need.\n\n## Format for each entry\n### [Common name] (*Latin name*)\n- **Identifying features**: at least 2 independent distinguishing traits (leaf shape + arrangement, bark, flower structure, smell) \u2014 never rely on a single trait or a photo alone.\n- **Toxic look-alikes**: name them explicitly, and how to tell them apart.\n- **Edible parts & season**: which parts, what time of year.\n- **Preparation needed**: raw-safe, or requires cooking/leaching to remove toxins.\n- **Source**: which reference this was verified against.\n\n## Rule that overrides everything else\nIf you cannot positively confirm identification against at least two independent criteria from a trusted source, **do not eat it**. Misidentification of wild plants and fungi kills people every year \u2014 this file is a memory aid for trained/verified knowledge, not a substitute for learning to identify local flora before you need to.\n\n## To complete this file\nTell me (or a future editor) your target region(s) and I'll populate real entries sourced from `05-plants-fungi/regional/` once that region has verified content \u2014 see `05-plants-fungi/regional/north-america_temperate.md` for the first worked example, and `05-plants-fungi/common-survival-plants_global.md` for widely-distributed, low-ambiguity plants that transfer across most regions.\n"}, {"path": "01-quick-reference/emergency-type-triage.md", "title": "Emergency Type Triage", "group": null, "content": "# Emergency Type Triage \u2014 What's Happening, What to Do First\n\nRead this first when something has gone wrong and you don't yet know how bad it is. Find the closest match below, do the immediate actions, then go to the linked deep-dive.\n\n## Stay-or-go decision framework (apply to any scenario)\nAsk, in order:\n1. **Is this location about to become more dangerous** (fire spreading, water rising, structure unstable, crowd/conflict approaching)? \u2192 Go.\n2. **Do I have a safer destination I can actually reach** (route open, daylight/fuel/fitness to get there)? If no \u2192 Stay and harden your current position instead of moving into the unknown.\n3. **Have authorities/reliable info issued a mandatory evacuation or a shelter-in-place order for your specific area?** Follow it unless it is clearly unsafe to comply (e.g. ordered evacuation route is now blocked/flooded).\n4. **No official info at all?** Default to shelter-in-place for the first few hours while you gather information \u2014 most people who die evacuating unnecessarily die from the evacuation itself (traffic, exposure, panic), not the event.\n\n---\n\n## Natural / geological\n\n### Earthquake\n- **During**: Drop, Cover, Hold On \u2014 under sturdy furniture, away from windows/glass/heavy objects. If in bed, stay and cover head with a pillow. Outdoors: move to open ground away from buildings/power lines.\n- **After**: Expect aftershocks. Check for gas leaks (smell/hissing \u2014 shut off gas main if suspected, don't use open flame/switches). Check structural damage before re-entering buildings. Check on neighbors.\n- **Do not**: run outside during shaking (falling debris risk), use elevators.\n- Deep dive: `07-shelter-construction/`, `02-first-aid-medical/`\n\n### Landslide / mudslide\n- **Warning signs**: cracking trees/ground, unusual sounds (rumbling, cracking), sudden increase or decrease in stream water carrying debris, doors/windows sticking (ground shifting), leaning trees/poles.\n- **Immediate**: move away and *uphill/perpendicular* to the slide path, never straight downhill or straight away in the flow direction. If caught, curl into a ball to protect your head.\n- **Highest risk**: after heavy rain, wildfire (destroyed root systems), or earthquake, on steep terrain.\n- Deep dive: `07-shelter-construction/`\n\n### Flood (flash flood vs. rising water)\n- **Flash flood** (minutes to hours): move to high ground immediately, don't wait to gather belongings. 6 inches of fast water can knock you down; 12 inches can sweep a vehicle away \u2014 never drive or walk through moving water (\"Turn Around, Don't Drown\").\n- **Slow rising water**: move valuables/utilities up early, shut off electricity at the breaker if water is approaching outlets (only if you can do so safely without standing in water), evacuate before roads become impassable.\n- **After**: don't return until authorities clear it; floodwater may be contaminated (sewage, chemicals) \u2014 treat all contact water as unsafe, boil/purify all water per `water-purification-quicksteps.md`.\n- Deep dive: `03-water/`\n\n### Wildfire\n- **Immediate**: if evacuation is ordered, leave early \u2014 don't wait to watch the fire's progress. Close windows/vents, remove flammable items from around structure if time allows.\n- **Trapped**: shelter in a cleared area or vehicle (windows up, below window line, engine off, call for help), avoid canyons/dense fuel, a body of water or already-burned ground is safer than fresh fuel.\n- **Air quality**: N95 mask, stay indoors with filtered air if smoke-only (not actively threatened).\n- Deep dive: `07-shelter-construction/`\n\n### Hurricane / severe storm / tornado\n- **Hurricane**: evacuate per official orders (storm surge is the top killer, not wind); if sheltering, interior room, lowest level not prone to flooding, away from windows.\n- **Tornado**: lowest floor, interior room/closet, away from windows, cover yourself. No basement: interior room, small closet/bathroom, avoid wide-span rooms (gyms, auditoriums).\n- Deep dive: `07-shelter-construction/`\n\n---\n\n## Radiological / nuclear\n\n**These two scenarios have opposite immediate responses \u2014 identify which one first.**\n\n### Nuclear/radiological power plant or transport accident (no blast)\n- Follow official evacuation zone guidance \u2014 this type of release is usually contained and directional (downwind), so evacuation perpendicular to wind direction, out of the affected zone, is often correct once officially indicated.\n- If told to shelter in place: go inside, close windows/doors/vents, turn off HVAC intake.\n- Potassium iodide (KI) tablets protect only the thyroid from radioactive iodine, and only if taken as officially directed \u2014 they are not a general radiation antidote.\n\n### Nuclear detonation (blast seen/felt, or credible warning)\n- **Immediate (first seconds)**: if you see the flash, get down and cover behind anything solid \u2014 do not look at the flash (blindness risk). Blast wave follows the flash by seconds.\n- **First minutes**: get inside the nearest sturdy building, ideally below ground or in a windowless interior space, as many walls/floors between you and outside as possible.\n- **Do NOT evacuate immediately** \u2014 fallout (radioactive dust) arrives within 10-20 minutes downwind and is the main lingering threat. Moving outdoors during fallout deposition is far more dangerous than staying put.\n- **Shelter in place 24-48+ hours minimum** \u2014 radioactivity from fallout decays fast initially; each 7x increase in time reduces exposure roughly 10x. Staying sheltered the first 24-48 hrs matters most.\n- If outside during fallout: remove outer clothing before entering shelter (removes ~90% of contamination), shower/wash exposed skin and hair with soap and water (don't scrub raw), do not use conditioner (binds particles to hair).\n- Use a battery/hand-crank radio for official guidance on when it's safe to move.\n- Deep dive: `07-shelter-construction/`, `03-water/` (assume outdoor water sources contaminated until confirmed otherwise)\n\n---\n\n## Public health\n\n### Pandemic / disease outbreak\n- Reduce exposure: distancing, masking (especially indoors/crowded), hand hygiene, ventilation.\n- Stock a longer runway of supplies than usual (2-4+ weeks) to reduce trips out during peak transmission.\n- Isolate symptomatic household members if possible; designate one caregiver to reduce household spread.\n- Deep dive: `02-first-aid-medical/`\n\n---\n\n## Human conflict / social breakdown\n\nThe guidance below is about **personal safety and staying out of harm's way** \u2014 not a political position on any cause or authority. In any conflict scenario the overriding goals are: don't be a target, don't be caught in a chokepoint, protect your ability to make decisions (documents, cash, communication, family plan).\n\n### War / armed conflict nearby\n- **Indicators to watch**: military movement/checkpoints appearing, curfews announced, communications/utilities becoming unreliable, sudden price spikes or shortages, official advisories.\n- **Immediate**: identify the nearest solid cover (below-ground or interior rooms away from windows, similar to tornado shelter) for shelling/airstrike risk. Have a go-bag ready (see `evacuation-bugout-checklist.md`).\n- **Movement**: avoid known front lines, checkpoints of unclear allegiance, and infrastructure targets (power plants, military bases, government buildings, bridges) when possible.\n- **Unexploded ordnance**: never touch or move unfamiliar military debris; note location and avoid, report if there's anyone to report to.\n- Deep dive: `07-shelter-construction/`, `11-navigation-comms/`\n\n### Civil unrest / rioting\n- **Avoid crowds and choke points** (narrow streets, single exits) even if not politically engaged \u2014 you can be caught in crowd crush, tear gas, or crossfire regardless of your involvement.\n- If caught in a crowd: move perpendicular to the crowd's flow toward an exit, not against it; avoid falling (crowd crush is a top cause of death, not violence itself).\n- **Tear gas/pepper spray exposure**: move upwind and to fresh air immediately, flush eyes with water (not rubbing), remove contaminated clothing.\n- Secure your home: away from windows during active unrest nearby, garage/vehicles secured, valuables not visible from outside.\n- Keep a low profile if moving through an active area: neutral clothing, no items that could mark you as a participant on either side, do not film/engage confrontationally unless you fully accept that risk.\n- Deep dive: `02-first-aid-medical/` (impact injuries, chemical irritant exposure)\n\n### Breakdown of civil order / government or military takeover\n- This is about **personal and family continuity**, not resistance or political action \u2014 the goal is to remain safe, informed, and capable of making your own decisions as conditions change.\n- **Documents & identity**: keep originals *and* copies (physical + on this drive) of ID, property, medical, and financial records somewhere reachable in a fast evacuation.\n- **Cash & barter**: hold some physical cash and consider barterable goods \u2014 electronic payment/banking systems can become unreliable or frozen.\n- **Communications**: assume normal channels (internet, cell) may become unreliable, censored, or monitored; have a family communication plan that doesn't depend on any single channel (a predetermined meeting point is more reliable than a phone call).\n- **Information discipline**: expect propaganda/misinformation from multiple sides during instability; corroborate important information across independent sources before acting on it.\n- **Movement & curfews**: comply with clearly posted curfews/checkpoints where refusal creates direct physical risk to you; prioritize de-escalation in any encounter with armed personnel (hands visible, calm, comply with instructions, don't argue in the moment).\n- **Community**: known, trusted neighbors are one of the most effective resources in sustained instability \u2014 coordinate supplies, information, and watch schedules where possible.\n- Deep dive: `13-governance-society/`, `11-navigation-comms/`\n\n---\n\n## Quick lookup\n\n| Scenario | First move | Shelter or evacuate (default) |\n|---|---|---|\n| Earthquake | Drop, cover, hold on | Shelter during, assess after |\n| Landslide | Move uphill/perpendicular | Evacuate the path |\n| Flash flood | Move to high ground now | Evacuate |\n| Rising flood | Move valuables up, shut off power | Evacuate before roads close |\n| Wildfire | Leave early if ordered | Evacuate |\n| Hurricane | Follow evacuation zone order | Evacuate (surge) or shelter (inland) |\n| Tornado | Interior room, lowest floor | Shelter |\n| Nuclear plant accident | Follow official zone guidance | Evacuate if directed, else shelter |\n| Nuclear detonation | Get inside, don't look at flash | **Shelter 24-48+ hrs, do not evacuate into fallout** |\n| Pandemic | Reduce exposure, stock up | Shelter |\n| War/conflict nearby | Identify solid cover | Shelter, evacuate only via safe route |\n| Civil unrest | Avoid crowds/choke points | Shelter at home if possible |\n| Civil order breakdown | Secure documents, low profile | Shelter, coordinate with trusted neighbors |\n"}, {"path": "01-quick-reference/evacuation-bugout-checklist.md", "title": "Evacuation Bugout Checklist", "group": null, "content": "# Evacuation / Bug-Out Checklist\n\n## Documents & money (waterproof pouch)\n- [ ] ID, passports, insurance, deeds/titles (or photos/copies stored on this drive's `14-software-digital/`)\n- [ ] Cash in small bills (power/card systems may be down)\n- [ ] This drive + a charged phone/reader with Kiwix installed\n\n## Water & food\n- [ ] Water: 1 gallon/person/day, 3-day minimum\n- [ ] Purification method (bleach drops, filter, tablets) \u2014 see `water-purification-quicksteps.md`\n- [ ] Food: 3-day minimum, no-cook or easy-cook, high calorie density\n\n## Medical\n- [ ] First aid kit + this drive's `02-first-aid-medical/` and this folder's `triage-and-first-aid-card.md`\n- [ ] Prescription medications (rotate stock so nothing expires unnoticed)\n- [ ] N95/dust masks\n\n## Tools & light\n- [ ] Multi-tool, fixed-blade knife\n- [ ] Flashlight/headlamp + spare batteries or hand-crank\n- [ ] Fire starter (see `fire-shelter-signal.md`)\n- [ ] Duct tape, paracord, tarp\n\n## Power & comms\n- [ ] Battery bank + solar charger\n- [ ] Battery/hand-crank radio\n- [ ] Whistle\n- [ ] Physical paper map of your area (don't rely on GPS)\n\n## Clothing & shelter\n- [ ] Weather-appropriate layers, sturdy shoes\n- [ ] Emergency blanket / bivy\n- [ ] Rain protection\n\n## Before you leave\n- [ ] Know at least 2 routes out of your area\n- [ ] Tell someone outside the area where you're going\n- [ ] Shut off utilities if instructed/safe to do so (gas especially, if damage suspected)\n- [ ] Grab pets' food/leash/carrier\n\n## Decision triggers (fill in for your situation ahead of time)\n- What specific conditions mean \"leave now, don't wait\"?\n- Where are you going (primary + backup destination)?\n- Who needs to be contacted/gathered before leaving?\n"}, {"path": "01-quick-reference/fire-shelter-signal.md", "title": "Fire Shelter Signal", "group": null, "content": "# Fire, Shelter & Signaling Quick Card\n\n## Fire \u2014 priority order of need\nSurvival priority is usually: shelter > water > fire > food. Fire helps with warmth, water purification, signaling, and morale.\n\n### Starting a fire\n1. **Tinder** (catches spark): dry grass, bark shavings, dryer lint, cotton balls + petroleum jelly, birch bark.\n2. **Kindling**: pencil-to-thumb thickness dry twigs, built in a loose teepee or log-cabin shape over the tinder.\n3. **Fuel**: progressively larger dry wood added once kindling is established.\n4. Ignition options ranked by reliability: lighter/matches (carry waterproofed) \u2192 ferro rod/flint & steel \u2192 friction (bow drill/hand drill, hardest, needs practice) \u2192 magnifying lens (needs direct sun).\n5. Always clear a fire ring down to bare soil/rock; never leave unattended; fully extinguish (drown, stir, drown again) before leaving.\n\n## Emergency shelter \u2014 priorities\nProtect from the biggest immediate threat: wind, precipitation, ground cold (you lose heat fastest to the ground).\n1. Insulate from the ground first (branches, leaves, pack) \u2014 this matters more than overhead cover in cold conditions.\n2. Keep shelter just big enough for your body \u2014 smaller space = less heat to retain.\n3. Types:\n   - **Debris hut**: ridge pole + leaning sticks + thick pile of leaves/debris (12+ inches) over frame. Good in forested temperate areas.\n   - **Lean-to**: single angled wall against wind direction, tarp or bark, best paired with a fire reflecting off the open side.\n   - **Snow shelter (quinzhee/snow cave)**: dig into a drift, keep walls 12+ inches thick, ventilation hole essential (CO2/suffocation risk).\n4. Site selection: avoid dead trees/branches overhead, flash-flood-prone low ground, ridgelines exposed to wind/lightning, insect nests.\n\n## Signaling for rescue\n- **Fire/smoke**: three fires in a triangle or line is a recognized distress signal. Green boughs on a hot fire make thick white smoke (daytime); the fire itself is visible at night.\n- **Ground-to-air symbols**: large (10+ ft), high-contrast materials or trenches. \"X\" = need medical assistance, \"V\" = need assistance, arrow = direction of travel.\n- **Mirror/reflective signal**: aim reflected sunlight by sighting through a hole/notch in the mirror at the target; sweep across the horizon if no target is visible yet.\n- **Whistle/sound**: three blasts/shouts/flashes = internationally recognized distress signal (pause, repeat).\n- **Stay put** if a search is likely and you're already found/reported missing \u2014 moving makes you harder to find. Move only if you must for water/safety, and leave clear directional markers.\n\nSee `07-shelter-construction/` and `11-navigation-comms/` for deeper reference material once loaded.\n"}, {"path": "01-quick-reference/master-index.md", "title": "Master Index", "group": null, "content": "# Master Index \u2014 How to Use This Drive\n\nStart here. This page maps the whole archive.\n\n## If you have 5 minutes, read these first\n1. `emergency-type-triage.md` \u2014 **identify what's happening first** (earthquake, flood, nuclear, civil unrest, etc.) and what to do in the first minutes\n2. `triage-and-first-aid-card.md` \u2014 bleeding, shock, CPR, burns, choking\n3. `water-purification-quicksteps.md` \u2014 how to make water safe to drink\n4. `fire-shelter-signal.md` \u2014 fire, emergency shelter, signaling for rescue\n5. `evacuation-bugout-checklist.md` \u2014 what to grab and do before leaving\n\n## Full folder map\n| Folder | Use it for |\n|---|---|\n| `01-quick-reference/` | This folder \u2014 fast answers for the first 72 hours |\n| `02-first-aid-medical/` | Deeper medical reference, injuries, illness, childbirth, dentistry |\n| `03-water/` | Sourcing, purifying, storing water long-term |\n| `04-food-agriculture/` | Growing food, raising animals, preserving food |\n| `05-plants-fungi/` | Identifying edible/medicinal/poisonous plants and fungi |\n| `06-animals-insects/` | Identifying dangerous species, hunting/trapping, livestock |\n| `07-shelter-construction/` | Building shelter, structures, sanitation systems |\n| `08-energy-power/` | Off-grid electricity, batteries, mechanical power, fuel |\n| `09-tools-manufacturing/` | Making and repairing tools, metalwork, woodwork |\n| `10-chemistry-materials/` | Basic chemistry, soap-making, materials |\n| `11-navigation-comms/` | Maps, navigation, radios, signaling |\n| `12-science-education/` | Textbooks to re-teach core science and math |\n| `13-governance-society/` | Organizing groups, basic law/economics, history of recovery |\n| `14-software-digital/` | The tools to actually read this drive (Kiwix, PDF readers) |\n\n## How content is organized\n- Each numbered folder has its own `README.md` describing what's inside and where it came from.\n- Bulk reference material lives as **Kiwix ZIM files** in `14-software-digital/zim/` \u2014 open with the Kiwix app included in the same folder.\n- Anything written specifically for this archive (like this page) is plain markdown \u2014 readable in any text editor, even without Kiwix.\n\n## If you have no working device\nPrint `01-quick-reference/` \u2014 it's designed to fit on a handful of pages and covers the highest-priority, time-critical information.\n"}, {"path": "01-quick-reference/triage-and-first-aid-card.md", "title": "Triage And First Aid Card", "group": null, "content": "# Triage & First Aid Quick Card\n\nSources: US Army FM 4-25.11 (First Aid), Hesperian *Where There Is No Doctor*. Not a substitute for training \u2014 practice these before you need them.\n\n## 1. Scene safety first\nDon't become a second casualty. Check for fire, traffic, structural collapse, electrical, toxic fumes before approaching.\n\n## 2. The ABCs (check in order, fix each before moving on)\n1. **Airway** \u2014 is it open? Tilt head back, lift chin. Clear visible obstructions.\n2. **Breathing** \u2014 look/listen/feel for 10 sec. None? Start rescue breaths / CPR.\n3. **Circulation** \u2014 check pulse. Control severe bleeding *before* anything else if it's spurting or pooling fast.\n\n## 3. Severe bleeding (control before checking anything else)\n1. Direct firm pressure with cloth/gauze \u2014 don't peek, don't remove soaked cloth, add more on top.\n2. Elevate the wound above heart level if possible.\n3. If bleeding won't stop and it's a limb: apply a tourniquet 2-3 inches above the wound (not on a joint), tighten until bleeding stops, note the time applied, do not loosen once applied.\n4. Pack deep wounds with gauze/clean cloth, then pressure.\n\n## 4. Shock (treat everyone with a serious injury as if in shock)\nSigns: pale/cool/clammy skin, rapid weak pulse, confusion, rapid breathing.\n- Lay flat, elevate legs ~12in (unless spinal injury or leg fracture suspected).\n- Keep warm (blanket under and over).\n- Nothing by mouth.\n- Get to definitive care fast \u2014 shock kills.\n\n## 5. CPR (adult, no training required to start)\n1. Confirm unresponsive + not breathing normally.\n2. Hands center of chest, push hard/fast 100-120/min, ~2 inches deep.\n3. 30 compressions : 2 breaths, repeat.\n4. Continue until help arrives, person revives, or you're physically unable.\n\n## 6. Fractures / suspected broken bones\n- Don't try to realign. Splint in the position found using rigid material (stick, board) padded and tied above and below the break.\n- Check circulation below the injury (color, warmth, pulse) after splinting.\n\n## 7. Burns\n- Cool with room-temp water 10-20 min (not ice).\n- Do not pop blisters. Cover loosely with clean non-stick cloth.\n- Remove rings/tight items near burn before swelling.\n- Large/deep burns (bigger than hand, white/charred, or on face/hands/genitals) = seek advanced care urgently, high infection/fluid-loss risk.\n\n## 8. Choking\n- Encourage coughing if any air movement.\n- No air movement: 5 back blows between shoulder blades, then 5 abdominal thrusts (Heimlich), alternate until cleared or person unconscious \u2192 start CPR.\n\n## 9. When to prioritize evacuation over field treatment\nUncontrolled bleeding, airway compromise, chest wounds, signs of internal bleeding (rigid/painful abdomen, coughing blood), altered consciousness, snakebite from a venomous species, severe allergic reaction (anaphylaxis).\n\nSee `02-first-aid-medical/` for deep reference material once loaded.\n"}, {"path": "01-quick-reference/water-purification-quicksteps.md", "title": "Water Purification Quicksteps", "group": null, "content": "# Water Purification Quick Steps\n\nUntreated water can carry bacteria, viruses, and parasites even if it looks clean. Always treat water from an unknown source.\n\n## Order of operations\n1. **Pre-filter** cloudy/dirty water through cloth or let sediment settle, to help disinfection work.\n2. **Disinfect** using one of the methods below.\n3. **Store** in a clean, covered container.\n\n## Method 1 \u2014 Boiling (kills everything, most reliable)\n- Bring to a **rolling boil for 1 minute** (3 minutes above 6,500 ft / ~2,000m elevation).\n- Let cool before drinking. Improves taste by pouring between containers a few times.\n\n## Method 2 \u2014 Household bleach (unscented, no additives, ~5-6% sodium hypochlorite)\n- **2 drops per liter / ~8 drops per gallon** of clear water.\n- Double the dose if water is cloudy.\n- Stir, wait **30 minutes** before drinking. Should have a faint chlorine smell \u2014 if not, repeat the dose.\n\n## Method 3 \u2014 Iodine (2% tincture)\n- **5 drops per liter / ~20 drops per gallon** of clear water (double if cloudy).\n- Wait 30 minutes. Not recommended for pregnant people or those with thyroid conditions, or for long-term daily use.\n\n## Method 4 \u2014 Filtration\n- Ceramic or hollow-fiber filters (rated \u22640.2 micron) remove bacteria/parasites but **not** most viruses \u2014 combine with chemical disinfection or boiling if virus risk is likely (e.g. near human sewage).\n- Biosand/slow sand filters: effective but need time to build a biological layer (~2-3 weeks) before fully effective.\n\n## Method 5 \u2014 Solar disinfection (SODIS) \u2014 low-resource backup\n- Fill clear plastic bottles with water (relatively clear, <30 NTU turbidity).\n- Lay in full direct sun on a reflective surface for **6 hours** (2 consecutive days if cloudy).\n- Works via UV + heat; least reliable method, use when nothing else is available.\n\n## Rules of thumb\n- When in doubt, boil \u2014 it's the only method that reliably kills everything including resistant parasite cysts (e.g. Cryptosporidium) without special filters.\n- Never drink floodwater, water near latrines/graves, or stagnant water without treating.\n- Rainwater collected cleanly is generally safer than ground sources but still treat if storing long-term.\n\nSee `03-water/` for deep reference material once loaded.\n"}]}, {"id": "02", "label": "02 \u00b7 First Aid & Medical", "files": [{"path": "02-first-aid-medical/README.md", "title": "README", "group": null, "content": "# 02 \u2014 First Aid & Medical\n\n## Contents\n- [x] `trauma-and-wound-care.md` \u2014 wound cleaning, fractures, dislocations, sprains, head/chest/abdominal/eye injury, bites & stings\n- [x] `medical-emergencies.md` \u2014 heart attack, stroke, seizure, anaphylaxis, diabetic emergencies, choking, heat/cold illness, poisoning, dehydration\n- [x] `childbirth-basics.md` \u2014 unattended emergency delivery\n- [x] `dental-emergencies.md` \u2014 toothache, abscess, knocked-out/broken tooth\n- [x] `mental-health-psychological-first-aid.md` \u2014 psychological first aid, acute stress, suicide risk, supporting children and caregivers\n- [x] `sanitation-hygiene.md` \u2014 waste disposal, handwashing, food safety, vector control\n- [x] `religious-cultural-considerations.md` \u2014 how major belief systems intersect with care decisions (blood products, modesty, fasting, end-of-life, dietary restrictions) \u2014 ask, don't assume\n- [x] `regional-health-considerations/` \u2014 geography-specific disease/species/climate risk, keyed to `docs/REGIONS.md`'s lat/long taxonomy so it stays valid as borders change. Every macro-region now covered (28 subregion files) \u2014 see that folder's README for the full list.\n\n## Sources used\n- US Army FM 4-25.11 (First Aid) \u2014 public domain\n- Hesperian *Where There Is No Doctor* / *Where There Is No Dentist* \u2014 CC-licensed field medicine for non-professionals\n- WHO psychological first aid framework (Look, Listen, Link) \u2014 public guidance\n- General cross-checked clinical consensus (heart attack/stroke/anaphylaxis recognition, CPR ratios, RICE, ORS) reflects widely-taught first aid standards, not one single source\n\n## Curation note\nSafety-critical \u2014 see `docs/CURATION.md`. Content here is broad field guidance, not a substitute for training; where sources disagree or a technique requires hands-on practice (e.g. tourniquet application, CPR), that's flagged in the relevant file.\n\n## Still to build\n- Deeper pharmacology/herbal medicine reference\n- Chronic disease management under supply constraints (diabetes, hypertension, etc.)\n- Additional `regional-health-considerations/` subregion files \u2014 see that folder's README for the template\n"}, {"path": "02-first-aid-medical/regional-health-considerations/README.md", "title": "README", "group": "regional-health-considerations", "content": "# Regional Health Considerations\n\nWhat matters medically in one place doesn't transfer to another \u2014 endemic disease, venomous species, climate exposure risk, and available medicinal plants are all geography-dependent. This folder applies the taxonomy in `docs/REGIONS.md`: each file is keyed to a lat/long bounding box first, country names second (since those drift over time).\n\n## File format\nEach file uses the required header from `docs/REGIONS.md`, then:\n- **Climate-driven risks** \u2014 heat/cold illness patterns, seasonal hazards\n- **Disease patterns** \u2014 locally significant infectious disease to be aware of\n- **Dangerous species** \u2014 cross-reference to `06-animals-insects/`, venomous/medically significant species by name\n- **Notes** \u2014 anything else regionally specific (altitude, water access patterns, etc.)\n\nThis is a starting scaffold, not exhaustive global coverage \u2014 populate additional subregions as needed using `TEMPLATE.md`.\n\n## Existing files \u2014 every macro-region in `docs/REGIONS.md` now has at least one subregion file\n- North America: `north-america_temperate.md`\n- Central America & Caribbean: `central-america-caribbean_isthmus.md`, `central-america-caribbean_islands.md`\n- South America: `south-america_amazon-basin.md`, `south-america_andean-highlands.md`, `south-america_southern-cone-patagonia.md`\n- Europe: `europe_mediterranean.md`, `europe_central-western-temperate.md`, `europe_northern-boreal.md`\n- North Africa & Middle East: `mena_arabian-peninsula.md`, `mena_north-africa-sahara.md`, `mena_levant-eastern-mediterranean.md`\n- Sub-Saharan Africa: `sub-saharan-africa_west-african-coast.md`, `sub-saharan-africa_congo-basin.md`, `sub-saharan-africa_east-african-highlands.md`, `sub-saharan-africa_southern-african-savanna.md`, `sub-saharan-africa_sahel.md`\n- South Asia: `south-asia_indo-gangetic-plains.md`, `south-asia_himalayan-foothills.md`, `south-asia_peninsula-sri-lanka.md`\n- East Asia: `east-asia_temperate.md`, `east-asia_tibetan-plateau.md`\n- Southeast Asia: `southeast-asia_mainland-mekong.md`, `southeast-asia_maritime-archipelago.md`\n- Central Asia: `central-asia_steppe-and-highlands.md`\n- Oceania & Pacific Islands: `oceania_australia-arid-temperate.md`, `oceania_australia-tropical-north.md`, `oceania_pacific-islands-nz.md`\n- Polar: `arctic.md`, `antarctic.md`\n\nThe Pacific Islands & New Zealand file and a few Oceania/South America/Central Asia files remain broader overviews collapsing significant internal diversity \u2014 split further as detail is added, same as the original Sub-Saharan Africa/Asia split.\n\n## To add a new region\nCopy `TEMPLATE.md`, fill in the header from `docs/REGIONS.md`, and cross-check any species/disease claims against at least one authoritative source (WHO, CDC, or a regional health ministry) before treating it as reliable.\n"}, {"path": "02-first-aid-medical/childbirth-basics.md", "title": "Childbirth Basics", "group": null, "content": "# Childbirth Basics (Emergency, Unattended)\n\nFor situations with no trained birth attendant available. This is not a substitute for prenatal care or a trained midwife/doctor when any is reachable \u2014 seek one if at all possible before labor.\n\n## Before labor \u2014 if you have any advance notice\n- Identify the nearest source of skilled help (clinic, midwife, hospital) and a way to reach it.\n- Prepare clean supplies: clean cloths/towels, a clean blanket for the baby, something to tie the cord (clean string/shoelace, boiled first if possible), clean scissors or blade (boiled/flamed to sterilize), a container for the placenta.\n- Clean water and soap for handwashing.\n\n## Recognizing labor\n- Regular, increasingly strong/frequent contractions (tightening across the belly).\n- \"Water breaking\" \u2014 fluid gush or trickle.\n- Bloody show (mucus with streaks of blood).\n- First-time births: often many hours from first signs to delivery \u2014 there is usually more time than it feels like. Repeat births tend to progress faster.\n\n## During labor\n- Let the person move/position however is most comfortable \u2014 squatting, hands and knees, side-lying, or standing are all normal; there's no single required position.\n- Encourage slow breathing through contractions, rest between them.\n- Do not attempt to speed things up by pulling, pushing on the belly, or internal exams unless trained.\n\n## Delivery \u2014 what to do\n1. Wash your hands thoroughly.\n2. As the head crowns (becomes visible), support it gently \u2014 do not pull.\n3. Once the head is out, check gently if the cord is looped around the neck \u2014 if so and it's loose, slip it over the head; if tight, do not panic, most births still proceed fine, keep going.\n4. The body usually follows within one more contraction/push. Support the baby as it emerges \u2014 newborns are slippery.\n5. **Immediately dry and warm the baby** \u2014 this is one of the most important steps. Place on the parent's bare chest, cover both with a blanket.\n6. The baby should begin crying/breathing within the first minute. If not: rub the back firmly, flick the soles of the feet, clear the mouth/nose gently with a clean cloth. If still not breathing after this, begin infant rescue breaths (small, gentle puffs, ~40-60/min) \u2014 this is different from adult CPR technique, use much less force.\n\n## After delivery\n- **Cord**: no rush to cut it \u2014 it can be left attached for several minutes to hours; a placenta following in a bucket/bag is manageable. If cutting: tie tightly in two places a few inches apart, cut between the ties with a sterile blade.\n- **Placenta**: usually delivers within 5-30 min after the baby, with mild contractions. Do not pull on the cord to force it. Save it if a provider can examine it later (should be delivered whole); heavy ongoing bleeding after delivery without the placenta coming is an emergency \u2014 evacuate urgently.\n- **Bleeding after birth**: some bleeding is normal. Uterine massage (firmly rubbing the lower belly in circular motions) after the placenta delivers helps the uterus contract and reduces bleeding. Soaking more than one large pad per hour, or persistent heavy bleeding, is an emergency.\n- **Breastfeeding**: putting the baby to the breast soon after birth helps the uterus contract (reduces bleeding) and starts feeding \u2014 even before milk fully comes in, colostrum (early milk) is valuable.\n\n## Warning signs requiring urgent evacuation, if any resource is reachable\n- Heavy bleeding (soaking through cloths rapidly) before or after delivery\n- Baby not delivered after many hours of strong, regular pushing (obstructed labor)\n- Cord or a limb presenting first instead of the head (malposition)\n- Seizures, severe headache, or vision changes in the parent (possible eclampsia)\n- Baby not breathing after rescue breath attempts\n- High fever in parent or baby in the days following birth\n\n## Cultural/religious note\nBirth practices, who is permitted in the room, placenta handling, and naming/ritual timing vary widely by tradition \u2014 see `religious-cultural-considerations.md`. Defer to the family's wishes wherever it doesn't conflict with an immediate safety step above.\n"}, {"path": "02-first-aid-medical/dental-emergencies.md", "title": "Dental Emergencies", "group": null, "content": "# Dental Emergencies\n\nSource: Hesperian *Where There Is No Dentist*-style field guidance. Dental pain/infection can become life-threatening (airway-obstructing swelling, spreading infection) if ignored \u2014 treat seriously.\n\n## Toothache\n- Rinse mouth with warm salt water (\u00bd tsp salt per cup).\n- Gently floss around the tooth to remove trapped food that may be causing pressure.\n- Clove oil applied to the tooth/gum with a cotton swab is a traditional, reasonably effective topical analgesic if available.\n- Avoid extreme hot/cold on the affected side.\n- Persistent pain, swelling, or fever suggests infection/abscess \u2014 needs antibiotics if available and a dentist when reachable; don't ignore it.\n\n## Dental abscess (swelling, throbbing pain, possible fever)\n- This is a bacterial infection that can spread to the jaw, neck, and airway if untreated.\n- Warm salt water rinses several times a day.\n- Antibiotics if available and no allergy (a broad-spectrum option like amoxicillin is commonly used for dental infection where accessible).\n- **Urgent evacuation signs**: swelling spreading to the eye or neck, difficulty swallowing or breathing, fever with facial swelling \u2014 this can become airway-threatening (Ludwig's angina) and is a true emergency.\n\n## Knocked-out tooth (permanent tooth)\n1. Pick it up by the crown (chewing surface), not the root.\n2. If dirty, rinse briefly with clean water/milk \u2014 don't scrub or remove attached tissue fragments.\n3. **Best outcome**: reinsert into the socket immediately if possible, have the person bite gently on clean gauze to hold it in place, seek a dentist within an hour if at all reachable.\n4. If reinsertion isn't possible: store the tooth in milk, or the person's own saliva (inside the cheek), not dry and not in plain water \u2014 the root needs a compatible fluid to survive.\n5. Time matters \u2014 viability drops fast after ~60 minutes out of the socket.\n6. Baby (primary) teeth are generally not reinserted \u2014 consult a dentist if reachable, but this is lower urgency.\n\n## Broken/chipped tooth\n- Rinse mouth with warm water, save any broken fragment (store in milk).\n- Cover a sharp edge with dental wax, sugar-free gum, or even soft candle wax to protect the tongue/cheek.\n- See a dentist when reachable \u2014 even a \"minor\" chip can expose the nerve.\n\n## Lost filling/crown\n- Keep the crown if intact \u2014 can sometimes be temporarily re-cemented with dental cement (denture adhesive or even a small amount of toothpaste in a pinch, temporary only) until proper care is reachable.\n- Avoid chewing on that side.\n\n## Object caught between teeth\n- Floss gently to remove \u2014 do not use sharp metal objects that could cut the gum or damage enamel.\n\n## Basic prevention (important when dental care access is limited)\n- Brush twice daily even with improvised tools (a frayed twig \"chew stick\" from a non-toxic tree species works in a pinch, or salt on a cloth-wrapped finger).\n- Limit sugar/sticky foods, especially without regular brushing access.\n- Rinse with water after meals if brushing isn't possible.\n"}, {"path": "02-first-aid-medical/medical-emergencies.md", "title": "Medical Emergencies", "group": null, "content": "# Medical Emergencies (Non-Trauma)\n\nRecognizing and responding to sudden illness in the field, without diagnostic equipment.\n\n## Heart attack\n- **Signs**: chest pain/pressure (may radiate to arm, jaw, back), shortness of breath, sweating, nausea, lightheadedness. Women, older adults, and diabetics may have subtler symptoms (fatigue, indigestion-like discomfort instead of classic chest pain).\n- **Response**: have the person rest in a comfortable position (often sitting, leaning slightly forward), loosen tight clothing, keep calm. If aspirin is available and the person has no known bleeding disorder or allergy, chewing one adult (325mg) or four low-dose (81mg) tablets can reduce damage \u2014 only if you're reasonably confident it's cardiac and not another cause of chest pain.\n- Evacuate urgently; be ready to start CPR if they become unresponsive and stop breathing normally.\n\n## Stroke\n- **F.A.S.T. check**: **F**ace drooping on one side, **A**rm weakness/drift on one side, **S**peech slurred or strange, **T**ime \u2014 note when symptoms started (critical for any later treatment).\n- Other signs: sudden confusion, vision loss, severe headache, loss of balance/coordination.\n- Response: keep the person safe and still, note the time of onset, do not give food/water/medication (swallowing may be impaired, aspiration risk), evacuate urgently \u2014 time-critical.\n\n## Seizure\n- Protect from injury: clear the area of hard/sharp objects, cushion the head, do not restrain the person or put anything in their mouth.\n- Time the seizure. Most stop within 1-3 minutes.\n- After: roll onto their side (recovery position) once shaking stops, to keep the airway clear as they regain consciousness.\n- Seek urgent care if: seizure lasts over 5 minutes, a second seizure follows without regaining consciousness, it's their first seizure ever, injury occurred, or they don't regain normal consciousness within ~20-30 min.\n\n## Anaphylaxis (severe allergic reaction)\n- **Signs**: rapid swelling (face/throat/tongue), difficulty breathing/wheezing, widespread hives, rapid pulse, dizziness/fainting, often after a sting, food, or medication.\n- **Response**: epinephrine auto-injector if available \u2014 administer immediately into the outer thigh, through clothing if needed, this is not optional-if-in-doubt in a true anaphylactic reaction. Call for/move toward advanced care regardless \u2014 a second reaction wave can occur after the first dose wears off (~15-20 min). Lay flat with legs elevated unless breathing is easier sitting up; if unconscious/not breathing normally, begin CPR.\n\n## Diabetic emergencies\n- **Low blood sugar (hypoglycemia)** \u2014 shaking, sweating, confusion, irritability, can progress to unconsciousness: give fast sugar (juice, regular soda, glucose tablets/gel) if conscious and able to swallow. Should improve in 15 min; recheck/repeat if not. Do not give anything by mouth if unconscious \u2014 this is now an emergency requiring evacuation.\n- **High blood sugar (hyperglycemia/DKA)** \u2014 excessive thirst/urination, fruity-smelling breath, confusion, deep rapid breathing: harder to distinguish in the field; if uncertain whether high or low and the person is conscious and can swallow safely, a small amount of sugar generally does far less harm if wrong than withholding it does if they're actually low \u2014 but evacuate either way, this needs medical management.\n\n## Choking (see also quick-reference)\n- Effective cough = let them keep coughing.\n- No air movement: 5 back blows, then 5 abdominal thrusts, alternating, until cleared or the person loses consciousness \u2192 begin CPR (compressions can help dislodge an object too \u2014 check the mouth briefly between cycles, only remove an object you can actually see).\n\n## Heat illness\n- **Heat exhaustion**: heavy sweating, weakness, dizziness, nausea, cool/clammy skin. Move to shade/cool area, remove excess clothing, sip water, cool with wet cloths/fanning.\n- **Heat stroke** (emergency): hot/dry or flushed skin, confusion, very high body temperature, possible unconsciousness. Cool aggressively \u2014 wet the body and fan, ice packs at neck/armpits/groin if available, evacuate urgently \u2014 heat stroke is fatal without rapid cooling.\n\n## Cold illness\n- **Hypothermia**: shivering (may stop as it worsens \u2014 a bad sign), confusion, slurred speech, clumsiness. Get out of wet/cold conditions, remove wet clothing, warm gradually (dry insulation, warm \u2014 not hot \u2014 packs at core/torso/armpits/groin, warm sweet drinks if conscious and alert), avoid rough handling (risk of cardiac arrhythmia in severe cases). Do not rewarm extremities before the core if severe \u2014 can cause dangerous blood pressure shifts.\n- **Frostbite**: numbness, white/grey/waxy skin. Rewarm gradually in warm (not hot) water once away from refreeze risk \u2014 refreezing thawed tissue causes far worse damage than staying frozen until you reach definitive shelter. Do not rub the area.\n\n## Poisoning / ingestion\n- Identify what was ingested if possible (keep the container/plant sample).\n- Do not induce vomiting unless specifically directed by a poison control resource for that substance \u2014 some substances (petroleum products, caustics) cause more damage coming back up.\n- Conscious and alert: rinse the mouth, small sips of water if advised for the specific substance.\n- Unconscious or difficulty breathing: recovery position, monitor airway, evacuate urgently.\n\n## Dehydration\n- Signs: thirst, dark urine, dry mouth, fatigue, dizziness, in severe cases confusion/rapid heartbeat.\n- Oral rehydration: clean water plus a pinch of salt and a bit of sugar per liter improves absorption (basic oral rehydration solution) \u2014 especially important with diarrhea/vomiting losses.\n"}, {"path": "02-first-aid-medical/mental-health-psychological-first-aid.md", "title": "Mental Health Psychological First Aid", "group": null, "content": "# Mental Health & Psychological First Aid\n\nCrisis and disaster conditions cause serious psychological strain, on top of physical risk. This affects decision-making and group cohesion, not just individual wellbeing \u2014 treat it as a real first aid category.\n\n## Psychological first aid \u2014 core principles (WHO framework: Look, Listen, Link)\n1. **Look**: check for safety, for people with obvious signs of distress, and for basic needs (injury, safety, food/water/shelter) that need addressing first \u2014 psychological support can't substitute for unmet physical needs.\n2. **Listen**: approach calmly, ask what they need, listen without pressuring them to talk about the traumatic event itself. Being present and calm is often more helpful than any specific technique.\n3. **Link**: help connect people to practical support \u2014 information, family/social connection, basic services. Isolation worsens outcomes; help people reconnect with others.\n\n## What helps in acute distress\n- Calm, steady presence; simple, clear information (uncertainty increases distress).\n- Basic needs first: safety, warmth, water, food, rest.\n- Keep familiar routines/roles going where possible (chores, caregiving roles) \u2014 a sense of purpose and normalcy is protective.\n- Reconnect people with family/social groups as soon as safely possible.\n- Give people some sense of control/choice where possible, even small (what to eat, what task to do).\n\n## What to avoid\n- Forcing someone to recount traumatic details (\"debriefing\" immediately after trauma is not shown to help and can worsen outcomes).\n- Dismissing or minimizing (\"at least you're alive,\" \"others have it worse\") \u2014 acknowledge the difficulty instead.\n- Over-promising (\"everything will be fine\") when you can't know that.\n- Leaving distressed individuals isolated.\n\n## Recognizing acute stress reactions (normal, usually time-limited)\nShock, denial, anxiety, anger, guilt, difficulty concentrating, sleep disruption, physical symptoms (headache, stomach upset) with no clear physical cause. Most people recover with time, safety, and support \u2014 this is not the same as a mental illness.\n\n## When more urgent action is needed\n- **Suicidal thoughts/expressed intent**: take seriously, do not leave the person alone, remove access to means if possible (weapons, medications), keep talking calmly, get them to any available mental health or medical support as soon as possible.\n- **Psychosis** (disconnection from reality, hallucinations, severe confusion not explained by injury/fever): keep the person safe, calm, and in a low-stimulation environment; avoid confrontation over their beliefs; seek trained help if any is reachable.\n- **Severe panic attack**: help them slow their breathing (in for 4 counts, hold for 4, out for 6-8), ground them in the present (name 5 things they can see, 4 they can hear, etc.), stay with them until it passes (usually 10-20 min).\n\n## Supporting children\n- Children take behavioral cues from calm adults \u2014 your own composure matters more than what you say.\n- Keep routines and physical affection/reassurance consistent where possible.\n- Answer questions honestly at an age-appropriate level; don't overshare details that add fear without helping them.\n- Watch for regression (bedwetting, clinginess, tantrums) \u2014 normal short-term stress response in children, usually resolves with stability and support.\n\n## Supporting caregivers/responders themselves\n- Rotate physically and emotionally demanding tasks among available people where possible \u2014 sustained exposure without rest degrades judgment and increases error/injury risk.\n- Basic self-care (sleep, food, water, brief breaks) is not optional for people in a caregiving/leadership role \u2014 it directly affects everyone depending on them.\n- Peer support (checking in with each other) is one of the most effective, resource-free interventions available.\n\n## Long-term / ongoing\n- Grief, prolonged sadness, persistent anxiety, or trauma symptoms that don't improve over weeks-months may need more structured support when any mental health resource becomes reachable again \u2014 this file covers acute/field response, not treatment of ongoing conditions.\n\nSee `religious-cultural-considerations.md` \u2014 grief rituals, mourning practices, and beliefs about death vary significantly and matter a great deal to psychological wellbeing; support the family's practices rather than a single standard approach.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/TEMPLATE.md", "title": "TEMPLATE", "group": "regional-health-considerations", "content": "Region: [Subregion], [Macro-region]\nApprox. bounding box: [lat]\u00b0N\u2013[lat]\u00b0N, [long]\u00b0W/E\u2013[long]\u00b0W/E\nCountries/territories (as of [year]): [list \u2014 informational only, not the primary key]\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# [Subregion] Health Considerations\n\n## Climate-driven risks\n-\n\n## Disease patterns\n-\n\n## Dangerous species\nSee `06-animals-insects/` for identification. Named here for cross-reference only:\n-\n\n## Notes\n-\n"}, {"path": "02-first-aid-medical/regional-health-considerations/antarctic.md", "title": "Antarctic", "group": "regional-health-considerations", "content": "Region: Antarctic\nApprox. bounding box: 90\u00b0S\u201360\u00b0S, all longitudes\nCountries/territories (as of 2026): no permanent civilian population; governed by the Antarctic Treaty System, occupied only by research stations and seasonal personnel from many nations\nNote: this file intentionally departs from the standard template \u2014 Antarctica has no permanent inhabitants or civilian territory boundaries in the usual sense.\n\n# Antarctic \u2014 Health Considerations\n\nThis is a fundamentally different risk profile from every other file in this set \u2014 there is essentially no self-sufficient civilian survival scenario here outside an organized, supported research program.\n\n## Climate-driven risks\n- The coldest, driest, windiest continent on Earth \u2014 extreme cold is a constant, not a seasonal event.\n- Near-total isolation from outside medical support for much of the year, especially during the austral winter when most stations are unreachable by air or sea.\n\n## Disease patterns\n- Minimal infectious disease burden, due to extreme isolation and a small, health-screened population.\n- Most medical risk here is environmental and traumatic (cold injury, falls, crevasse hazards) rather than infectious.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- No native land predators or venomous species.\n- Coastal/open-water hazards involve marine wildlife (leopard seals near ice edges) rather than the bite/sting risks seen elsewhere in this archive.\n\n## Notes\n- Medical evacuation can be entirely unavailable for months during the winter season \u2014 prevention and redundancy in any expedition planning matter more here than anywhere else in this archive. This file is informational context, not a substitute for the specialized training and support any real Antarctic expedition requires.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/arctic.md", "title": "Arctic", "group": "regional-health-considerations", "content": "Region: Arctic\nApprox. bounding box: 66\u00b0N\u201390\u00b0N, all longitudes\nCountries/territories (as of 2026): northern Canada, Alaska (US), Greenland (Denmark), northern Scandinavia (Norway, Sweden, Finland), northern Russia\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Arctic \u2014 Health Considerations\n\n## Climate-driven risks\n- Extreme cold, especially in winter; permafrost terrain; extreme seasonal daylight variation (near-continuous daylight in summer, near-continuous darkness in winter) affects sleep, activity planning, and morale.\n- Hypothermia and frostbite risk is dominant and near-constant \u2014 not a seasonal spike but a standing baseline concern.\n\n## Disease patterns\n- Low infectious disease burden overall, due to sparse population and cold-limited vectors.\n- **Trichinosis** \u2014 risk from undercooked wild game (bears, walrus, some marine mammals) in traditional/subsistence hunting contexts; cook thoroughly.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- **Polar bears** \u2014 a serious, potentially lethal predation risk across much of this region, unlike almost anywhere else in this archive. Treat bear-avoidance and camp discipline (food storage away from sleeping areas, noise/visual deterrents, situational awareness) as a primary safety item, not an afterthought.\n\n## Notes\n- Evacuation timelines can be extremely long and weather-dependent \u2014 err heavily toward prevention and conservative decision-making rather than reactive treatment.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/central-america-caribbean_islands.md", "title": "Central America Caribbean \u2014 Islands", "group": "regional-health-considerations", "content": "Region: Caribbean Islands, Central America & Caribbean\nApprox. bounding box: 10\u00b0N\u201327\u00b0N, 85\u00b0W\u201359\u00b0W\nCountries/territories (as of 2026): Cuba, Dominican Republic, Haiti, Jamaica, Puerto Rico, Bahamas, Lesser Antilles chain\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Caribbean Islands \u2014 Health Considerations\n\n## Climate-driven risks\n- Hurricane season roughly June\u2013November, peaking August\u2013October \u2014 the dominant environmental risk across this subregion.\n- Many islands have limited internal evacuation routes/high ground \u2014 factor this heavily into stay-or-go decisions ahead of a storm.\n\n## Disease patterns\n- **Dengue, chikungunya, Zika** \u2014 widespread, same *Aedes* mosquito vector as the Central American mainland.\n- **Cholera** \u2014 has persisted in parts of Haiti following the 2010 outbreak; reinforces water/sanitation discipline in affected areas.\n- **Leptospirosis** \u2014 risk increases after flooding from heavy rain/hurricanes.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Most islands are comparatively snake-poor relative to the Central American mainland \u2014 land-animal bite risk is lower here than most subregions in this archive.\n- **Lionfish** \u2014 invasive, venomous spines, now widespread across Caribbean reefs; avoid handling.\n- Fire coral and various jellyfish in coastal waters; some islands have scorpions.\n\n## Notes\n- Given the hurricane exposure and constrained evacuation routes on smaller islands, treat storm-season preparation (see `01-quick-reference/evacuation-bugout-checklist.md`) as a standing priority here, not a reactive one.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/central-america-caribbean_isthmus.md", "title": "Central America Caribbean \u2014 Isthmus", "group": "regional-health-considerations", "content": "Region: Central American Isthmus, Central America & Caribbean\nApprox. bounding box: 7\u00b0N\u201318\u00b0N, 92\u00b0W\u201377\u00b0W\nCountries/territories (as of 2026): Guatemala, Belize, Honduras, El Salvador, Nicaragua, Costa Rica, Panama\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Central American Isthmus \u2014 Health Considerations\n\n## Climate-driven risks\n- Tropical climate with a Caribbean-side hurricane season (roughly June\u2013November); heavy rains bring landslide risk on the region's steep volcanic terrain.\n- Active volcanism across much of the isthmus \u2014 ashfall and evacuation planning are relevant near several active volcanoes.\n\n## Disease patterns\n- **Dengue, Zika, chikungunya** \u2014 all transmitted by the same widespread *Aedes* mosquito; bite prevention is the shared defense.\n- **Malaria** \u2014 present in some rural/border areas, generally lower intensity than tropical South America or Sub-Saharan Africa.\n- **Chagas disease** \u2014 spread by the triatomine (\"kissing bug\"), associated with traditional adobe/thatch housing where the insect can nest in wall cracks; more relevant in rural housing than urban areas.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Fer-de-lance \u2014 responsible for a large share of serious snakebites in the region, found in both forest and agricultural land, sometimes near human settlement\n- Eyelash viper, coral snake species\n- Africanized honeybees present \u2014 more defensive than European honeybees, treat any hive disturbance as higher risk\n\n## Notes\n- Volcanic and seismic hazard planning is relevant across much of this subregion \u2014 cross-reference `01-quick-reference/emergency-type-triage.md`.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/central-asia_steppe-and-highlands.md", "title": "Central Asia \u2014 Steppe And Highlands", "group": "regional-health-considerations", "content": "Region: Central Asian Steppe, Desert & Highlands, Central Asia\nApprox. bounding box: 35\u00b0N\u201356\u00b0N, 46\u00b0E\u201388\u00b0E\nCountries/territories (as of 2026): Kazakhstan, Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, western China (Xinjiang) border zone\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Central Asian Steppe, Desert & Highlands \u2014 Health Considerations\n\n## Climate-driven risks\n- Continental climate extremes: very hot summers, very cold winters, low precipitation. Large deserts (Karakum, Kyzylkum) in the southern portion, steppe grassland further north, and the Pamir/Tian Shan high mountain ranges in the southeast of this zone.\n\n## Disease patterns\n- Relatively low infectious disease burden overall.\n- **Plague (*Yersinia pestis*)** has documented natural foci in some steppe/rodent habitats historically \u2014 avoid handling sick or dead rodents, a standing low-probability but high-severity precaution.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Few highly dangerous species; some viper species present in the southern desert areas, related to genera found in the Middle East.\n\n## Notes\n- The Pamir and Tian Shan ranges within this macro-region carry the same altitude-illness considerations as the other high-altitude subregions in this archive \u2014 apply the same gradual-ascent discipline there.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/east-asia_temperate.md", "title": "East Asia \u2014 Temperate", "group": "regional-health-considerations", "content": "Region: Temperate East Asia, East Asia\nApprox. bounding box: 22\u00b0N\u201345\u00b0N, 100\u00b0E\u2013146\u00b0E\nCountries/territories (as of 2026): China (east/central), Japan, South Korea, North Korea, Taiwan\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Temperate East Asia \u2014 Health Considerations\n\n## Climate-driven risks\n- Four distinct seasons across most of this subregion; monsoon-influenced summer rains; typhoon exposure along the eastern coast (Japan, Taiwan, coastal China, Korea) roughly June\u2013October.\n- Earthquake and tsunami risk is significant along the Japanese archipelago and parts of the Chinese/Taiwanese coast.\n\n## Disease patterns\n- **Japanese encephalitis** \u2014 present in rural rice-farming areas; vaccination where reachable.\n- Seasonal influenza patterns are significant given high population density in parts of this subregion.\n- Strong healthcare infrastructure in urban Japan/Korea generally reduces overall risk relative to less-resourced subregions in this archive.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Mamushi pit viper (Japan, Korea, parts of China) \u2014 the most medically significant snake across this subregion.\n- Asian giant hornet present in parts of this region \u2014 very painful, occasionally dangerous stings, especially with multiple stings or in an allergic individual.\n\n## Notes\n- Cross-reference `01-quick-reference/emergency-type-triage.md` for earthquake/tsunami response given the seismic risk here.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/east-asia_tibetan-plateau.md", "title": "East Asia \u2014 Tibetan Plateau", "group": "regional-health-considerations", "content": "Region: Tibetan Plateau & East Asian Hi
