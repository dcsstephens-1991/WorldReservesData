and food preservation (brining, pickling).\n\n## Basic lab safety principles (apply to any hands-on chemistry, from soap-making to biodiesel)\n- Always add acid to water, not water to acid, when diluting concentrated acids \u2014 adding water to concentrated acid can cause a violent, splattering exothermic reaction; the reverse order is safer.\n- Work in ventilated spaces \u2014 many chemical reactions produce fumes that are harmful in enclosed spaces.\n- Never mix chemicals without knowing what the reaction produces \u2014 some common household chemical combinations (e.g. bleach and ammonia) produce dangerous toxic gas.\n- Label containers clearly and never store chemicals in unlabeled or food-labeled containers \u2014 a major cause of accidental poisoning.\n- Keep a source of clean water nearby for rinsing skin/eyes in case of contact with a caustic or irritant substance.\n\n## Common useful reactions referenced elsewhere in this archive\n- **Saponification** (fat/oil + lye \u2192 soap) \u2014 see `soap-and-cleaning-agents.md`.\n- **Combustion** (fuel + oxygen \u2192 heat, light, byproducts) \u2014 see `08-energy-power/fuels-basics.md`.\n- **Fermentation** (biological, not purely chemical, but relevant) \u2014 see `04-food-agriculture/` food preservation content as it develops.\n\n## Needs deeper research\nPeriodic table reference and element properties relevant to metalworking/materials, more detailed reaction chemistry, basic quantitative chemistry (measuring/mixing ratios accurately without lab equipment).\n"}, {"path": "10-chemistry-materials/fuels-combustion-basics.md", "title": "Fuels Combustion Basics", "group": null, "content": "# Fuels & Combustion \u2014 Chemistry Basics\n\nChemistry-focused companion to `08-energy-power/fuels-basics.md`, which covers the practical/production side.\n\n## What combustion actually is\nCombustion is a rapid oxidation reaction: a fuel (typically carbon and hydrogen-rich material \u2014 wood, charcoal, oil, biogas) reacts with oxygen, releasing energy as heat and light, and producing byproducts (primarily carbon dioxide and water vapor with complete combustion; carbon monoxide, soot/particulates, and other compounds with incomplete combustion).\n\n## Complete vs. incomplete combustion\n- **Complete combustion** requires adequate oxygen supply relative to the fuel being burned \u2014 produces more heat per unit of fuel and fewer harmful byproducts.\n- **Incomplete combustion** (insufficient oxygen \u2014 a common result of a poorly ventilated fire or stove) produces carbon monoxide, a colorless, odorless, genuinely lethal gas \u2014 this is the chemistry behind why enclosed-space ventilation is repeatedly emphasized throughout this archive (`07-shelter-construction/emergency-shelter-basics.md`, `08-energy-power/fuels-basics.md`) whenever combustion happens indoors.\n- Practical implication: a well-designed fire/stove with good airflow burns more efficiently (more heat, less fuel used, less smoke) than a smothered, poorly ventilated one.\n\n## Why different fuels burn differently\n- Energy content (heat released per unit of fuel) varies significantly by fuel type \u2014 this is why charcoal (more energy-dense after processing) burns hotter than the raw wood it was made from.\n- Moisture content matters enormously \u2014 wet/green wood wastes a significant portion of its combustion energy just evaporating the water it contains, which is the chemistry reason seasoned (dried) wood burns more efficiently, as noted in `08-energy-power/fuels-basics.md`.\n\n## Relevance to fire safety\nUnderstanding that fire requires fuel, oxygen, and heat together (the \"fire triangle\") explains why fire suppression strategies work by removing one of the three: water cools (removes heat), smothering removes oxygen, and clearing a firebreak removes fuel \u2014 directly relevant to the wildfire response in `01-quick-reference/emergency-type-triage.md`.\n\n## Needs deeper research\nSpecific fuel energy content comparisons, stove/fire design for combustion efficiency, biodiesel/biogas combustion chemistry in more depth.\n"}, {"path": "10-chemistry-materials/metallurgy-basics.md", "title": "Metallurgy Basics", "group": null, "content": "# Metallurgy Basics\n\nChemistry/materials-science companion to `09-tools-manufacturing/blacksmithing-basics.md`, which covers the practical working of metal.\n\n## Iron and steel \u2014 the core distinction\n- **Iron** in its pure form is relatively soft; **steel** is iron alloyed with a controlled small amount of carbon (roughly 0.05-2% by common definitions), which significantly increases hardness and strength \u2014 this is why steel, not pure iron, is the material of choice for tools and blades.\n- **Cast iron** has a higher carbon content than steel, making it hard but brittle \u2014 good for compression-loaded applications (cookware, some structural uses) but poor for anything needing to flex or resist impact without cracking.\n- Too much carbon makes steel increasingly hard but also increasingly brittle \u2014 tool design balances hardness (edge retention) against toughness (resistance to chipping/breaking) based on the specific tool's use.\n\n## Heat treatment \u2014 the chemistry behind it\n- **Hardening**: heating steel above a specific transformation temperature (where its internal crystal structure changes) and then rapidly cooling (quenching, in water, oil, or another medium) locks the steel into a harder, but more brittle, crystal structure.\n- **Tempering**: reheating hardened steel to a lower temperature (well below the original hardening temperature) reduces brittleness while retaining most of the added hardness, by allowing some internal stress relief \u2014 this is why the two-step process (harden, then temper) matters, as noted in `09-tools-manufacturing/blacksmithing-basics.md`.\n- **Annealing**: heating steel and cooling it slowly (rather than quenching) softens it, useful for making steel easier to work/shape before a final hardening step, or for relieving internal stress in a finished piece.\n\n## Corrosion (rusting) \u2014 the chemistry\nRust is iron oxidizing (reacting with oxygen and moisture) \u2014 the same basic oxidation chemistry as combustion, just far slower. Practical implications: keeping metal tools dry and lightly oiled meaningfully slows this process; some alloying elements (chromium, notably, in stainless steel) resist this reaction far better than plain steel, though stainless steel is harder to produce/work without industrial equipment.\n\n## Other metals worth knowing as categories\n- **Copper and bronze** (copper-tin alloy) \u2014 historically significant, workable at lower temperatures than iron/steel, good electrical/thermal conductivity, more resistant to corrosion than iron in many environments, but softer \u2014 less suited to edge tools, well suited to fittings, wiring, and cookware.\n- **Aluminum** \u2014 light, corrosion-resistant, but requires quite high processing temperatures/technology to produce from ore; more realistic to reuse/recycle existing aluminum than to produce new aluminum from raw materials in a low-infrastructure setting.\n\n## Needs deeper research\nSpecific heat-treatment temperature ranges by steel type, ore identification and smelting basics, alloying in more depth, corrosion prevention/treatment methods beyond basic oiling.\n"}, {"path": "10-chemistry-materials/soap-and-cleaning-agents.md", "title": "Soap And Cleaning Agents", "group": null, "content": "# Soap & Cleaning Agents\n\n## Basic soap-making chemistry (saponification)\n- Soap is made by reacting a fat or oil with an alkali (traditionally lye \u2014 sodium hydroxide for hard bar soap, or potassium hydroxide for softer/liquid soap) \u2014 this reaction is called saponification.\n- **Lye is caustic and genuinely dangerous to handle carelessly** \u2014 it causes serious chemical burns on contact with skin/eyes. Always wear eye protection and gloves, work in a ventilated area, and follow the acid/water safety principle from `basic-chemistry-reference.md` (add lye to water, not water to lye, when dissolving it \u2014 same splatter-risk logic).\n- Traditional lye source: wood ash leached with water (producing a lye solution, historically how soap was made before manufactured lye was available) \u2014 a real, functional method, though the resulting lye's concentration is harder to control precisely than manufactured lye, making the resulting soap's strength less predictable.\n- Basic process: dissolve lye in water (careful, exothermic \u2014 the solution heats up), combine with melted fat/oil at a compatible temperature, mix until the mixture thickens and reaches \"trace\" (a visible thickening indicating the saponification reaction is progressing), pour into molds, and let cure \u2014 the reaction continues after pouring, and a curing period (commonly cited as around 4-6 weeks for bar soap) allows excess moisture to evaporate and the soap to fully saponify and mellow, producing a milder final bar.\n- Fat/oil source matters for the final soap's properties \u2014 different fats produce different hardness, lather, and skin-feel; animal fat (tallow, lard) and various plant oils are all traditional soap-making inputs.\n\n## Basic cleaning agents beyond soap\n- **Ash and sand** \u2014 usable as mild abrasive cleaners for dishes/hands when soap isn't available, referenced in `02-first-aid-medical/sanitation-hygiene.md` as a handwashing substitute.\n- **Vinegar (dilute acetic acid)** \u2014 a mild acid useful for general cleaning and some disinfecting applications, widely available if fermentation (see `04-food-agriculture/` preservation content) is set up.\n- **Boiling water** \u2014 itself a basic disinfecting method for surfaces/utensils when chemical cleaners aren't available.\n\n## Needs deeper research\nDetailed saponification ratios/recipes by fat type, wood-ash lye concentration testing methods, additional traditional cleaning agent recipes.\n"}]}, {"id": "11", "label": "11 \u00b7 Navigation & Comms", "files": [{"path": "11-navigation-comms/README.md", "title": "README", "group": null, "content": "# 11 \u2014 Navigation & Communications\n\n## Contents\n- [x] `map-compass-basics.md` \u2014 topographic map reading, compass use and declination, dead reckoning\n- [x] `celestial-navigation-basics.md` \u2014 sun/shadow-stick and star-based direction finding\n- [x] `radio-communications-basics.md` \u2014 radio types, range/antenna principles, family communication planning\n\n## Cross-references\n- Signaling for rescue is covered in `01-quick-reference/fire-shelter-signal.md` \u2014 not duplicated here.\n\n## Still to build\n- Detailed UTM/grid coordinate systems and triangulation\n- Antenna construction and frequency/band reference by region\n- Morse code reference\n"}, {"path": "11-navigation-comms/celestial-navigation-basics.md", "title": "Celestial Navigation Basics", "group": null, "content": "# Celestial Navigation Basics\n\nFinding direction and, with more skill, approximate position, using the sun, stars, and moon \u2014 useful when a compass isn't available or to cross-check one.\n\n## Finding direction from the sun\n- The sun rises roughly in the east and sets roughly in the west, though the exact point shifts seasonally (further north/south of due east-west depending on season and latitude) \u2014 a rough but genuinely useful default in the absence of anything more precise.\n- **Shadow-stick method**: place a stick vertically in the ground, mark the tip of its shadow, wait 15-20 minutes, mark the new shadow tip position \u2014 the line between the two marks runs roughly east-west (first mark toward west, second toward east, in the Northern Hemisphere), letting you derive north-south from a line perpendicular to it. This is a well-established, low-tech, reasonably reliable method.\n- **Analog watch method** (Northern Hemisphere): point the hour hand at the sun, the line halfway between the hour hand and 12 o'clock points roughly south (adjust for daylight saving time if applicable). This method is less precise than the shadow-stick method but requires no waiting.\n\n## Finding direction from the stars\n- **Northern Hemisphere**: Polaris (the North Star) sits very close to true north and doesn't appear to move as the sky rotates around it, making it a reliable fixed reference \u2014 find it via the two \"pointer stars\" at the end of the Big Dipper's bowl, which point roughly toward Polaris.\n- **Southern Hemisphere**: there is no equally bright star at the southern celestial pole; the Southern Cross constellation is commonly used instead \u2014 a line extended from the long axis of the cross, combined with a line from two bright \"pointer stars\" nearby, roughly indicates the direction of the south celestial pole where they cross.\n\n## General principles\n- Celestial navigation is more reliable for direction-finding than for precise position-finding without additional tools (a sextant and detailed almanac/calculation, which is a much deeper skill) \u2014 treat the methods above as direction aids, not precise positioning tools.\n- Combine with dead reckoning (`map-compass-basics.md`) for more reliable travel over distance than either method alone.\n\n## Needs deeper research\nSextant-based latitude/position-finding in more depth, additional constellation-based direction methods for different seasons/hemispheres, moon-based direction-finding.\n"}, {"path": "11-navigation-comms/map-compass-basics.md", "title": "Map Compass Basics", "group": null, "content": "# Map & Compass Basics\n\n## Reading a topographic map\n- Contour lines represent elevation \u2014 closely spaced lines mean steep terrain, widely spaced lines mean gentle terrain; learning to read the shape of the land from contour patterns (valleys, ridges, peaks, saddles) is the core map-reading skill.\n- Scale tells you the real-world distance represented by a given map distance \u2014 always check the scale before estimating travel distance/time.\n- Grid systems (like UTM or a national grid) allow precise position reporting as coordinates \u2014 worth understanding at least one grid system, in addition to latitude/longitude, since some grid systems are easier for quick manual position-plotting in the field.\n\n## Using a compass\n- A compass points to magnetic north, which differs from true (geographic) north by an amount called **declination**, which varies by location and changes slowly over time \u2014 for accurate navigation, adjust for the declination specific to your area (marked on most quality topographic maps for their date of printing) rather than assuming magnetic and true north are the same.\n- Basic technique: orient the map so its features align with the compass (accounting for declination), identify recognizable landmarks matching map and terrain, and take a bearing (a compass direction) toward your destination or a landmark to travel by.\n- Keep a compass away from metal objects/electronics that can deflect the needle and give a false reading.\n\n## Dead reckoning (navigating without landmarks)\n- Track direction of travel (compass bearing) and distance (pace count \u2014 the number of steps to cover a known distance, calibrated to your own stride) to estimate position when landmarks aren't visible (dense forest, fog, night travel).\n- Error accumulates over distance with this method \u2014 cross-check against any available landmark or feature periodically to correct drift.\n\n## Latitude and longitude basics\n- Latitude measures position north/south of the equator (0\u00b0 at the equator, 90\u00b0 at the poles); longitude measures position east/west of the prime meridian.\n- This is the same coordinate system used throughout this archive's regional taxonomy (`docs/REGIONS.md`) \u2014 understanding it is directly useful both for navigation and for locating yourself within this archive's regional content.\n\n## Needs deeper research\nDetailed grid coordinate systems (UTM in depth), triangulation technique, terrain association in more depth, map symbol reference.\n"}, {"path": "11-navigation-comms/radio-communications-basics.md", "title": "Radio Communications Basics", "group": null, "content": "# Radio Communications Basics\n\n## Why radio matters when other infrastructure fails\nCell networks and internet depend on extensive, powered infrastructure that can fail during a disaster or extended crisis; radio (especially battery/hand-crank/solar-powered) can function independently of that infrastructure, both for receiving information (news/weather/emergency broadcasts) and, with the right equipment and (in normal times) licensing, for two-way communication.\n\n## Types of radio worth understanding\n- **AM/FM broadcast receiver**: one-way, receive-only \u2014 for emergency broadcasts, news, weather; the most basic and widely accessible radio capability, worth having independent of power grid (battery, hand-crank, or solar powered).\n- **NOAA weather radio (or regional equivalent)**: dedicated weather/emergency alert broadcasts in many countries \u2014 often has a special \"alert\" feature that activates automatically for urgent warnings.\n- **CB (Citizens Band) radio**: short-range (typically a few miles, more with good conditions/antenna), no license required in many countries, useful for local coordination.\n- **Amateur (\"ham\") radio**: significantly greater range and capability (local to global, depending on band and equipment), traditionally requires licensing and testing in normal times, but is the most capable option for genuine long-distance two-way emergency communication; learning the basics before a crisis (when licensing/testing is still functioning normally) is far more practical than trying to learn from scratch during one.\n- **GMRS/FRS radios**: common consumer walkie-talkie type radios, short range, simple to use, useful for close-range family/group coordination (though GMRS technically requires a license in some countries, enforcement in a genuine emergency is a secondary concern to having working communication).\n\n## Basic principles for effective radio use\n- Antenna height and quality matter enormously for range \u2014 a better antenna on a modest radio often outperforms a better radio with a poor antenna.\n- Keep transmissions brief and clear \u2014 congested emergency channels need efficient communication, not long conversations.\n- Establish a family/group communication plan in advance: agreed channels/frequencies, check-in times, and a backup plan if primary radio contact fails \u2014 this is worth doing well before any emergency, not improvised during one.\n- Learn to receive first \u2014 even without transmitting capability, monitoring emergency/weather channels provides valuable situational information.\n\n## Needs deeper research\nSpecific frequency/band reference by region and radio type, antenna building instructions, amateur radio licensing study material (worth pursuing in normal times), Morse code as a fallback communication method.\n"}]}, {"id": "12", "label": "12 \u00b7 Science & Education", "files": [{"path": "12-science-education/README.md", "title": "README", "group": null, "content": "# 12 \u2014 Science & Education\n\n## Contents\n- [x] `core-curriculum-outline.md` \u2014 teaching roadmap and priority order, teaching-without-a-school-system notes\n- [x] `foundational-concepts-cheatsheet.md` \u2014 quick-reference formulas/concepts used elsewhere in the archive\n\n## Curation note\nThis folder currently provides a roadmap and cheat sheet, not full textbook content \u2014 see `docs/PLAN.md` and `docs/CURATION.md` for the plan to source real textbook-depth material from OpenStax (CC-BY) and similar open-license sources rather than generating a full curriculum from general knowledge.\n\n## Still to build\n- Actual textbook-depth content per subject (math, physics, chemistry, biology) \u2014 sourced, not generated\n- Wikiversity/Wikibooks content via the Kiwix pack (see `scripts/download-kiwix.sh`)\n"}, {"path": "12-science-education/core-curriculum-outline.md", "title": "Core Curriculum Outline", "group": null, "content": "# Core Curriculum Outline\n\nA roadmap for re-teaching foundational science and math to a new generation, prioritized by what unlocks the most other knowledge in this archive. Not a textbook itself \u2014 see `Still to build` and `docs/PLAN.md` for the plan to add real textbook content (OpenStax and similar open-license sources are the intended source, per `docs/CURATION.md`).\n\n## Why this order\nMath underlies essentially everything else (measurement, construction, chemistry ratios, navigation); basic literacy and math come first, followed by the sciences roughly in the order that other archive folders depend on them (chemistry underlies `10-chemistry-materials/` and medicine; physics underlies `08-energy-power/` and `07-shelter-construction/`; biology underlies `04-food-agriculture/`, `05-plants-fungi/`, `06-animals-insects/`, and medicine).\n\n## Suggested progression\n\n### Foundational (all ages, first priority)\n- Literacy (reading, writing) \u2014 everything else in this archive depends on it.\n- Arithmetic \u2014 the four basic operations, fractions, decimals, percentages; measurement and units.\n- Basic scientific method \u2014 observation, hypothesis, testing, revising conclusions based on evidence; this is a thinking tool as much as a content area, and worth teaching early and reinforcing throughout.\n\n### Intermediate\n- Pre-algebra and algebra \u2014 solving for unknowns, proportional reasoning (directly useful for recipe/mixture scaling, construction, dosing).\n- Basic geometry \u2014 area, volume, angles (directly useful for construction, land measurement, navigation).\n- Basic biology \u2014 cells, living systems, ecology, genetics fundamentals (directly useful for agriculture, medicine, animal husbandry).\n- Basic chemistry \u2014 see `10-chemistry-materials/basic-chemistry-reference.md` for a starting point already in this archive.\n- Basic physics \u2014 forces, energy, simple machines (directly useful for `07-shelter-construction/structural-basics.md` and `08-energy-power/mechanical-power-basics.md`, both already in this archive).\n\n### Advanced\n- Algebra II, geometry/trigonometry in more depth, introductory calculus \u2014 needed for more advanced engineering.\n- Chemistry and physics in more depth, including the quantitative/lab-work side.\n- Advanced biology \u2014 microbiology (directly relevant to medicine and food safety), advanced genetics.\n\n## Teaching without a school system\n- Multi-age, one-room-schoolhouse-style teaching (older/more advanced students helping teach younger ones) is a well-documented, practical model for education without dedicated age-segregated infrastructure.\n- Hands-on application (using the actual skills from other archive folders \u2014 measuring a real structure, calculating a real recipe scale-up, observing a real ecosystem) reinforces abstract material far more effectively than lecture alone, and requires no specialized classroom equipment.\n\n## Needs deeper research\nActual textbook-level content for each subject (this file is a roadmap, not the content itself) \u2014 see `docs/PLAN.md` for the plan to source this from OpenStax and similar open-license textbooks.\n"}, {"path": "12-science-education/foundational-concepts-cheatsheet.md", "title": "Foundational Concepts Cheatsheet", "group": null, "content": "# Foundational Concepts Cheat Sheet\n\nQuick-reference formulas and concepts likely to be needed across the archive's practical folders, until full textbook content is added.\n\n## Basic math\n- **Area**: rectangle = length \u00d7 width; triangle = \u00bd \u00d7 base \u00d7 height; circle = \u03c0 \u00d7 radius\u00b2.\n- **Volume**: rectangular box = length \u00d7 width \u00d7 height; cylinder = \u03c0 \u00d7 radius\u00b2 \u00d7 height.\n- **Percentages**: part \u00f7 whole \u00d7 100 = percentage. Useful for concentration/dosing calculations (e.g. water purification dosing, soap-making ratios).\n- **Unit conversion basics**: keep a units-and-conversions reference on hand (metric \u27f7 imperial) since sourcing and equipment may use either system.\n\n## Basic physics\n- **Force = mass \u00d7 acceleration** (Newton's second law) \u2014 the foundation of understanding load, structural stress, and simple machines.\n- **Simple machines** (lever, pulley, inclined plane, wheel and axle, wedge, screw) all trade force for distance (or vice versa) \u2014 a longer lever arm or more pulleys means less force needed to move a load, at the cost of moving it a shorter distance per unit of effort, or requiring more total motion. Directly relevant to `07-shelter-construction/`, `09-tools-manufacturing/`, and `08-energy-power/mechanical-power-basics.md`.\n- **Energy is never created or destroyed, only converted** (conservation of energy) \u2014 relevant to understanding why every energy conversion step (mechanical \u2192 electrical \u2192 chemical storage \u2192 mechanical again, for example) loses some usable energy as heat, which is why direct mechanical solutions are often more efficient than converting through electricity, as noted in `08-energy-power/mechanical-power-basics.md`.\n\n## Basic chemistry (see `10-chemistry-materials/basic-chemistry-reference.md` for more)\n- pH scale: 0-14, 7 neutral, lower = more acidic, higher = more basic (alkaline).\n- Combustion = fuel + oxygen \u2192 heat/light + byproducts.\n\n## Basic biology\n- **Cells** are the basic unit of life; all living things are made of one or more cells.\n- **Ecosystems** function through energy flow (generally starting with plants converting sunlight to usable energy via photosynthesis) and nutrient cycling (decomposition returning nutrients to the soil) \u2014 relevant to understanding sustainable agriculture and why soil health matters (`04-food-agriculture/`).\n- **Germ theory**: infectious disease is caused by microorganisms (bacteria, viruses, parasites, fungi) transmitted between hosts \u2014 the entire basis for the sanitation and hygiene practices in `02-first-aid-medical/sanitation-hygiene.md`.\n\n## Scientific method (worth internalizing as a practical tool, not just an academic concept)\n1. Observe something and ask a question.\n2. Form a hypothesis (a testable explanation).\n3. Test it, ideally changing only one variable at a time so you know what actually caused any observed result.\n4. Draw a conclusion based on the actual result, and revise the hypothesis if the evidence doesn't support it.\nThis process is directly applicable to practical troubleshooting throughout this archive \u2014 see `09-tools-manufacturing/general-repair-principles.md` for an applied version of the same logic.\n\n## Needs deeper research\nFull textbook-depth content for each subject area \u2014 this is a summary reference, not a substitute for the curriculum outlined in `core-curriculum-outline.md`.\n"}]}, {"id": "13", "label": "13 \u00b7 Governance & Society", "files": [{"path": "13-governance-society/README.md", "title": "README", "group": null, "content": "# 13 \u2014 Governance & Society\n\n## Contents\n- [x] `basic-law-conflict-resolution.md` \u2014 dispute resolution approaches, rule-making principles, foundational legal concepts\n- [x] `economics-trade-barter-basics.md` \u2014 barter, why currency emerges, value/price principles, fair local trade\n- [x] `community-organization-basics.md` \u2014 decision-making models, necessary community roles, trust-building, breakdown warning signs\n- [x] `history-of-collapse-recovery-lessons.md` \u2014 high-level, widely-corroborated patterns across historical collapse/recovery\n\n## Curation note\n`history-of-collapse-recovery-lessons.md` deliberately stays at the pattern level rather than citing specific historical events/case studies in detail, since detailed historical claims need the same sourcing rigor as the rest of this archive per `docs/CURATION.md` \u2014 a fuller treatment with real case studies is flagged as future work.\n\n## Still to build\n- Detailed historical case studies with proper sourcing\n- Security/defense coordination principles at the community level\n- Resource allocation frameworks\n"}, {"path": "13-governance-society/basic-law-conflict-resolution.md", "title": "Basic Law Conflict Resolution", "group": null, "content": "# Basic Law & Conflict Resolution\n\nGeneral principles for maintaining order and resolving disputes within a group, independent of any specific national legal system that may or may not be functioning.\n\n## Why written/agreed rules matter, even informally\n- Groups without any agreed-upon rules for resolving disputes tend to resolve them through whoever has the most power/force \u2014 a written or at least clearly agreed set of basic rules, decided in advance rather than improvised mid-conflict, produces more consistent and more broadly accepted outcomes.\n- Rules agreed to *before* a specific conflict arises are far more likely to be seen as fair by all parties than rules invented in the moment to resolve a specific dispute.\n\n## Basic dispute resolution approaches\n- **Mediation**: a neutral third party helps disputing parties reach their own agreement, without imposing a decision \u2014 generally preserves relationships better than an imposed ruling, works best when both parties are willing to negotiate in good faith.\n- **Arbitration**: a neutral third party hears both sides and makes a binding decision \u2014 needed when mediation fails or when the parties can't agree even with help; requires the arbitrator to be seen as genuinely neutral to be accepted.\n- **Restorative approaches**: focus on repairing harm (to the victim and the community) rather than only punishing the offender \u2014 often produces better long-term group cohesion than purely punitive approaches, especially in a small, interdependent group where everyone will need to keep working together.\n\n## Basic principles for group rule-making\n- Rules should be clear enough that people can know in advance whether an action violates them \u2014 vague rules invite unequal enforcement and disputes about interpretation.\n- Some form of appeal or review process, even informal, reduces the risk of a single decision-maker's error or bias going unchecked.\n- Proportionality \u2014 consequences should scale to the severity of the violation; consistently disproportionate consequences erode trust in the rule system itself.\n\n## Common foundational legal concepts worth understanding\n- **Property rights** \u2014 some agreed system for what belongs to whom reduces a major source of conflict; doesn't need to be complex, but needs to be clear and consistently applied.\n- **Contracts/agreements** \u2014 a shared understanding that agreements (trade, labor, etc.) will generally be honored, and some method for addressing it when they aren't, underlies most cooperative economic activity (see `economics-trade-barter-basics.md`).\n- **Due process concept** \u2014 the idea that someone accused of wrongdoing gets a fair chance to respond before a consequence is imposed \u2014 a widely-recognized principle across very different legal traditions, worth preserving even informally.\n\n## Needs deeper research\nSpecific historical/traditional community justice systems as case studies, more detailed mediation/arbitration technique, property and contract frameworks in more depth.\n"}, {"path": "13-governance-society/community-organization-basics.md", "title": "Community Organization Basics", "group": null, "content": "# Community Organization Basics\n\n## Why organization matters beyond the individual/family level\nMany of the tasks described elsewhere in this archive (sanitation infrastructure, defense/security, larger construction projects, resource sharing) are more effective, or only possible, at a group scale larger than one household \u2014 community organization is what turns individual survival into a sustainable, rebuilding society.\n\n## Basic decision-making models (each with real tradeoffs)\n- **Direct democracy** (everyone votes on everything) \u2014 high legitimacy/buy-in, but slow and impractical past a fairly small group size.\n- **Representative structures** (elected/chosen representatives make decisions on the group's behalf) \u2014 scales better than direct democracy, but depends on the representatives actually being accountable to the group, which requires some mechanism (elections, recall, term limits) to function well.\n- **Consensus-based decision-making** \u2014 used successfully in many small, tightly-knit communities; requires more time/discussion than voting but tends to produce decisions everyone is genuinely willing to support, reducing the risk of decisions being quietly undermined by people who lost a vote.\n- Different decisions may warrant different models \u2014 a small group deciding on an urgent, time-sensitive action needs a faster process than a group setting long-term shared rules.\n\n## Roles a functioning community tends to need someone responsible for\n- Coordination/leadership (whatever the decision-making model, someone or some body needs to actually organize and communicate decisions)\n- Security/safety (see `01-quick-reference/emergency-type-triage.md` for individual-level guidance; group-level security coordination is a related but distinct need)\n- Resource management (tracking and allocating shared supplies, land, tools)\n- Dispute resolution (see `basic-law-conflict-resolution.md`)\n- Health/medical coordination (who has relevant skills, where supplies are, triage priorities at a group level)\n- Education (see `12-science-education/core-curriculum-outline.md`)\n\n## Building trust and cohesion\n- Shared work on visible, useful projects (building shared infrastructure, community meals) tends to build cohesion faster than abstract discussion alone.\n- Transparent communication about scarce resources and decisions reduces suspicion and factionalism \u2014 secrecy about shared resources is a common source of community breakdown.\n- Clear, fair processes (see `basic-law-conflict-resolution.md`) for handling violations of community norms prevent small conflicts from escalating into lasting divisions.\n\n## Warning signs of community breakdown worth watching for\n- Resource hoarding/secrecy, a collapse in willingness to share information, factions forming around perceived unequal treatment, and a breakdown in whatever dispute-resolution process was in place \u2014 addressing these early, openly, and through the agreed process is far easier than after trust has already broken down.\n\n## Needs deeper research\nHistorical/anthropological case studies of successful small-community organization under stress, specific security/defense coordination principles, resource allocation frameworks.\n"}, {"path": "13-governance-society/economics-trade-barter-basics.md", "title": "Economics Trade Barter Basics", "group": null, "content": "# Economics, Trade & Barter Basics\n\n## Why trade happens\nTrade happens because people/groups have different resources, skills, and needs \u2014 trading lets each party end up with something they value more than what they gave up, without either side needing to produce everything themselves. This is the basic logic behind specialization: it's more efficient for one household/group to focus on what it does relatively well and trade for the rest, than for every household to try to produce everything it needs alone.\n\n## Barter \u2014 direct exchange without currency\n- Works well for simple, small-scale, trust-based exchange, but has real limitations: it requires a \"double coincidence of wants\" (each party must have what the other wants, at the same time) \u2014 this gets harder as the range of goods/needs grows.\n- Barter value can be hard to standardize (how many chickens equal one axe?) without some common reference point.\n\n## Currency/money \u2014 why it emerges even informally\n- Money solves barter's core problem by acting as a common medium of exchange (something widely accepted, so you don't need a direct match of wants) and a store of value (something that holds value over time, so you can trade now and buy later).\n- In the absence of an official/trusted currency, communities have historically settled on informal mediums of exchange \u2014 items that are durable, divisible, widely wanted, and hard to counterfeit or produce in excess have historically served this role (rather than being an arbitrary choice) \u2014 worth understanding these properties even without predicting a specific outcome for any future situation.\n- Trust in the medium of exchange (that others will accept it later) is what actually makes it function as money \u2014 this is a social agreement as much as an economic one.\n\n## Basic principles of value and price\n- Value is generally driven by supply and demand \u2014 scarce, highly wanted goods command more in trade than abundant, less-wanted goods, all else equal.\n- Prices (in barter or currency terms) convey real information \u2014 a sudden price change often reflects a real change in supply or demand worth paying attention to (e.g. a spike in the trade value of a good may indicate a supply disruption worth investigating).\n\n## Basic principles for fair/functional local trade\n- Transparency (both parties understanding what's actually being exchanged and its condition) reduces disputes \u2014 see `basic-law-conflict-resolution.md` for handling disputes when they do arise.\n- Reputation matters enormously in a small, ongoing trading community \u2014 reliability in past trades is often a better guide to a trading partner's trustworthiness than any formal enforcement mechanism.\n\n## Needs deeper research\nHistorical case studies of community currency/exchange systems, cooperative/collective ownership models, basic accounting/record-keeping practices for a small trading community.\n"}, {"path": "13-governance-society/history-of-collapse-recovery-lessons.md", "title": "History Of Collapse Recovery Lessons", "group": null, "content": "# Lessons From Historical Collapse & Recovery\n\nHigh-level, widely-corroborated patterns from documented historical societal disruptions and recoveries \u2014 not a detailed history text (see `Needs deeper research` for what a fuller treatment would need). Intended as practical lessons, not a comprehensive historical record.\n\n## Recurring patterns across many documented collapses/disruptions\n- **Infrastructure and institutional loss compounds** \u2014 the loss of one system (e.g. governance, trade networks) often accelerates the failure of others that depended on it (public health, food distribution) \u2014 this is part of why this archive treats sanitation, water, and basic order as high-priority, interconnected concerns rather than isolated topics.\n- **Local, small-scale systems tend to be more resilient than large, centralized ones** during acute disruption \u2014 a community with local food production, local water sources, and local decision-making capacity can continue functioning even when larger regional/national systems fail, which is a core rationale behind much of this archive's emphasis on locally-executable skills.\n- **Knowledge loss is a major, underappreciated cost of societal disruption** \u2014 skills and information that aren't written down or actively practiced can be lost within a generation once the systems that transmitted them (schools, apprenticeships, stable communities) break down. This is the direct motivation for this archive's existence.\n\n## Recurring patterns in documented recoveries\n- **Recovery tends to be faster where social trust and local organizational capacity survived the disruption**, even when physical infrastructure was severely damaged \u2014 this is a documented pattern in various post-disaster and post-conflict recovery studies, suggesting that `community-organization-basics.md` and `basic-law-conflict-resolution.md` may matter as much for long-term outcomes as physical resources.\n- **External aid/support accelerates recovery but rarely substitutes for local capacity** \u2014 societies with functioning local skills and organization tend to use external support more effectively than those without it.\n- **Recovery is rarely a simple return to the prior state** \u2014 technology, social structures, and priorities often shift meaningfully in the process; treating rebuilding as a chance to address prior weaknesses, not just restore what existed before, is a pattern in more successful long-term recoveries.\n\n## Practical takeaway for this archive\nThe patterns above are part of the reasoning behind this archive's overall structure: broad, locally-executable skill coverage (not dependent on external supply chains), strong emphasis on knowledge preservation itself, and dedicated attention to the social/organizational side of rebuilding (this folder) rather than only the physical/technical side (most other folders).\n\n## Needs deeper research\nDetailed case studies of specific historical collapses and recoveries (with proper sourcing per `docs/CURATION.md`), rather than the generalized pattern-level treatment here.\n"}]}, {"id": "14", "label": "14 \u00b7 Software & Digital", "files": [{"path": "14-software-digital/README.md", "title": "README", "group": null, "content": "# 14 \u2014 Software & Digital Tools\n\nThis is the \"how to actually read this drive\" folder.\n\n## Contents\n- `zim/` \u2014 Kiwix ZIM archives (populated by `scripts/download-kiwix.sh`)\n- `readers/` \u2014 portable copies of Kiwix Desktop installers (Windows/Mac/Linux), a PDF reader, an EPUB reader, for offline install with no app store access\n- `recovery-tools/` \u2014 testdisk/photorec or similar, in case a copy of this drive gets corrupted\n- `os-images/` \u2014 optional: a lightweight Linux live-CD ISO, useful if a working computer needs an OS from scratch\n\n## Note\nKeep installers for at least two platforms (Windows + Linux) since you can't predict what hardware survives.\n"}]}]}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('archive-data').textContent);
  marked.setOptions({ gfm: true, breaks: false });

  const foldersNav = document.querySelector('nav.folders');
  const filelistEl = document.getElementById('filelist');
  const contentEl = document.getElementById('content');

  let totalFiles = 0;
  DATA.folders.forEach(f => totalFiles += f.files.length);
  document.getElementById('stat-files').textContent = totalFiles;
  document.getElementById('stat-folders').textContent = DATA.folders.length - 1;

  let currentFolder = DATA.folders[0].id;
  let currentFile = null;

  DATA.folders.forEach(folder => {
    const btn = document.createElement('button');
    btn.role = 'tab';
    btn.textContent = folder.label;
    btn.dataset.id = folder.id;
    btn.setAttribute('aria-selected', folder.id === currentFolder ? 'true' : 'false');
    btn.addEventListener('click', () => selectFolder(folder.id));
    foldersNav.appendChild(btn);
  });

  function findFolder(id){ return DATA.folders.find(f => f.id === id); }

  function selectFolder(id, fileIndex){
    currentFolder = id;
    document.querySelectorAll('nav.folders button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id ? 'true' : 'false'));
    const folder = findFolder(id);
    filelistEl.innerHTML = '';
    folder.files.forEach((file, i) => {
      const chip = document.createElement('button');
      chip.className = 'filechip';
      chip.innerHTML = (file.group ? '<span class="grp">' + file.group + '</span>' : '') + file.title;
      chip.addEventListener('click', () => selectFile(id, i));
      filelistEl.appendChild(chip);
    });
    selectFile(id, fileIndex || 0);
    try{ localStorage.setItem('worldreserves.folder', id); }catch(e){}
  }

  function selectFile(folderId, index){
    currentFile = index;
    const folder = findFolder(folderId);
    const file = folder.files[index];
    document.querySelectorAll('.filechip').forEach((c, i) => c.setAttribute('aria-current', i === index ? 'true' : 'false'));
    contentEl.innerHTML = '<div class="crumb">' + file.path + '</div>' + marked.parse(file.content);
    contentEl.querySelectorAll('table').forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'table-scroll';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    main.scrollTo({top:0, behavior:'instant'});
    try{ localStorage.setItem('worldreserves.file.' + folderId, index); }catch(e){}
  }

  let startFolder = currentFolder;
  try{
    const saved = localStorage.getItem('worldreserves.folder');
    if(saved && findFolder(saved)) startFolder = saved;
  }catch(e){}
  let startFile = 0;
  try{
    const savedFile = localStorage.getItem('worldreserves.file.' + startFolder);
    if(savedFile !== null) startFile = parseInt(savedFile, 10) || 0;
  }catch(e){}

  selectFolder(startFolder, startFile);
})();
</script>
