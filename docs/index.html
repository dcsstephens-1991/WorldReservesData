ghlands, East Asia\nApprox. bounding box: 26\u00b0N\u201340\u00b0N, 78\u00b0E\u2013104\u00b0E\nCountries/territories (as of 2026): China (Tibet Autonomous Region, Qinghai, western Sichuan), Bhutan border zone\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Tibetan Plateau & East Asian Highlands \u2014 Health Considerations\n\n## Climate-driven risks\n- Among the most extreme high-altitude environments on Earth outside the Himalaya proper \u2014 much of the plateau sits above 4,000m.\n- Extreme cold, thin air, and intense UV year-round.\n\n## Disease patterns\n- **Altitude sickness** is the dominant medical concern by a wide margin.\n- Otherwise low infectious disease burden due to sparse population and a cold climate limiting many disease vectors.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Few dangerous species at this elevation; wolves and occasionally snow leopards present but rarely encountered.\n\n## Notes\n- Same ascent discipline as the Himalayan Foothills and Andean Highlands files in this archive \u2014 evacuation is slow and highly weather-dependent, so treat altitude illness prevention as the primary planning concern.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/europe_central-western-temperate.md", "title": "Europe \u2014 Central Western Temperate", "group": "regional-health-considerations", "content": "Region: Central & Western Europe (temperate), Europe\nApprox. bounding box: 46\u00b0N\u201355\u00b0N, 5\u00b0W\u201324\u00b0E\nCountries/territories (as of 2026): northern France, Germany, Benelux, Switzerland, Austria, Poland, Czechia, Slovakia, Hungary\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Central & Western Europe \u2014 Health Considerations\n\n## Climate-driven risks\n- Temperate, four distinct seasons, generally moderate \u2014 one of the lower environmental-risk profiles in this archive.\n- Occasional severe summer heatwaves in recent years have caused significant mortality in populations unaccustomed to sustained high heat \u2014 don't assume this climate is immune to heat illness risk.\n\n## Disease patterns\n- **Tick-borne encephalitis and Lyme disease** \u2014 present in forested areas, spring through fall; check for ticks after time in brush/woodland.\n- Otherwise a low infectious disease burden relative to most subregions in this archive.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- European adder (*Vipera berus*) \u2014 the only native venomous snake across much of this subregion; bites are rarely fatal to healthy adults but still require medical attention.\n- Ticks are the primary vector-borne concern, not large/venomous wildlife.\n\n## Notes\n- Well-developed medical infrastructure generally means faster evacuation and care access here than most other subregions in this archive.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/europe_mediterranean.md", "title": "Europe \u2014 Mediterranean", "group": "regional-health-considerations", "content": "Region: Mediterranean Europe, Europe\nApprox. bounding box: 36\u00b0N\u201346\u00b0N, 9\u00b0W\u201328\u00b0E\nCountries/territories (as of 2026): Spain, Portugal, southern France, Italy, Greece, Balkan coast, Malta, Cyprus\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Mediterranean Europe \u2014 Health Considerations\n\n## Climate-driven risks\n- Hot, dry summers bring significant wildfire risk across much of this subregion.\n- Mild, wet winters; flash flooding possible in some areas after intense autumn rain events.\n\n## Disease patterns\n- **West Nile virus** \u2014 some regional transmission recorded in parts of southern Europe.\n- **Tick-borne encephalitis** \u2014 present in some forested/rural areas.\n- Generally low infectious disease burden relative to tropical regions in this archive.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Only mildly venomous native vipers present (e.g. asp viper) \u2014 snakebite risk here is low relative to most other subregions in this file set.\n- Scorpions present in southern Mediterranean areas, generally mild sting severity.\n\n## Notes\n- Wildfire season is the standout regional risk here. Seismic risk is elevated in parts of Italy, Greece, and the Balkans \u2014 cross-reference `01-quick-reference/emergency-type-triage.md`.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/europe_northern-boreal.md", "title": "Europe \u2014 Northern Boreal", "group": "regional-health-considerations", "content": "Region: Northern Europe / Scandinavia (boreal), Europe\nApprox. bounding box: 55\u00b0N\u201371\u00b0N, 5\u00b0W\u201331\u00b0E\nCountries/territories (as of 2026): Norway, Sweden, Finland, Denmark, Iceland, Baltic states\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Northern Europe / Scandinavia \u2014 Health Considerations\n\n## Climate-driven risks\n- Cold winters, short summers; extreme seasonal day-length variation (near-continuous daylight in summer, near-continuous darkness in winter at high latitude) affects sleep, activity planning, and morale.\n- Cold-weather exposure (hypothermia, frostbite) is the dominant environmental risk, especially outside urban areas in winter.\n\n## Disease patterns\n- **Tick-borne encephalitis** \u2014 present in parts of this subregion, particularly southern Scandinavia and the Baltic states.\n- Otherwise a low infectious disease burden.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- European adder present in the southern portion of this subregion; otherwise very few dangerous species \u2014 among the lowest wildlife-risk profiles in this archive.\n\n## Notes\n- Cold-weather survival skills are the dominant concern here, not disease or venomous species \u2014 see `02-first-aid-medical/medical-emergencies.md` (hypothermia/frostbite section).\n"}, {"path": "02-first-aid-medical/regional-health-considerations/mena_arabian-peninsula.md", "title": "Mena \u2014 Arabian Peninsula", "group": "regional-health-considerations", "content": "Region: Arabian Peninsula, North Africa & Middle East\nApprox. bounding box: 12\u00b0N\u201332\u00b0N, 34\u00b0E\u201360\u00b0E\nCountries/territories (as of 2026): Saudi Arabia, Yemen, Oman, United Arab Emirates, Qatar, Bahrain, Kuwait\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Arabian Peninsula \u2014 Health Considerations\n\n## Climate-driven risks\n- Extreme heat and aridity \u2014 among the hottest inhabited regions on Earth. Water scarcity and heat illness prevention are defining, year-round survival factors here, not seasonal concerns.\n\n## Disease patterns\n- Relatively low infectious disease burden in developed urban areas.\n- Malaria and dengue risk present in parts of Yemen and southern border areas.\n- **MERS-CoV** has had regional significance historically, associated with camel contact \u2014 avoid close contact with sick camels and unpasteurized camel milk.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Saw-scaled viper, Arabian cobra\n- Several medically significant scorpion species\n\n## Notes\n- Treat water and shade planning as core survival infrastructure here, similar to the Sahel file in this archive \u2014 heat illness is the leading environmental threat by a wide margin.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/mena_levant-eastern-mediterranean.md", "title": "Mena \u2014 Levant Eastern Mediterranean", "group": "regional-health-considerations", "content": "Region: Levant & Eastern Mediterranean, North Africa & Middle East\nApprox. bounding box: 29\u00b0N\u201337\u00b0N, 34\u00b0E\u201342\u00b0E\nCountries/territories (as of 2026): Israel, Palestine, Jordan, Lebanon, Syria, western Iraq\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Levant & Eastern Mediterranean \u2014 Health Considerations\n\n## Climate-driven risks\n- Mediterranean coastal climate transitioning to arid desert further inland (Jordanian/Syrian desert).\n\n## Disease patterns\n- **Leishmaniasis** (sandfly-borne) present in some areas.\n- Otherwise moderate infectious disease burden, generally lower than tropical regions in this archive.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Palestine viper, saw-scaled viper in desert-margin areas\n\n## Notes\n- This subregion has experienced significant conflict-related instability in recent decades \u2014 cross-reference `01-quick-reference/emergency-type-triage.md` (war/conflict nearby, civil order breakdown) alongside the standard health content here.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/mena_north-africa-sahara.md", "title": "Mena \u2014 North Africa Sahara", "group": "regional-health-considerations", "content": "Region: North Africa (Maghreb & Sahara), North Africa & Middle East\nApprox. bounding box: 15\u00b0N\u201337\u00b0N, 17\u00b0W\u201325\u00b0E\nCountries/territories (as of 2026): Morocco, Algeria, Tunisia, Libya, Egypt (west); overlaps the northern edge of the Sahel file's countries in the deep interior\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# North Africa (Maghreb & Sahara) \u2014 Health Considerations\n\n## Climate-driven risks\n- Sharp climate split: the Mediterranean coastal strip is temperate, while the Saharan interior is extreme desert with very low precipitation. Plan very differently for a coastal city versus a Saharan crossing.\n\n## Disease patterns\n- Relatively low infectious disease burden in coastal/urban areas.\n- In the interior, dehydration is the dominant risk, not infectious disease.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Saw-scaled viper, horned viper (desert-adapted, sand-camouflaged, sidewinding movement \u2014 watch for its distinctive trail in sand)\n- Deathstalker scorpion \u2014 one of the most medically significant scorpion species, found across this subregion and into the Middle East\n\n## Notes\n- Water discipline in the Saharan interior deserves the same weight given to the Sahel and Arabian Peninsula files in this archive.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/north-america_temperate.md", "title": "North America \u2014 Temperate", "group": "regional-health-considerations", "content": "Region: Temperate North America, North America\nApprox. bounding box: 25\u00b0N\u201360\u00b0N, 130\u00b0W\u201365\u00b0W\nCountries/territories (as of 2026): United States (excluding Alaska/Hawaii), Canada (southern provinces), northern Mexico border zone\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Temperate North America \u2014 Health Considerations\n\n## Climate-driven risks\n- Wide seasonal swing: heat illness a serious summer risk in southern/interior areas (esp. Desert Southwest subregion), hypothermia/frostbite a serious winter risk across the north and at elevation.\n- Tick season (spring\u2013fall) brings vector-borne disease risk (below) \u2014 check for ticks after time in brush/tall grass, remove promptly with fine-tipped tweezers close to the skin.\n- Tornado-related trauma risk in the central \"Tornado Alley\" band; hurricane-related risk along the Gulf and Atlantic coasts (seasonal, roughly June\u2013November).\n\n## Disease patterns\n- **Lyme disease** (tick-borne) \u2014 most concentrated in the Northeast, Mid-Atlantic, and Upper Midwest; early sign is often a expanding \"bullseye\" rash at the bite site, but not always present \u2014 fever/fatigue/joint pain after a tick bite warrants attention.\n- **Rocky Mountain spotted fever** (tick-borne) \u2014 despite the name, more cases occur in the south-central US than the Rockies; fever, headache, rash.\n- **West Nile virus** (mosquito-borne) \u2014 widespread, most cases mild but can cause serious neurological illness in a minority.\n- **Hantavirus** (rodent droppings/urine, inhaled) \u2014 risk when cleaning enclosed spaces with rodent infestation (cabins, sheds); ventilate and avoid dry-sweeping droppings.\n- **Waterborne giardia/cryptosporidium** \u2014 present in surface water even in pristine-looking wilderness streams; always treat.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. Named here for cross-reference:\n- Venomous snakes: rattlesnakes (widespread), copperheads and cottonmouths (southeast/south-central)\n- Black widow and brown recluse spiders (widespread, more common in southern half)\n- Black bears (widespread) and grizzly/brown bears (Pacific Northwest, northern Rockies, western Canada) \u2014 food storage discipline matters in bear country\n\n## Notes\n- Elevation-related risk (altitude sickness) relevant in Rocky Mountain, Cascade, and Sierra Nevada subregions above ~2,500m/8,000ft \u2014 ascend gradually, watch for headache/nausea/dizziness that doesn't improve with rest.\n- Regionally variable water access \u2014 arid Southwest requires more deliberate water planning than the humid Southeast/Northeast.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/oceania_australia-arid-temperate.md", "title": "Oceania \u2014 Australia Arid Temperate", "group": "regional-health-considerations", "content": "Region: Australian Arid Interior & Temperate South, Oceania & Pacific Islands\nApprox. bounding box: 44\u00b0S\u201319\u00b0S, 113\u00b0E\u2013154\u00b0E\nCountries/territories (as of 2026): Australia (interior \"Outback,\" southern and temperate coastal states)\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Australian Arid Interior & Temperate South \u2014 Health Considerations\n\n## Climate-driven risks\n- Arid interior brings extreme heat and very low water availability; temperate south has a normal four-season climate.\n- Extreme remoteness in the interior means very long evacuation times \u2014 water and communication planning are paramount there.\n\n## Disease patterns\n- Relatively low infectious disease burden by global standards; lower humidity limits some mosquito-borne disease relative to the tropical north.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Australia has an unusually high concentration of the world's most venomous snakes (e.g. inland taipan, eastern brown snake) and venomous spiders (funnel-web, redback) \u2014 bite/sting risk here is disproportionate to disease risk, the opposite pattern from most tropical subregions in this archive.\n\n## Notes\n- Given the Outback's remoteness, treat this as one of the highest evacuation-time subregions in the archive despite the comparatively low disease burden.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/oceania_australia-tropical-north.md", "title": "Oceania \u2014 Australia Tropical North", "group": "regional-health-considerations", "content": "Region: Australian Tropical North & Coast, Oceania & Pacific Islands\nApprox. bounding box: 19\u00b0S\u201310\u00b0S, 113\u00b0E\u2013154\u00b0E\nCountries/territories (as of 2026): Australia (Northern Territory, northern Queensland, northern Western Australia)\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Australian Tropical North & Coast \u2014 Health Considerations\n\n## Climate-driven risks\n- Tropical monsoon climate; wet season (roughly November\u2013April) brings cyclone risk and flooding.\n\n## Disease patterns\n- **Dengue** present in some northern areas.\n- **Ross River virus** (mosquito-borne) more broadly across Australia, notable here.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- **Saltwater crocodile** \u2014 extremely dangerous, present in northern rivers, estuaries, and beaches; heed all local warning signage without exception.\n- **Box jellyfish and Irukandji jellyfish** in northern coastal waters, particularly during wet season.\n- Also carries the venomous snake/spider risk noted in the Arid Interior & Temperate South file.\n\n## Notes\n- Marine sting/bite risk here is among the most severe in this entire archive \u2014 check local advisories before any water entry, especially during wet season.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/oceania_pacific-islands-nz.md", "title": "Oceania \u2014 Pacific Islands Nz", "group": "regional-health-considerations", "content": "Region: Pacific Islands & New Zealand, Oceania & Pacific Islands\nApprox. bounding box: 47\u00b0S\u201320\u00b0N, 130\u00b0E\u2013130\u00b0W (excluding Australia)\nCountries/territories (as of 2026): New Zealand, Fiji, Papua New Guinea, Solomon Islands, Vanuatu, Samoa, Tonga, French Polynesia, and other Pacific island nations\nNote: political boundaries may change; the bounding box above is this file's stable reference. This is an enormous and ecologically diverse area collapsed into one overview file \u2014 treat it as a starting point, and check specific-island guidance before relying on this alone.\n\n# Pacific Islands & New Zealand \u2014 Health Considerations\n\n## Climate-driven risks\n- Highly variable by latitude: New Zealand is temperate, most Pacific islands are tropical maritime with cyclone exposure (seasonal, varies by hemisphere/location within the region).\n\n## Disease patterns\n- **Dengue and other mosquito-borne disease** present on many tropical islands.\n- New Zealand has a notably low infectious disease burden by comparison to the tropical Pacific islands.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- New Zealand notably has no native land snakes and very few dangerous land species.\n- Tropical Pacific islands vary considerably; some coastal areas carry venomous marine life (cone snails, stonefish) worth checking locally before entering the water.\n\n## Notes\n- Given the scale collapsed into this one file, prioritize adding island/archipelago-specific detail here before relying on it for a specific destination \u2014 same caveat given to the original Sub-Saharan Africa and Asia overview files before they were split into proper subregions.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/south-america_amazon-basin.md", "title": "South America \u2014 Amazon Basin", "group": "regional-health-considerations", "content": "Region: Amazon Basin, South America\nApprox. bounding box: 10\u00b0S\u20135\u00b0N, 79\u00b0W\u201350\u00b0W\nCountries/territories (as of 2026): Brazil (north/west), Peru, Colombia, Ecuador, Bolivia (north), Venezuela (south), Guyana, Suriname, French Guiana\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Amazon Basin \u2014 Health Considerations\n\n## Climate-driven risks\n- Consistently hot, humid tropical rainforest climate; seasonal river flood pulse affects travel and settlement patterns.\n- Dense canopy and remoteness \u2014 similar evacuation-time challenges to the Congo Basin file in this archive.\n\n## Disease patterns\n- **Malaria** \u2014 significant risk in forested areas, particularly away from major cities.\n- **Yellow fever** \u2014 endemic; vaccination where reachable is the primary defense.\n- **Dengue** \u2014 widespread.\n- **Leishmaniasis** \u2014 sandfly-borne, relevant for anyone spending extended time in forest camps.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Bushmaster \u2014 the largest venomous pit viper in the Americas, found in this subregion\n- Fer-de-lance\n- Anaconda (constrictor, not venomous, but capable of serious injury; generally avoids humans)\n- Electric eel and piranha present in some waters \u2014 real but often overstated hazards; more caution warranted around low-visibility, slow-moving water generally\n\n## Notes\n- As with the Congo Basin, remoteness means evacuation can take days \u2014 weight prevention (bite avoidance, water treatment, netting) heavily over reactive treatment planning.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/south-america_andean-highlands.md", "title": "South America \u2014 Andean Highlands", "group": "regional-health-considerations", "content": "Region: Andean Highlands, South America\nApprox. bounding box: 20\u00b0S\u20135\u00b0N, 79\u00b0W\u201365\u00b0W\nCountries/territories (as of 2026): Colombia, Ecuador, Peru, Bolivia, northern Chile, northwestern Argentina\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Andean Highlands \u2014 Health Considerations\n\n## Climate-driven risks\n- High elevation (several major cities \u2014 La Paz, Cusco, Quito \u2014 sit above 2,800m) brings thin air, intense UV, and large diurnal temperature swings.\n- Rapid weather changes at altitude; landslide risk on steep terrain during rainy season.\n\n## Disease patterns\n- **Altitude sickness (AMS, and its severe forms HAPE/HACE)** \u2014 the dominant medical concern in this subregion; ascend gradually, descend at signs of severe symptoms.\n- Lower tropical infectious disease burden than the Amazon Basin at higher elevations, but typhoid/waterborne illness risk remains in rural areas without treated water.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Comparatively few dangerous species at high elevation; pumas present in remote areas but rarely encountered.\n\n## Notes\n- Same ascent discipline as the Himalayan Foothills and Tibetan Plateau files in this archive \u2014 evacuation from remote high-altitude areas is slow and weather-dependent.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/south-america_southern-cone-patagonia.md", "title": "South America \u2014 Southern Cone Patagonia", "group": "regional-health-considerations", "content": "Region: Southern Cone & Patagonia, South America\nApprox. bounding box: 56\u00b0S\u201324\u00b0S, 76\u00b0W\u201353\u00b0W\nCountries/territories (as of 2026): Argentina (central/south), Chile (central/south), Uruguay, Paraguay\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Southern Cone & Patagonia \u2014 Health Considerations\n\n## Climate-driven risks\n- Temperate to subpolar climate in the far south; Patagonia is known for sustained, strong winds that complicate fire-building, shelter, and general exposure management beyond what temperature alone suggests.\n- Cold-weather exposure risk increases significantly moving south toward Tierra del Fuego.\n\n## Disease patterns\n- Generally lower tropical infectious disease burden than the rest of South America in this file set.\n- **Hantavirus** \u2014 documented in some rural areas with rodent exposure (agricultural work, opening closed rural buildings); ventilate before entering and avoid dry-sweeping droppings, same precaution as the North America temperate file.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Far fewer highly venomous species than tropical South America; some pit viper species present in the northern portion of this subregion (e.g. yarar\u00e1 species).\n\n## Notes\n- Sustained wind is a distinct, often underestimated hazard here \u2014 factor wind chill and wind-driven fire/shelter difficulty into planning separately from ambient temperature.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/south-asia_himalayan-foothills.md", "title": "South Asia \u2014 Himalayan Foothills", "group": "regional-health-considerations", "content": "Region: Himalayan Foothills & High Altitude, South Asia\nApprox. bounding box: 27\u00b0N\u201336\u00b0N, 72\u00b0E\u201395\u00b0E\nCountries/territories (as of 2026): Nepal, Bhutan, northern India (Himachal Pradesh, Uttarakhand, Sikkim, Ladakh), northern Pakistan (Gilgit-Baltistan, Khyber Pakhtunkhwa highlands)\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Himalayan Foothills & High Altitude \u2014 Health Considerations\n\n## Climate-driven risks\n- Extreme cold at altitude, with rapid, unpredictable weather changes even within a single day \u2014 hypothermia and frostbite are the dominant climate risk here, opposite of most other subregions in this set.\n- Landslide and avalanche risk on steep terrain, elevated during monsoon rains (lower elevations) and heavy snow periods (higher elevations).\n- Thin air affects wound healing, exertion tolerance, and cold sensitivity \u2014 factor this into any injury response plan at altitude.\n\n## Disease patterns\n- **Altitude sickness (acute mountain sickness, and its severe forms HAPE/HACE)** \u2014 the leading medical concern above roughly 2,500m; ascend gradually (widely recommended: no more than ~300-500m net elevation gain in sleeping altitude per day above 3,000m), descend immediately at signs of severe symptoms (confusion, breathlessness at rest, loss of coordination) \u2014 this is a killer if ignored.\n- **Waterborne illness (giardia and others)** \u2014 glacial-melt streams look pristine but still carry pathogens from upstream animal contact; treat all water regardless of apparent clarity.\n- **Malaria** \u2014 largely absent at higher elevations, present in lower foothill valleys \u2014 don't assume elevation protects you at trailheads/lower valley towns.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. Fewer venomous snakes at higher elevation than the plains below:\n- Himalayan pit viper at lower-to-mid elevations\n- Himalayan black bear and snow leopard (rare encounters, but relevant in remote high-altitude travel)\n- Leopards in lower foothill forest zones\n\n## Notes\n- Evacuation from high-altitude areas is often slow and weather-dependent (no reliable air support in poor conditions) \u2014 a conservative approach to ascent and injury risk matters more here than in lower-altitude subregions where evacuation is faster.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/south-asia_indo-gangetic-plains.md", "title": "South Asia \u2014 Indo Gangetic Plains", "group": "regional-health-considerations", "content": "Region: Indo-Gangetic Plains, South Asia\nApprox. bounding box: 21\u00b0N\u201332\u00b0N, 68\u00b0E\u201392\u00b0E\nCountries/territories (as of 2026): northern India, Pakistan (Punjab, Sindh), Bangladesh, Nepal (Terai lowlands)\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Indo-Gangetic Plains \u2014 Health Considerations\n\n## Climate-driven risks\n- Among the most severe heat-wave regions in the world in the pre-monsoon period (roughly April\u2013June) \u2014 dangerously high heat combined with humidity in some areas; heat illness prevention should be a default daily precaution in this season, not a reaction.\n- Monsoon flooding (roughly June\u2013September) across the river plains \u2014 flash and slow-rise flooding both occur depending on location.\n- Dense agricultural land with heavy irrigation \u2014 standing water is widespread, elevating mosquito-borne disease risk.\n\n## Disease patterns\n- **Dengue and chikungunya** \u2014 widespread, day-biting mosquito vectors; bite prevention (repellent, covering skin, eliminating standing water near dwellings) is the primary defense.\n- **Malaria** \u2014 present, generally lower intensity than in Sub-Saharan Africa but still significant in parts of this subregion.\n- **Japanese encephalitis** \u2014 associated with rice-paddy/pig-farming areas; vaccination where reachable, bite prevention otherwise.\n- **Typhoid and cholera** \u2014 sharp seasonal spikes around monsoon flooding; water treatment discipline matters most in this window.\n- **Heat-related illness** \u2014 treat as a leading cause of preventable death in the pre-monsoon season here, on par with infectious disease risk.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. The \"Big Four\" venomous snakes responsible for the large majority of snakebite deaths in this subregion:\n- Indian cobra\n- Russell's viper\n- Common krait (nocturnal, bites often occur while people sleep on the ground \u2014 sleeping off the ground or under a tucked-in net reduces risk)\n- Saw-scaled viper\n\n## Notes\n- Snakebite antivenom access varies significantly by how rural the specific location is \u2014 identifying the nearest source before it's needed is worth the effort here.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/south-asia_peninsula-sri-lanka.md", "title": "South Asia \u2014 Peninsula Sri Lanka", "group": "regional-health-considerations", "content": "Region: South Asian Peninsula & Sri Lanka, South Asia\nApprox. bounding box: 6\u00b0N\u201321\u00b0N, 72\u00b0E\u201390\u00b0E\nCountries/territories (as of 2026): peninsular/southern India (Deccan Plateau, coastal states), Sri Lanka\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# South Asian Peninsula & Sri Lanka \u2014 Health Considerations\n\n## Climate-driven risks\n- Cyclone exposure along both coasts (Bay of Bengal side and Arabian Sea side), seasonal \u2014 track official cyclone advisories in coastal areas.\n- Monsoon flooding, though generally less extreme than the Indo-Gangetic Plains further north.\n- High year-round heat/humidity in coastal zones; the interior Deccan Plateau is drier with a more pronounced hot season.\n\n## Disease patterns\n- **Dengue and chikungunya** \u2014 widespread across the subregion, day-biting mosquito vectors, bite prevention is primary defense.\n- **Malaria** \u2014 present in parts of the subregion, generally patchier than further north.\n- **Leptospirosis** \u2014 notable risk after monsoon flooding, especially in areas with agricultural/livestock water contact; avoid wading through floodwater with open cuts.\n- **Lymphatic filariasis** \u2014 present in some coastal areas; mosquito bite prevention is the relevant defense.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Russell's viper, saw-scaled viper, Indian cobra (all present on the peninsula; Sri Lanka has its own overlapping but distinct snake fauna, including additional endemic species)\n- Sea snakes along both coastlines \u2014 generally non-aggressive but venomous; avoid handling\n\n## Notes\n- Coastal population density here is high in many areas, which generally means faster access to medical care than the more remote subregions in this set \u2014 but cyclone events can disrupt that access sharply and suddenly.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/southeast-asia_mainland-mekong.md", "title": "Southeast Asia \u2014 Mainland Mekong", "group": "regional-health-considerations", "content": "Region: Mainland Southeast Asia / Mekong, Southeast Asia\nApprox. bounding box: 8\u00b0N\u201328\u00b0N, 92\u00b0E\u2013110\u00b0E\nCountries/territories (as of 2026): Thailand, Vietnam, Laos, Cambodia, Myanmar\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Mainland Southeast Asia (Mekong) \u2014 Health Considerations\n\n## Climate-driven risks\n- Monsoon flooding tied to the Mekong River's seasonal flood pulse \u2014 predictable annually but locally severe; low-lying delta areas (southern Vietnam, Cambodia's Tonl\u00e9 Sap basin) see the most extensive flooding.\n- High humidity heat stress, especially in the pre-monsoon hot season (roughly March\u2013May).\n\n## Disease patterns\n- **Dengue** \u2014 widespread across the subregion, a leading cause of illness; bite prevention primary defense.\n- **Malaria** \u2014 present especially in forested and border/highland areas, lower risk in major lowland cities.\n- **Japanese encephalitis** \u2014 associated with rice-paddy/pig-farming areas, vaccination where reachable.\n- **Melioidosis** \u2014 a soil- and water-dwelling bacterium notably significant in this subregion (especially northeastern Thailand); infection risk rises with skin contact with soil/water during rainy season, particularly with open wounds or in people with diabetes/chronic conditions \u2014 avoid unnecessary contact with mud/standing water when injured.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Monocled cobra, king cobra (the world's longest venomous snake, present in forested areas of this subregion)\n- Malayan pit viper\n- Various krait species (nocturnal, similar precautions as South Asia's common krait)\n\n## Notes\n- Rural/forested border areas can have significantly slower medical evacuation than the subregion's major cities \u2014 factor this into risk decisions when traveling away from urban centers.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/southeast-asia_maritime-archipelago.md", "title": "Southeast Asia \u2014 Maritime Archipelago", "group": "regional-health-considerations", "content": "Region: Maritime/Archipelago Southeast Asia, Southeast Asia\nApprox. bounding box: 11\u00b0S\u201319\u00b0N, 95\u00b0E\u2013141\u00b0E\nCountries/territories (as of 2026): Indonesia, Philippines, Malaysia, Brunei, Timor-Leste, Singapore\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Maritime/Archipelago Southeast Asia \u2014 Health Considerations\n\n## Climate-driven risks\n- Typhoon/cyclone exposure, especially the Philippines \u2014 track official storm advisories, this subregion sees some of the most frequent tropical cyclone activity in the world.\n- Sits on the Pacific \"Ring of Fire\" \u2014 active volcanism (ashfall respiratory hazard, evacuation planning near active volcanoes) and high earthquake/tsunami risk along subduction zones.\n- High year-round heat and humidity, minimal seasonal temperature variation near the equator.\n\n## Disease patterns\n- **Dengue** \u2014 very widespread, a leading cause of illness across the subregion.\n- **Malaria** \u2014 significant on some islands (notably parts of Indonesian Papua), much lower in dense urban centers (e.g. Jakarta, Manila metro core) \u2014 check specific location/island.\n- **Typhoid** \u2014 reinforces general water/food safety discipline.\n- **Leptospirosis** \u2014 recurring risk after flooding, common in this subregion's frequent heavy-rain events.\n- **Lymphatic filariasis** \u2014 present in some areas; mosquito bite prevention relevant.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail:\n- Saltwater crocodile \u2014 especially significant human-safety concern in parts of this subregion (Indonesia, parts of the Philippines); avoid swimming/wading in known crocodile habitat, including some river mouths and mangrove areas.\n- King cobra, various pit vipers\n- Box jellyfish and other venomous marine life along some coasts \u2014 check local advisories before swimming, especially in northern Australia-adjacent waters and parts of Indonesia\n- Reticulated python \u2014 not venomous but among the largest snakes in the world; capable of serious injury to a human in rare cases\n\n## Notes\n- Volcanic and seismic hazard planning (ashfall masks, evacuation routes, tsunami awareness for coastal areas) deserves specific attention in this subregion beyond the general disaster guidance in `01-quick-reference/emergency-type-triage.md`.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/sub-saharan-africa_congo-basin.md", "title": "Sub Saharan Africa \u2014 Congo Basin", "group": "regional-health-considerations", "content": "Region: Congo Basin / Central African Rainforest, Sub-Saharan Africa\nApprox. bounding box: 5\u00b0S\u20135\u00b0N, 12\u00b0E\u201330\u00b0E\nCountries/territories (as of 2026): Democratic Republic of the Congo, Republic of the Congo, Gabon, Cameroon (south/east), Central African Republic (south), Equatorial Guinea\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Congo Basin \u2014 Health Considerations\n\n## Climate-driven risks\n- Dense rainforest, consistently high heat and humidity year-round with limited seasonal variation compared to the wider region.\n- Heavy rainfall complicates travel \u2014 roads become impassable, extending evacuation times significantly.\n\n## Disease patterns\n- **Ebola and Marburg virus disease** \u2014 this subregion has historically been the site of episodic outbreaks; not a constant background risk, but check local/WHO outbreak advisories before travel and avoid contact with sick or dead wildlife (especially primates and bats) at all times as a standing precaution.\n- **Mpox (monkeypox)** \u2014 endemic in parts of this subregion; avoid contact with rodents/primates and their body fluids, cook bushmeat thoroughly.\n- **Malaria** \u2014 among the highest transmission intensity in the world in parts of this subregion; bed nets and prompt treatment are essential, not optional.\n- **African trypanosomiasis (sleeping sickness)** \u2014 tsetse fly-borne, present in defined belts through the basin; avoid known tsetse habitat (riverine woodland/brush) where possible, cover skin.\n- **Schistosomiasis** \u2014 from freshwater snails in slow-moving rivers/lakes; avoid wading/swimming in untreated fresh water.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. Named here for cross-reference:\n- Gaboon viper, forest cobra\n- Forest elephants \u2014 unpredictable, capable of serious injury; give wide berth\n- Driver/safari ants \u2014 swarms can overwhelm; move away immediately if encountered, don't stand still\n\n## Notes\n- This is the least road-accessible subregion in this file set \u2014 plan for multi-day evacuation timelines to any advanced medical facility, and weight prevention (bed nets, water treatment, avoiding wildlife contact) more heavily than treatment-after-the-fact accordingly.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/sub-saharan-africa_east-african-highlands.md", "title": "Sub Saharan Africa \u2014 East African Highlands", "group": "regional-health-considerations", "content": "Region: East African Highlands, Sub-Saharan Africa\nApprox. bounding box: 5\u00b0S\u201315\u00b0N, 29\u00b0E\u201343\u00b0E\nCountries/territories (as of 2026): Ethiopia, Eritrea, Kenya (highlands), Uganda, Rwanda, Burundi, Tanzania (highlands)\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# East African Highlands \u2014 Health Considerations\n\n## Climate-driven risks\n- Elevation (much of this subregion sits 1,500\u20133,000m) gives a milder, more temperate climate than the surrounding lowlands \u2014 a notable exception within Sub-Saharan Africa. Nights can be cold even near the equator.\n- Strong UV exposure due to elevation and low latitude combined \u2014 sunburn risk is higher than the mild temperatures suggest.\n- Rift Valley areas and lower-elevation pockets within this subregion revert to lowland heat/malaria risk \u2014 don't assume highland conditions apply to every part of your route.\n\n## Disease patterns\n- **Malaria** \u2014 significantly reduced at higher elevation, but present in valleys, lakeshores, and lower-elevation pockets \u2014 check elevation-specific risk rather than assuming highland safety.\n- **Typhoid** \u2014 reinforces water treatment and sanitation discipline, especially around dense population centers.\n- **Rift Valley fever** \u2014 periodic, livestock-associated outbreaks (mosquito-borne and via contact with infected animal blood/fluids); avoid handling sick livestock during known outbreak periods.\n- **Altitude-related illness** \u2014 relevant for rapid ascent to the higher peaks in this subregion (e.g. Kilimanjaro, Mount Kenya, the Rwenzoris); ascend gradually, watch for headache/nausea/dizziness that doesn't resolve with rest or slower pace.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. Named here for cross-reference:\n- Black mamba, puff adder (widespread across elevation range)\n- Hippos and crocodiles near lakes (Victoria, Turkana, Tanganyika) and rivers \u2014 among the most dangerous large animals to humans in the region\n- Safari ants\n\n## Notes\n- Water sources at elevation look clean but still carry giardia and other pathogens from upstream livestock/wildlife contact \u2014 treat regardless of apparent clarity.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/sub-saharan-africa_sahel.md", "title": "Sub Saharan Africa \u2014 Sahel", "group": "regional-health-considerations", "content": "Region: Sahel, Sub-Saharan Africa\nApprox. bounding box: 10\u00b0N\u201318\u00b0N, 17\u00b0W\u201338\u00b0E\nCountries/territories (as of 2026): Senegal (north), Mauritania (south), Mali, Burkina Faso, Niger, Nigeria (north), Chad, Sudan (west)\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Sahel \u2014 Health Considerations\n\n## Climate-driven risks\n- Semi-arid to arid \u2014 extreme heat, especially in the dry season; heat illness risk is a constant baseline concern, not a seasonal spike.\n- Harmattan wind (roughly November\u2013March) carries fine dust from the Sahara \u2014 respiratory irritation, reduced visibility.\n- Water scarcity is a dominant, year-round survival factor here more than almost any other subregion in this set \u2014 planning around water access should take priority over most other preparation.\n\n## Disease patterns\n- **Meningococcal meningitis** \u2014 this subregion is the classic \"meningitis belt,\" with seasonal epidemics concentrated in the hot, dry season (roughly December\u2013June); stiff neck, high fever, and severe headache warrant urgent attention, vaccination where reachable is the strongest defense.\n- **Malnutrition-related vulnerability** \u2014 recurring drought conditions increase vulnerability to infectious disease generally; food security planning is itself a health intervention in this subregion.\n- **Cholera** \u2014 periodic outbreaks in some areas, tied to water access disruption.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. Named here for cross-reference:\n- Saw-scaled viper \u2014 small but responsible for a disproportionate share of snakebite deaths regionally due to its aggressive defensive behavior and potent venom; watch step placement especially at dawn/dusk\n- Scorpions \u2014 several medically significant species present\n\n## Notes\n- Given the water-scarcity baseline, treat every water-purification method in `03-water/` as core survival infrastructure here, not a backup plan.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/sub-saharan-africa_southern-african-savanna.md", "title": "Sub Saharan Africa \u2014 Southern African Savanna", "group": "regional-health-considerations", "content": "Region: Southern African Savanna, Sub-Saharan Africa\nApprox. bounding box: 35\u00b0S\u20138\u00b0S, 12\u00b0E\u201340\u00b0E\nCountries/territories (as of 2026): South Africa, Namibia, Botswana, Zimbabwe, Zambia, Mozambique, Eswatini, Lesotho\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# Southern African Savanna \u2014 Health Considerations\n\n## Climate-driven risks\n- Strong dry-season/wet-season split; dry season (roughly May\u2013October in most of the subregion) brings elevated wildfire risk across savanna grassland.\n- Arid western portion (Kalahari, Namib) has large diurnal temperature swings \u2014 hot days, cold nights \u2014 plan layered clothing and water reserves accordingly.\n- Temperate southern coastal areas (South Africa's Cape region) are markedly milder than the savanna interior \u2014 don't apply interior heat/malaria assumptions to the whole subregion.\n\n## Disease patterns\n- **Malaria** \u2014 present in lower-lying and northern parts (Zambia, Zimbabwe, Mozambique, northern South Africa/Kruger area); much lower to absent risk in South Africa's temperate south and highveld \u2014 check specific location.\n- **African tick bite fever** (rickettsial, tick-borne) \u2014 common in game/bush areas; fever, headache, and a characteristic dark scab (eschar) at the bite site.\n- **Schistosomiasis (bilharzia)** \u2014 present in many dams, rivers, and irrigation canals; avoid swimming/wading in untreated fresh water where local advisories flag it.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. Named here for cross-reference:\n- Black mamba, puff adder, boomslang\n- Hippos \u2014 statistically among the most dangerous animals to humans in the region; never approach or camp close to hippo water access routes\n- Crocodiles near rivers/dams\n- Lions, leopards, elephants, and Cape buffalo in and around wildlife areas \u2014 maintain safe distance and follow local guidance in any game-adjacent zone\n\n## Notes\n- Rural/bush medical evacuation can be slow \u2014 many game and farming areas are far from hospitals; a satellite communication plan is disproportionately valuable here relative to denser regions.\n"}, {"path": "02-first-aid-medical/regional-health-considerations/sub-saharan-africa_west-african-coast.md", "title": "Sub Saharan Africa \u2014 West African Coast", "group": "regional-health-considerations", "content": "Region: West African Coast, Sub-Saharan Africa\nApprox. bounding box: 4\u00b0N\u201315\u00b0N, 17\u00b0W\u20139\u00b0E\nCountries/territories (as of 2026): Senegal, Guinea-Bissau, Guinea, Sierra Leone, Liberia, C\u00f4te d'Ivoire, Ghana, Togo, Benin, Nigeria, Cameroon (coastal)\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# West African Coast \u2014 Health Considerations\n\n## Climate-driven risks\n- High humidity and heat year-round; monsoon rains roughly June\u2013October bring flooding risk in low-lying coastal and river-delta areas.\n- Coastal erosion/storm surge risk during heavy rain season.\n\n## Disease patterns\n- **Lassa fever** \u2014 rodent-borne (contact with infected rat urine/droppings, contaminated food/surfaces), endemic in this subregion especially Nigeria, Sierra Leone, Liberia, Guinea; keep food covered and sealed against rodents, avoid handling/eating rodents caught for food without thorough cooking.\n- **Malaria** \u2014 high, year-round transmission across the subregion; bed nets and prompt fever treatment are high-value.\n- **Yellow fever** \u2014 endemic; vaccination (where reachable) is the primary defense, mosquito bite prevention otherwise.\n- **Onchocerciasis (river blindness)** \u2014 transmitted by blackflies near fast-flowing rivers; avoid prolonged exposure near breeding sites where known to be present.\n- **Cholera** \u2014 periodic outbreaks, especially in dense urban/informal settlements with limited sanitation \u2014 reinforces water/sanitation discipline.\n\n## Dangerous species\nSee `06-animals-insects/` for identification detail. Named here for cross-reference:\n- Gaboon viper (large, well-camouflaged, potent venom)\n- Black-necked spitting cobra (can spray venom toward the eyes \u2014 avoid the face, flush immediately if sprayed)\n- West African crocodile in rivers/estuaries\n\n## Notes\n- Rural areas often have limited road access to advanced medical care \u2014 factor longer evacuation timelines into any severe-injury response plan here.\n"}, {"path": "02-first-aid-medical/religious-cultural-considerations.md", "title": "Religious Cultural Considerations", "group": null, "content": "# Religious & Cultural Considerations in First Aid and Medical Care\n\nBelief systems shape what care people want, who they want giving it, and how they want their body and family treated during and after treatment. Getting this wrong can cause real harm \u2014 to trust, to compliance with care, and to a family's ability to grieve or heal. This file is a starting point, not a complete guide to any tradition; individuals and denominations vary widely, and the single most reliable method is always to **ask the person or their family directly** when they're able to answer.\n\n## Universal principles first\n\n1. **Immediate life-threatening emergencies**: when a person is unconscious, unable to communicate, and death or permanent harm is imminent without intervention, provide standard emergency care (CPR, bleeding control, airway management) \u2014 preserving the option for the person to recover and make their own decisions later generally takes priority over an unconfirmed assumption about their beliefs.\n2. **A conscious, competent person's refusal of specific treatment should be respected** once they understand the consequences of refusing \u2014 informed autonomy applies regardless of whether the reason is religious, personal, or something else.\n3. **When beliefs are known in advance** (a family member states them, a medical alert bracelet/card, a living will), honor them for non-immediately-fatal decisions even if you disagree.\n4. **When in doubt, ask** \u2014 \"Is there anything about your beliefs or practices I should know before I treat you?\" is a respectful, direct question that takes a few seconds and prevents most mistakes below.\n5. Document what you're told (even informally) so other caregivers don't have to re-ask during an already stressful time.\n\n## By tradition \u2014 common considerations (not exhaustive, not universal within the tradition)\n\n### Christianity (varies significantly by denomination)\n- **Jehovah's Witnesses**: many decline blood transfusions and some blood products as a matter of core belief, even in life-threatening situations \u2014 this is a well-documented, serious consideration; ask directly and respect a clear refusal from a competent adult. Non-blood volume replacement and other interventions are typically still acceptable \u2014 ask what alternatives are acceptable rather than assuming refusal of all care.\n- **Catholic and some other denominations**: last rites/anointing of the sick is important to many before death \u2014 facilitate a priest or allow a lay person to perform last rites if requested and feasible, without delaying urgent care to do so.\n- **Christian Science**: some adherents prefer prayer-based healing over medical intervention \u2014 respect informed refusal from a competent adult; for a minor, this becomes a harder ethical situation without a clear universal answer \u2014 err toward not withholding emergency care from a child while acknowledging the parents' distress.\n- Most Christian traditions have no dietary/blood restrictions beyond the above; fasting periods (e.g. Lent) are usually paused for medical necessity without issue.\n\n### Islam\n- **Modesty**: many patients (particularly women) prefer a same-gender caregiver and minimal exposure during examination/treatment \u2014 cover areas not being actively treated where possible, ask before removing clothing beyond what's necessary.\n- **Ramadan fasting**: illness, pregnancy, and medical necessity are recognized exemptions in Islamic teaching \u2014 most adherents will accept breaking a fast for genuine medical need (medication, IV fluids, emergency care), but ask rather than assume; some may want to make up the fast later rather than break it, which matters for medication timing when not urgent.\n- **Halal considerations**: pork-derived products (some gelatin capsules, certain vaccines/medications) and alcohol-based products may be avoided when an alternative exists \u2014 in a true emergency, most Islamic scholars hold that necessity permits otherwise-prohibited treatment; ask if there's a preference when time allows.\n- **End of life**: family involvement in decisions is often central; facing the body toward Mecca and specific washing/burial rituals (as soon as feasible after death) matter to many families.\n\n### Judaism\n- **Life preservation (*pikuach nefesh*) overrides most other religious rules** in Jewish law, including Sabbath (Shabbat) and dietary law \u2014 most observant patients and rabbis will affirm that emergency care should proceed without hesitation.\n- **Kosher dietary law**: relevant for non-emergency food/medication choices when alternatives exist; not a barrier to emergency treatment.\n- **Circumcision (brit milah)**: a significant ritual for infant boys, traditionally on the 8th day \u2014 postponed for medical reasons (e.g. the infant's health) without controversy.\n- **Burial**: traditionally as soon as possible after death, without embalming, in a simple shroud \u2014 matters for how you handle a death within the community's own practice.\n\n### Hinduism\n- Wide diversity of practice by region/family. Common (not universal) considerations:\n- **Dietary**: vegetarianism is common (avoiding beef especially, sometimes all meat) \u2014 relevant for medication with gelatin/animal-derived coatings when an alternative exists.\n- **Modesty and gender preferences** for caregivers, similar to other traditions above, especially around the lower body.\n- **End of life**: family presence, chanting/prayer, and specific rituals around the moment of death matter to many families; cremation (often within 24 hours) is traditional.\n\n### Buddhism\n- Wide diversity by tradition/region. Common considerations:\n- Some traditions hold that consciousness/awareness at the moment of death is spiritually significant \u2014 families may prefer to minimize sedation near end of life if the patient/family requests it, balanced against comfort care; this is a conversation, not an assumption.\n- Vegetarianism is common in some traditions, not universal.\n- Calm environment and family/community presence are often valued near end of life.\n\n### Sikhism\n- **The 5 Ks** (including uncut hair/*kesh* and the *kirpan*, a ceremonial dagger) are significant articles of faith \u2014 avoid cutting hair or removing the kirpan without clear consent/explanation of medical necessity; when unavoidable in an emergency, explain why and handle articles of faith respectfully (don't discard them).\n- Modesty considerations similar to other traditions above.\n\n### Indigenous and traditional belief systems\n- Enormous diversity globally \u2014 no single generalization applies. Common threads worth asking about: the role of a traditional healer/elder alongside or in coordination with first aid, specific rituals around illness or death, and beliefs about the causes of illness that may differ from a biomedical model.\n- Respect the role of a recognized community healer where the family wants one involved \u2014 coordinate rather than dismiss, when doing so doesn't block urgent life-saving care.\n\n### Secular / non-religious\n- No religious constraints, but personal values (e.g. specific end-of-life wishes, distrust of certain interventions) still deserve the same respect and direct conversation as any other patient's informed preference.\n\n## Practical checklist for caregivers\n- [ ] Ask about relevant beliefs/preferences when the situation allows (not urgent-emergency moments).\n- [ ] Ask who the person wants present, and who they want making decisions if they can't.\n- [ ] Ask about modesty/gender preferences for caregivers before undressing/examining a patient.\n- [ ] Ask about dietary/medication restrictions before administering non-urgent treatment.\n- [ ] Ask about end-of-life and after-death wishes if the situation is life-threatening and time allows.\n- [ ] When you don't know, ask rather than guess \u2014 and don't be afraid to say \"I don't know your tradition, please tell me what matters to you.\"\n"}, {"path": "02-first-aid-medical/sanitation-hygiene.md", "title": "Sanitation Hygiene", "group": null, "content": "# Sanitation & Hygiene\n\nPoor sanitation is one of the largest drivers of preventable death in any prolonged crisis \u2014 more people die from resulting disease than from the initial event, historically. This is first aid at the population level.\n\n## Priorities, in order\n1. Safe water (see `03-water/` and `01-quick-reference/water-purification-quicksteps.md`)\n2. Safe disposal of human waste\n3. Handwashing\n4. Food safety\n5. Waste/vector (pest) control\n\n## Human waste disposal\n- **Never** near a water source \u2014 minimum ~30m (100ft) from any well, stream, or water storage, downhill/downstream of it.\n- **Simple pit latrine**: dig a pit (at least 1-2m deep for a family, deeper for shared use), build a simple platform/seat over it, add a cover/lid to reduce flies and odor.\n- Add a handful of ash or dry soil after each use \u2014 reduces odor, flies, and speeds decomposition.\n- When a pit fills to within ~0.5m of the surface, cover it completely with soil and dig a new one.\n- Group/shared settings: separate facilities are strongly preferred for privacy/dignity and uptake \u2014 people avoid using latrines they consider unsafe or exposed, which defeats the purpose.\n\n## Handwashing\n- The single most effective, lowest-cost disease prevention measure available.\n- Critical times: after using the latrine, before preparing/eating food, after handling waste or a sick person, after handling animals.\n- Soap and water is best; if no soap, ash or sand can serve as an abrasive substitute with water; alcohol-based hand sanitizer as a backup (less effective against some pathogens like norovirus).\n- A simple \"tippy tap\" (a hanging container with a small hole, tipped by a foot pedal/lever) makes handwashing accessible without piped water.\n\n## Food safety\n- Cook food thoroughly, especially meat/eggs \u2014 heat kills most pathogens.\n- Eat cooked food while hot; refrigeration may not be available, so avoid holding cooked food at room temperature for extended periods (bacterial growth risk).\n- Keep raw meat separate from other food (surfaces, hands, containers) to avoid cross-contamination.\n- Wash produce with treated water where possible.\n- Discard food with mold (except a few specific safe cases like hard cheese \u2014 when in doubt, discard) or off smell/appearance.\n\n## Waste and vector control\n- Manage garbage \u2014 burn or bury non-recyclable waste away from living areas, to reduce rodent/insect attraction.\n- Standing water breeds mosquitoes (malaria, dengue, and other disease vectors) \u2014 drain or cover stagnant water where possible.\n- Basic pest control (netting over sleeping areas in mosquito-prone regions, keeping food sealed against rodents) meaningfully reduces disease transmission.\n\n## Personal hygiene in constrained conditions\n- Regular bathing, even with minimal water (sponge bathing), reduces skin infection and disease transmission.\n- Change/wash clothing and bedding regularly where water allows \u2014 lice and other parasites spread through shared, unwashed fabric.\n- Menstrual hygiene: clean, reusable cloth pads (washed with soap and dried fully, ideally in sunlight) are a workable low-resource option; access to private washing facilities matters for uptake and dignity.\n\n## Managing illness within a group to limit spread\n- Isolate people with diarrhea, vomiting, or respiratory symptoms from food preparation duties and, where possible, from close group contact until recovered.\n- Designate a specific person/area for care of the sick to limit exposure across the group.\n- Extra attention to handwashing and surface cleaning around anyone who is ill.\n"}, {"path": "02-first-aid-medical/trauma-and-wound-care.md", "title": "Trauma And Wound Care", "group": null, "content": "# Trauma & Wound Care\n\nBroad, source-crosschecked field reference (US Army FM 4-25.11, Hesperian *Where There Is No Doctor*). Deeper than the `01-quick-reference/triage-and-first-aid-card.md` summary \u2014 read that first for the immediate ABCs.\n\n## Wound cleaning\n1. Wash your hands / wear gloves if available \u2014 infection is the biggest secondary threat.\n2. Stop active bleeding first (pressure, elevation, tourniquet if severe \u2014 see quick-reference card).\n3. Once bleeding is controlled, irrigate the wound with clean/treated water \u2014 flush out debris, don't scrub deep wounds.\n4. Remove visible debris with clean tweezers if easily accessible; don't dig for deeply embedded objects \u2014 extraction risk can exceed infection risk, get to advanced care instead.\n5. Cover with clean, non-stick dressing. Change dressing daily or when wet/dirty.\n6. Watch for infection: increasing redness/warmth/swelling, pus, red streaking from the wound, fever \u2014 these need antibiotics if available and urgent evacuation if not improving.\n\n## Impaled objects\nDo **not** remove an object impaled in the body (deep puncture, embedded knife/rebar/etc.) \u2014 it may be blocking further bleeding. Stabilize it in place with bulky padding around it, immobilize the area, evacuate for surgical removal.\n\n## Fractures \u2014 deeper reference\n- **Closed fracture**: skin intact. Splint in the position found, padded, immobilizing the joint above and below the break.\n- **Open fracture**: bone breaks skin \u2014 higher infection risk. Control bleeding, cover the wound (don't push bone back in), splint without pressing on the exposed bone, evacuate urgently \u2014 open fractures need surgical cleaning.\n- **Suspected spinal injury** (fall from height, diving injury, high-speed impact, neck/back pain, numbness/tingling in limbs): minimize movement, support head/neck in the position found, do not attempt to realign, wait for trained help if at all possible.\n- Check circulation, sensation, and movement below any fracture/splint every 15-30 min \u2014 a too-tight splint can cut off blood flow.\n\n## Dislocations\n- Signs: visibly deformed joint, severe pain, inability to move it.\n- Do not attempt to \"pop it back in\" without training \u2014 you can worsen nerve/vessel damage. Splint/support in the position found and evacuate.\n- Exception: a trained provider may reduce certain simple dislocations (e.g. finger) if evacuation is many hours/days away \u2014 this requires specific technique training, not general first aid knowledge.\n\n## Sprains/strains (soft tissue injury)\n**R.I.C.E.**: Rest, Ice (or cold water, 20 min on/off), Compression (elastic wrap, not so tight it cuts circulation), Elevation above heart level. Reassess after 48-72 hrs; worsening pain, inability to bear weight, or visible deformity suggests fracture instead \u2014 treat as fracture if unsure.\n\n## Head injury\n- Any loss of consciousness, confusion, repeated vomiting, worsening headache, unequal pupils, or seizure after a head hit = evacuate for advanced care urgently \u2014 risk of internal bleeding/swelling.\n- Mild head injury without those signs: rest, monitor closely for 24-48 hrs, wake periodically to check responsiveness if sleeping.\n\n## Chest injury\n- **Open chest wound** (sucking chest wound): cover with an airtight material (plastic wrap, dressing packaging) taped on 3 sides only \u2014 this lets air escape but not re-enter, preventing lung collapse from worsening. Watch for worsening breathing difficulty (possible tension pneumothorax \u2014 evacuate urgently, this can be fatal without a professional needle decompression).\n- **Suspected rib fracture**: pain with breathing/movement, tenderness over ribs. Don't wrap the chest tightly (restricts breathing) \u2014 pain management and gentle activity as tolerated, watch for breathing difficulty.\n\n## Abdominal injury\n- Closed injury with rigid/painful abdomen, bruising, blood in urine/stool = possible internal bleeding \u2014 evacuate urgently, nothing by mouth, monitor for shock.\n- Open wound with organs protruding: do not push organs back in. Cover with a clean, moist (if possible) dressing, loosely, and evacuate urgently.\n\n## Eye injury\n- Chemical splash: flush continuously with clean water for 15-20 min, eyelid held open, before anything else.\n- Embedded object: do not remove or press on the eye. Cover both eyes loosely (to minimize movement) and evacuate.\n- Blunt trauma: cold compress, watch for vision changes/increasing pain \u2014 evacuate if vision affected.\n\n## Animal/insect bites and stings\n- Clean any bite wound thoroughly \u2014 animal mouths carry heavy bacterial load, infection risk is high.\n- Venomous snakebite: keep the person calm and still (movement spreads venom faster), remove rings/tight items near the bite before swelling, keep the bite roughly at heart level, do not cut the wound or attempt to suck out venom (folk remedy, doesn't work, delays real treatment), evacuate urgently \u2014 antivenom is the only definitive treatment. Note distinguishing features of the animal if safely possible (for identification) but don't risk further bites doing so.\n- See `06-animals-insects/` for region-specific dangerous species identification.\n\n## When to prioritize evacuation (expanded from quick-reference)\nAny of: uncontrolled bleeding, airway/breathing compromise, chest/abdominal penetrating wounds, signs of internal bleeding, altered consciousness/head injury with warning signs, suspected spinal injury, open fractures, severe burns, venomous bite/sting, anaphylaxis, worsening infection.\n"}]}, {"id": "03", "label": "03 \u00b7 Water", "files": [{"path": "03-water/README.md", "title": "README", "group": null, "content": "# 03 \u2014 Water\n\n## Subtopics\n- `sourcing/` \u2014 finding groundwater, rainwater catchment, dew collection\n- `purification/` \u2014 boiling, chemical (chlorine/iodine), filtration (ceramic, sand/biosand, UV/SODIS), distillation\n- `storage/` \u2014 safe containers, cistern design, preventing algae/contamination\n- `wells-pumps/` \u2014 hand-dug wells, hand pumps, well maintenance\n\n## Recommended sources\n- CDC/WHO water treatment guidance (public domain / open)\n- Peace Corps well-construction manuals (public domain, US Gov)\n- Appropedia water/sanitation articles (CC)\n- Biosand filter construction guides (CAWST \u2014 open license)\n"}]}, {"id": "04", "label": "04 \u00b7 Food & Agriculture", "files": [{"path": "04-food-agriculture/README.md", "title": "README", "group": null, "content": "# 04 \u2014 Food & Agriculture\n\n## Subtopics\n- `growing/` \u2014 soil, seed saving, crop rotation, permaculture, greenhouse/climate-specific growing\n- `foraging/` \u2014 see also `05-plants-fungi/` for identification\n- `animal-husbandry/` \u2014 chickens, goats, rabbits, bees; feed, shelter, breeding, disease\n- `preservation/` \u2014 canning, drying, root cellaring, smoking, curing, fermentation\n- `hunting-fishing-trapping/`\n- `tools-equipment/` \u2014 hand tools, small-scale mechanization, repair\n\n## Recommended sources\n- USDA / land-grant university extension office bulletins (public domain)\n- Project Gutenberg pre-1930 farming/homesteading texts\n- \"The Have-More Plan\", \"Storey's Guide to...\" series (check licensing per title)\n- FAO manuals on smallholder agriculture (open access)\n"}]}, {"id": "05", "label": "05 \u00b7 Plants & Fungi", "files": [{"path": "05-plants-fungi/README.md", "title": "README", "group": null, "content": "# 05 \u2014 Plants & Fungi\n\n**Highest-caution category in this archive** \u2014 misidentification can kill. Read `docs/CURATION.md`'s safety-critical rules before adding or trusting content here: every edibility claim needs at least two independent identification criteria, named toxic look-alikes, and a source citation.\n\n## Contents\n- [x] `universal-edibility-test.md` \u2014 last-resort protocol for an unidentified plant when no reference is available; not a substitute for identification\n- [x] `fungi-foraging-safety.md` \u2014 why mushroom ID is treated as higher-risk than plant ID in this archive, core safety rules, genera to avoid by default, and why species-level mushroom ID guides are deliberately *not* included here\n- [x] `toxic-plants-widely-confused.md` \u2014 the highest-value dangerous mix-ups to know (water hemlock/wild carrot, death camas/wild onion, pokeweed, castor bean, foxglove/comfrey)\n- [x] `common-survival-plants_global.md` \u2014 widely-distributed, low-ambiguity useful plants (cattail, dandelion, plantain, stinging nettle, chickweed, oak acorns)\n- [x] `medicinal-plants-general-principles.md` \u2014 dosage, drug-interaction, and identification caution for herbal use; principles rather than a dosing catalog\n- [x] `regional/` \u2014 region-specific plant notes keyed to `docs/REGIONS.md`'s lat/long taxonomy; started with a North America temperate example, template provided for adding more\n- [x] `images/` \u2014 black-and-white line-art diagrams: generic mushroom anatomy, leaf morphology vocabulary (arrangement/margin/simple vs. compound), the umbel flower-cluster shape shared by edible and deadly carrot-family plants, and a Universal Edibility Test flowchart. Deliberately generic/procedural, not species-specific renderings \u2014 see \"Why this folder is more conservative\" below\n\n## Why this folder is more conservative than others in the archive\nMost of this archive favors broad, useful coverage. This folder deliberately does not: exhaustive species-level identification guides (especially for fungi) generated from general knowledge carry a real risk of confidently-stated errors that could hurt someone. Where the archive doesn't have a verified, cross-checked source for a specific regional species, it says so rather than guessing \u2014 see `fungi-foraging-safety.md` for the clearest example of this policy.\n\n## Recommended sources for expanding this folder\n- Regional agricultural extension office foraging/toxic-plant guides (usually free, locally accurate, often public domain)\n- Wikipedia species pages (via the Kiwix pack) cross-referenced with a dedicated regional field guide\n- Peterson Field Guide series or equivalent regional guides (check licensing \u2014 likely reference-only, not redistributable, but useful for cross-checking claims before adding them here)\n- Local mycological societies for fungi specifically \u2014 see `fungi-foraging-safety.md` on why this is the right source for that category in particular\n\n## Still to build\n- Additional `regional/` files beyond temperate North America (Mediterranean Europe, tropical regions, etc.)\n- Foraging calendars (seasonal availability) once regional species content exists to build them from\n"}, {"path": "05-plants-fungi/common-survival-plants_global.md", "title": "Common Survival Plants \u2014 Global", "group": null, "content": "# Common, Widely-Distributed Survival Plants\n\nThese are plants with genuinely wide distribution, well-documented identification, and low ambiguity \u2014 chosen deliberately because they're hard to get dangerously wrong, unlike many wild foods. Still cross-check against a regional guide before relying on this alone, and see `docs/CURATION.md` for the two-independent-criteria rule this archive holds itself to for anything edibility-related.\n\n## Cattail (*Typha* species)\n- **Where**: marshes, pond/lake edges, ditches \u2014 nearly worldwide in temperate and subtropical wetlands.\n- **ID**: tall (1-3m), strap-like leaves, unmistakable brown, sausage-shaped flower spike (\"corndog\" head) on a tall stalk \u2014 this seed head is highly distinctive and low-ambiguity.\n- **Use**: young shoots (spring) peeled and eaten raw or cooked; rhizome (root) can be processed into a starchy flour by crushing and washing out the starch; pollen (summer) is a protein-rich flour additive.\n- **Caution**: can absorb pollutants from contaminated water \u2014 avoid harvesting from water known to carry industrial/agricultural runoff.\n\n## Dandelion (*Taraxacum officinale*)\n- **Where**: essentially worldwide as a common \"weed\" in temperate climates \u2014 lawns, fields, disturbed ground.\n- **ID**: basal rosette of jagged (toothed) leaves, single yellow composite flower per hollow stalk, later becoming the well-known white seed puffball \u2014 very low ambiguity, one of the most recognizable plants in the world.\n- **Use**: leaves (best young, more bitter with age) raw or cooked; flowers edible; root can be roasted as a coffee substitute.\n- **Caution**: avoid harvesting from areas treated with herbicide/pesticide, or roadside areas with vehicle pollution exposure.\n\n## Broadleaf & narrowleaf plantain (*Plantago major* / *Plantago lanceolata* \u2014 not related to the banana-like \"plantain\" fruit)\n- **Where**: worldwide as a common lawn/path \"weed,\" extremely tolerant of foot traffic.\n- **ID**: basal rosette of leaves with parallel veins running the length of the leaf (a genuinely distinguishing feature, low ambiguity), broad oval leaves (*major*) or narrow lance-shaped leaves (*lanceolata*), small greenish flower spike.\n- **Use**: young leaves edible raw or cooked; also has a long folk history of topical use on minor cuts/stings/insect bites (crushed leaf applied directly) \u2014 reasonably well corroborated as a mild soothing/drawing agent, not a substitute for real wound care.\n\n## Stinging nettle (*Urtica dioica*)\n- **Where**: temperate regions worldwide, disturbed/nitrogen-rich soil, forest edges, riverbanks.\n- **ID**: opposite, serrated leaves covered in fine stinging hairs (causes an immediate, unmistakable stinging/itching reaction on contact \u2014 this is itself a strong, low-ambiguity identifying feature, if an unpleasant one to discover).\n- **Use**: cooking or drying neutralizes the sting \u2014 young leaves are a nutritious cooked green, widely used traditionally.\n- **Caution**: wear gloves when harvesting; do not eat raw.\n\n## Chickweed (*Stellaria media*)\n- **Where**: worldwide in temperate climates, common garden/lawn weed, cool-season growth.\n- **ID**: small paired oval leaves on branching stems, tiny white star-shaped flowers with deeply notched petals (giving the appearance of ten petals when there are only five), a single line of fine hairs running down one side of the stem, alternating sides at each leaf node \u2014 this hair-line detail is a useful low-ambiguity confirming feature.\n- **Use**: entire above-ground plant edible raw (mild, slightly grassy taste) or cooked.\n\n## Oak acorns (*Quercus* species, worldwide temperate distribution)\n- **Where**: oak trees are widespread across temperate Northern Hemisphere forests.\n- **ID**: acorns (the nut in a cap) are unmistakable and essentially impossible to confuse with a toxic look-alike.\n- **Use**: **not** safe to eat raw in quantity \u2014 most oak species' acorns are high in tannins, which are bitter and can cause digestive upset. Must be processed: shell, then leach the crushed or whole nutmeats in multiple changes of water (cold or hot leaching both work, hot is faster) until the bitterness is gone, then dry and grind into flour.\n- **Caution**: this is a food-value/palatability issue (tannins), not a life-threatening toxin issue like the plants in `toxic-plants-widely-confused.md` \u2014 but skipping the leaching step produces a genuinely unpleasant, digestively harsh result, so don't skip it.\n\n## Notes on scope\nThis list favors extremely common, low-ambiguity, worldwide-distributed plants over an exhaustive regional catalog, deliberately \u2014 see `regional/` for the beginning of region-specific detail, and treat any plant not covered here or in a verified regional/local guide with the caution described in `universal-edibility-test.md`.\n"}, {"path": "05-plants-fungi/fungi-foraging-safety.md", "title": "Fungi Foraging Safety", "group": null, "content": "# Fungi (Mushroom) Foraging Safety\n\nRead this before any other fungi content in this archive. Mushroom identification is a genuinely different risk category from plant identification, and this file is deliberately more restrictive than the rest of `05-plants-fungi/`.\n\n## Why fungi are treated differently here\n- Several of the deadliest plant/fungus poisonings in the world come from mushrooms that closely resemble common edible species \u2014 the amatoxins in *Amanita phalloides* (\"death cap\") and related *Amanita* species cause fatal liver failure, often after a symptom-free delay of 6-24+ hours that can create a false sense of safety before the real damage is already underway.\n- Reliable identification of many mushroom species requires features not practical to describe safely in a general reference: spore print color, precise gill attachment, microscopic features, and subtle differences from toxic look-alikes that vary by region and even by individual specimen age.\n- Unlike most plants, there is no reliable universal \"safety test\" for mushrooms \u2014 the folk methods sometimes repeated (silver spoon discoloration, testing on animals, cooking removes all toxins) are **false** and have caused fatalities. Do not use any of these.\n\n## What this archive will and won't do\n- This archive will **not** attempt to provide species-level mushroom identification guides \u2014 doing so from a general reference risks false confidence in exactly the situation where that confidence kills.\n- What's provided instead: safety principles, and named examples of highly dangerous, widely-distributed genera to know to avoid entirely without expert training.\n\n![Generic mushroom anatomy \u2014 cap, gills, ring, stem, volva](data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgNDgwIDQyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiBmb250LWZhbWlseT0iSGVsdmV0aWNhLCBBcmlhbCwgc2Fucy1zZXJpZiIgc3Ryb2tlPSIjMWExYTFhIiBmaWxsPSJub25lIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj4KICA8dGl0bGU+R2VuZXJpYyBtdXNocm9vbSBhbmF0b215IOKAlCB2b2NhYnVsYXJ5IHJlZmVyZW5jZSwg
