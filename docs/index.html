Zz4KICA8ZyBzdHJva2U9Im5vbmUiIGZpbGw9IiMxYTFhMWEiIGZvbnQtc2l6ZT0iMTUiIGZvbnQtd2VpZ2h0PSI2MDAiPgogICAgPHRleHQgeD0iNDA0IiB5PSI4NCI+Q2FwPC90ZXh0PgogICAgPHRleHQgeD0iNDA0IiB5PSIxNTQiPkdpbGxzPC90ZXh0PgogICAgPHRleHQgeD0iNDA0IiB5PSIyMjQiPlJpbmcgKGFubnVsdXMpPC90ZXh0PgogICAgPHRleHQgeD0iNDA0IiB5PSIyNzQiPlN0ZW08L3RleHQ+CiAgICA8dGV4dCB4PSI0MDQiIHk9IjMyNCI+Vm9sdmE8L3RleHQ+CiAgPC9nPgoKICA8dGV4dCB4PSIyNDAiIHk9IjM5NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxMyIgZm9udC13ZWlnaHQ9IjYwMCIgZmlsbD0iIzFhMWExYSIgc3Ryb2tlPSJub25lIj5DSEVDSyBGT1IgQSBWT0xWQSBBVCBUSEUgQkFTRSDigJQgRElHLCBET04nVCBQVUxMPC90ZXh0Pgo8L3N2Zz4K)\n\n*Vocabulary reference only, not a species guide.* The volva (a cup-like sac at the base) is one of the most commonly missed features because it's often underground \u2014 always dig up the full base rather than pulling, and check for one before considering any wild mushroom further.\n\n## Core safety rules\n1. **Never eat a wild mushroom you cannot identify with certainty from multiple independent, expert-level features** \u2014 a photo match alone is not enough; regional look-alikes are common and often subtly different.\n2. **Learn from a real person, not a book or app alone.** Local foraging groups, mycological societies, and experienced foragers who can show you a specimen in hand are the actual reliable path to safe mushroom identification \u2014 this is one of the few domains where hands-on, local, expert instruction is genuinely necessary rather than a nice-to-have.\n3. **Cooking does not reliably neutralize the most dangerous toxins** (notably amatoxins) \u2014 don't rely on cooking as a safety step for an uncertain specimen.\n4. **When in doubt, don't** \u2014 there is no partial-credit outcome with the deadliest species; a \"probably fine\" mushroom is not worth the downside.\n5. If a wild mushroom is eaten and any illness follows (even mild, even many hours later), **treat it as a medical emergency and seek care immediately**, and if possible bring a sample or clear photo of the mushroom eaten \u2014 amatoxin poisoning is treatable if caught early enough, and time matters enormously.\n\n## Genera worth knowing to avoid by default (not an identification guide \u2014 a name-recognition list)\n- ***Amanita*** \u2014 includes the death cap and destroying angel groups, responsible for the large majority of fatal mushroom poisonings worldwide; also includes some edible species, which is exactly the danger \u2014 avoid the entire genus without expert-level training.\n- ***Galerina*** \u2014 small brown mushrooms that can resemble edible species and also contain amatoxins.\n- ***Conocybe*** and other small brown \"LBM\" (little brown mushroom) groups generally \u2014 highly difficult to distinguish from toxic species reliably; a widely-used rule among foragers is to avoid small brown mushrooms as a category unless you have specific expert training in that group.\n\n## If mushroom cultivation (not foraging) is the goal\nGrowing known, purchased/verified spawn of a specific edible species (oyster mushrooms, shiitake, etc.) in a controlled setting avoids the identification risk entirely, since you control the starting material. This is a very different and much safer activity than wild foraging, and worth prioritizing over foraging if mushrooms are wanted as a reliable food source \u2014 see `04-food-agriculture/` for cultivation-oriented content as it's built out.\n"}, {"path": "05-plants-fungi/medicinal-plants-general-principles.md", "title": "Medicinal Plants General Principles", "group": null, "content": "# Medicinal Plants \u2014 General Principles\n\nThis file covers principles for using plants medicinally, not a catalog of specific remedies \u2014 herbal medicine is a domain where dosage, individual health conditions, and drug interactions matter enormously, and generic dosing advice from a general reference carries real risk.\n\n## Core principles\n1. **\"Natural\" does not mean \"safe.\"** Many of the most potent, dangerous toxins known are plant-derived (see `toxic-plants-widely-confused.md` for examples like foxglove and castor bean) \u2014 a plant being traditional or wild does not make its dose-response curve forgiving.\n2. **Dosage matters as much as the substance.** Many medicinal plants are the same plants that are toxic at higher doses \u2014 the difference between a helpful and a harmful outcome can be a small quantity difference that's hard to judge without training or reliable preparation standards.\n3. **Drug interactions are a real risk**, especially for anyone on prescription medication (blood thinners, heart medication, diabetes medication are common interaction categories) \u2014 herbal treatment is not automatically safe to combine with pharmaceutical treatment.\n4. **Pregnancy and children require extra caution** \u2014 many herbal remedies considered acceptable for a healthy adult are contraindicated in pregnancy or for children, at different thresholds than for adults.\n5. **Positive identification is a prerequisite**, not optional \u2014 the same look-alike risks in `toxic-plants-widely-confused.md` apply directly to medicinal use; a misidentified \"medicinal\" plant is exactly as dangerous as a misidentified \"edible\" one.\n\n## Reasonably well-corroborated, low-risk traditional uses (general categories, not specific dosing)\n- **Topical use of plantain, aloe, or similar mild plants** on minor cuts/scrapes/insect bites \u2014 widely used traditionally, low risk when the plant is correctly identified, not a substitute for the wound care steps in `02-first-aid-medical/trauma-and-wound-care.md` for anything beyond minor.\n- **Willow bark** as a traditional source of salicin (related to aspirin's active compound) \u2014 historically well-documented, but carries the same cautions as aspirin (bleeding risk, allergy, not for children due to Reye's syndrome risk with salicylates) plus the added uncertainty of variable concentration in a home preparation versus a standardized dose.\n- **Ginger and peppermint** for mild nausea \u2014 widely used, low risk, low potency, reasonable first-line options when available.\n- **Chamomile** for mild sleep/relaxation support \u2014 widely used, generally low risk for most adults, but allergy is possible especially for anyone with ragweed/related plant allergies.\n\n## When to defer to pharmaceutical/professional treatment instead\n- Any serious or worsening infection, significant injury, or condition covered in `02-first-aid-medical/medical-emergencies.md` \u2014 herbal treatment is not an adequate substitute for evacuation/advanced care in these situations, only a bridge when nothing else is available.\n- Any situation involving a child, a pregnant person, or someone on regular medication, where interaction/dosing risk is elevated and general guidance is least reliable.\n\n## Building this section out further\nThis file deliberately stays at the principles level. Specific regional medicinal plant catalogs, if added later, should be sourced from an authoritative regional reference (a recognized ethnobotanical text, a health ministry publication) and cross-checked, per `docs/CURATION.md` \u2014 not generated from general knowledge alone, given the dosage-sensitivity concern above.\n"}, {"path": "05-plants-fungi/regional/TEMPLATE.md", "title": "TEMPLATE", "group": "regional", "content": "Region: [Subregion], [Macro-region]\nApprox. bounding box: [lat]\u00b0N\u2013[lat]\u00b0N, [long]\u00b0W/E\u2013[long]\u00b0W/E\nCountries/territories (as of [year]): [list \u2014 informational only]\nNote: political boundaries may change; the bounding box above is this file's stable reference.\n\n# [Subregion] \u2014 Regional Plant Notes\n\n**Before adding species-level entries here**, re-read `docs/CURATION.md`'s safety-critical section and `05-plants-fungi/toxic-plants-widely-confused.md`. Every edible-plant entry needs:\n- At least two independent identifying features (not a photo alone)\n- Named toxic look-alikes present in the same region, with how to tell them apart\n- A source citation (regional field guide, extension office, or similarly authoritative reference \u2014 not general knowledge alone)\n- Season/growth-stage notes where identification is easier/harder at different stages\n\n## Category overview for this region (fill in before species detail)\n- Which of the widely-distributed plants in `common-survival-plants_global.md` are present here, if any\n- What locally significant toxic plant families/genera exist that a forager in this region should know to recognize and avoid\n- Any locally significant medicinal plant tradition worth cross-referencing with `medicinal-plants-general-principles.md`\n\n## Species entries\n(Add using the format above once sourced against an authoritative regional reference.)\n"}, {"path": "05-plants-fungi/regional/north-america_temperate.md", "title": "North America \u2014 Temperate", "group": "regional", "content": "Region: Temperate North America, North America\nApprox. bounding box: 25\u00b0N\u201360\u00b0N, 130\u00b0W\u201365\u00b0W\nCountries/territories (as of 2026): United States (excluding Alaska/Hawaii), Canada (southern provinces), northern Mexico border zone\nNote: political boundaries may change; the bounding box above is this file's stable reference. Cross-referenced with `02-first-aid-medical/regional-health-considerations/north-america_temperate.md` for the same geographic scope.\n\n# Temperate North America \u2014 Regional Plant Notes\n\n## Category overview\n- Most of `common-survival-plants_global.md` (cattail, dandelion, plantain, stinging nettle, chickweed, oak acorns) are present and common across this entire subregion.\n- The carrot/parsley family caution in `toxic-plants-widely-confused.md` is directly relevant here \u2014 water hemlock and poison hemlock are both present across most of temperate North America, especially near water and disturbed ground respectively.\n- Poison ivy, poison oak, and poison sumac (*Toxicodendron* species) are a distinct, extremely common regional hazard \u2014 not toxic to eat (rarely eaten at all) but cause a severe allergic skin reaction (urushiol) on contact for most people. Widely known identifying rule of thumb: \"leaves of three, let it be\" for poison ivy/oak (compound leaves in groups of three leaflets) \u2014 a genuinely useful and widely corroborated field heuristic for this specific plant, unlike most such rhymes.\n\n## Species entries\n\n### Poison ivy / poison oak (*Toxicodendron radicans* and relatives)\n- **Identifying features**: compound leaves in groups of three leaflets, leaflet edges can be smooth, toothed, or lobed (variable \u2014 don't rely on edge shape alone), often reddish in new spring growth and again in fall, can grow as a low plant, climbing vine, or shrub depending on region and conditions.\n- **Hazard**: urushiol oil on all parts of the plant (including in smoke if burned \u2014 inhaling burning poison ivy is a serious respiratory hazard, never burn it) causes an itchy, blistering rash on contact for most people, developing over 12-72 hours.\n- **Response to contact**: wash exposed skin thoroughly with soap and water as soon as possible (reduces but doesn't eliminate reaction risk), wash any clothing/tools that contacted it (oil stays active on surfaces for a long time), calamine lotion/antihistamines for symptom relief once a reaction develops, seek care for a severe or widespread reaction, facial involvement, or difficulty breathing (possible smoke inhalation history).\n- **Source**: widely corroborated across North American extension office and outdoor safety guidance.\n\n## Building this out further\nAdditional species entries (blackberry/bramble, chicory, wild grape vs. the toxic Canada moonseed look-alike, etc.) should be added following the TEMPLATE.md format, cross-checked against a regional field guide before inclusion.\n"}, {"path": "05-plants-fungi/toxic-plants-widely-confused.md", "title": "Toxic Plants Widely Confused", "group": null, "content": "# Toxic Plants Commonly Confused With Edible Look-Alikes\n\nThese are widely documented, frequently-cited dangerous mix-ups \u2014 not a complete list, but the highest-value ones to know because the confusion is common and the consequences are severe. Cross-check any of these against a second source and local expertise before relying on this for identification in the field.\n\n![Leaf arrangement, margin, and simple vs. compound reference diagram](data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgNDgwIDU2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiBmb250LWZhbWlseT0iSGVsdmV0aWNhLCBBcmlhbCwgc2Fucy1zZXJpZiIgc3Ryb2tlPSIjMWExYTFhIiBmaWxsPSJub25lIiBzdHJva2Utd2lkdGg9IjIuMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj4KICA8dGl0bGU+R2VuZXJpYyBsZWFmIG1vcnBob2xvZ3kgdm9jYWJ1bGFyeSDigJQgYXJyYW5nZW1lbnQsIG1hcmdpbiwgYW5kIHNpbXBsZSB2cy4gY29tcG91bmQ8L3RpdGxlPgoKICA8dGV4dCB4PSIyMCIgeT0iMjgiIGZvbnQtc2l6ZT0iMTYiIGZvbnQtd2VpZ2h0PSI3MDAiIHN0cm9rZT0ibm9uZSIgZmlsbD0iIzFhMWExYSI+TEVBRiBBUlJBTkdFTUVOVDwvdGV4dD4KICA8bGluZSB4MT0iMCIgeTE9IjQwIiB4Mj0iNDgwIiB5Mj0iNDAiIHN0cm9rZS13aWR0aD0iMSIgc3Ryb2tlLWRhc2hhcnJheT0iMSw1Ii8+CgogIDwhLS0gQWx0ZXJuYXRlIC0tPgogIDxnPgogICAgPGxpbmUgeDE9IjcwIiB5MT0iNTUiIHgyPSI3MCIgeTI9IjE1MCIgc3Ryb2tlLXdpZHRoPSIyIi8+CiAgICA8ZWxsaXBzZSBjeD0iNDUiIGN5PSI3NSIgcng9IjIyIiByeT0iOSIgdHJhbnNmb3JtPSJyb3RhdGUoLTI1IDQ1IDc1KSIgZmlsbD0iIzFhMWExYSIgZmlsbC1vcGFjaXR5PSIwLjA4Ii8+CiAgICA8ZWxsaXBzZSBjeD0iOTUiIGN5PSIxMDAiIHJ4PSIyMiIgcnk9IjkiIHRyYW5zZm9ybT0icm90YXRlKDI1IDk1IDEwMCkiIGZpbGw9IiMxYTFhMWEiIGZpbGwtb3BhY2l0eT0iMC4wOCIvPgogICAgPGVsbGlwc2UgY3g9IjQ1IiBjeT0iMTI1IiByeD0iMjIiIHJ5PSI5IiB0cmFuc2Zvcm09InJvdGF0ZSgtMjUgNDUgMTI1KSIgZmlsbD0iIzFhMWExYSIgZmlsbC1vcGFjaXR5PSIwLjA4Ii8+CiAgICA8dGV4dCB4PSI3MCIgeT0iMTcyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjEzIiBzdHJva2U9Im5vbmUiIGZpbGw9IiMxYTFhMWEiPkFsdGVybmF0ZTwvdGV4dD4KICA8L2c+CgogIDwhLS0gT3Bwb3NpdGUgLS0+CiAgPGc+CiAgICA8bGluZSB4MT0iMjQwIiB5MT0iNTUiIHgyPSIyNDAiIHkyPSIxNT kVEIEJZIEVESUJMRSAmYW1wOyBERUFETFkgU1BFQ0lFUyBBTElLRTwvdGV4dD4KCiAgPHRleHQgeD0iMjQwIiB5PSIzMTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTIiIGZvbnQtc3R5bGU9Iml0YWxpYyIgc3Ryb2tlPSJub25lIiBmaWxsPSIjMWExYTFhIj5TaGFwZSBhbG9uZSBuZXZlciBjb25maXJtcyBzcGVjaWVzIOKAlCBzZWUgdG94aWMtcGxhbnRzLXdpZGVseS1jb25mdXNlZC5tZDwvdGV4dD4KPC9zdmc+Cg==)\n- **Water hemlock (*Cicuta* species)** is widely regarded as one of the most toxic plants in North America \u2014 a small amount of the root can be fatal. It grows in wet areas (stream banks, marshes, ditches) and has the umbrella-shaped flower clusters (umbels) typical of the carrot/parsley family, which it shares with several edible relatives.\n- **Distinguishing features are genuinely difficult** for a non-expert \u2014 the safest approach is to treat any wild umbel-flowered plant near water with serious caution, and to never harvest wild members of this plant family (which includes carrot, parsley, dill, and their toxic look-alikes) from the wild for eating without expert verification, even though some family members are edible garden crops. Domesticated, purchased carrots/parsley are unrelated to this risk.\n- Poison hemlock (*Conium maculatum*, a different plant from water hemlock but similarly deadly, associated historically with Socrates' execution) shares the same family and the same caution.\n\n## Death camas vs. wild onion/garlic\n- **Death camas (*Toxicoscordion*/*Zigadenus* species)** has grass-like leaves and a bulb that superficially resembles wild onion.\n- **Key distinguishing check**: true wild onion and garlic have a distinct onion/garlic smell when crushed; death camas does not. This smell test is a commonly cited, reasonably reliable field check for this specific confusion \u2014 but should still be paired with looking at the flower if the plant is blooming (onions have round flower clusters; death camas flowers are different) rather than relied on alone.\n\n## Pokeweed vs. elderberry (young shoots) and other confusions\n- **Pokeweed (*Phytolacca americana* and relatives)** is toxic in most parts, especially mature stems, roots, and berries \u2014 although young shoots are traditionally prepared as food in some regional cuisines with specific, multi-boil processing that removes toxins, this is not something to attempt without direct instruction from an experienced local source.\n- Elderberry (*Sambucus* species) is a separate plant, generally considered a useful food/medicinal plant, but also requires processing (cooking) since raw elderberries and other plant parts contain compounds that cause illness.\n- These two plants are sometimes confused at the young-shoot stage \u2014 this is a case where \"some parts are edible with the right processing\" makes the plant more dangerous to a beginner than a plant that's simply always toxic, since it invites shortcuts. Don't take shortcuts with either.\n\n## Castor bean (unrelated to safe \"beans\")\n- The **castor bean plant (*Ricinus communis*)**, grown widely as an ornamental and for castor oil production, produces seeds containing ricin, one of the most potent plant toxins known \u2014 a small number of chewed seeds can be fatal. It is not related to edible bean crops and should never be treated as food regardless of visual similarity to unfamiliar \"bean\" pods.\n\n## Foxglove vs. comfrey/borage (young leaves)\n- **Foxglove (*Digitalis purpurea* and relatives)**, source of the cardiac medication digitalis, is toxic in all parts, and its young leaves before flowering can superficially resemble comfrey or borage leaves harvested by foragers.\n- Distinguishing by leaf texture and growth pattern is possible but genuinely easy to get wrong for a beginner \u2014 wait for a plant to flower (foxglove's tall spike of tubular flowers is distinctive and unmistakable) before harvesting any plant in this general growth form if there is any doubt, since flowering removes the ambiguity entirely.\n\n## General principle behind all of these\nThe common thread: the most dangerous mix-ups in foraging are not between an edible plant and something wildly different \u2014 they're between an edible plant and something that looks *almost* the same, especially before flowering or in a young growth stage where distinguishing features haven't developed yet. When a plant is ambiguous, waiting for it to mature/flower before making an identification decision is often the single highest-value safety practice available, more reliable than any quick field trick.\n"}, {"path": "05-plants-fungi/universal-edibility-test.md", "title": "Universal Edibility Test", "group": null, "content": "# Universal Edibility Test\n\nA last-resort protocol (drawn from US Army survival doctrine, e.g. FM 21-76) for evaluating a plant when you cannot positively identify it and have no reference material to confirm safety. **This is not a substitute for identification** \u2014 it exists for genuine last-resort situations, takes many hours to do properly, and still cannot detect every toxin (some act on a delay of many hours to days, and the test does not protect against those). Positive identification against `05-plants-fungi/` reference material or a trained forager is always preferable.\n\n## Before you start\n- Only test one plant at a time.\n- Only test plants that are abundant nearby \u2014 no point risking discomfort/illness for a plant you can't gather more of.\n- Never test fungi with this method \u2014 see `fungi-foraging-safety.md`. Fungal toxins are not reliably screened by this protocol and the consequences are disproportionately severe.\n- Skip any plant with these automatic red flags (do not test them at all): milky or discolored sap, spines/fine hairs, umbrella-shaped flower clusters (many toxic plants in the carrot/parsley family share this shape with edible ones \u2014 see `toxic-plants-widely-confused.md`), a bitter or soapy taste in the initial contact test below, beans/bulbs/seeds inside pods (many are toxic), an almond scent in woody parts/seeds (possible cyanide compounds), grain heads with pink/purple/black spurs (possible fungal contamination like ergot).\n\n![Universal Edibility Test procedure as a flowchart](data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgNTIwIDgwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiBmb250LWZhbWlseT0iSGVsdmV0aWNhLCBBcmlhbCwgc2Fucy1zZXJpZiIgc3Ryb2tlPSIjMWExYTFhIiBmaWxsPSJub25lIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+CiAgPHRpdGxlPlVuaXZlcnNhbCBFZGliaWxpdHkgVGVzdCDigJQgcHJvY2VkdXJhbCBmbG93Y2hhcnQsIGxhc3QgcmVzb3J0IG9ubHksIG5ldmVyIGZvciBmdW5naTwvdGl0bGU+CgogIDxkZWZzPgogICAgPG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSIxMCIgcmVmWD0iNiIgcmVmWT0iMyIgb3JpZW50PSJhdXRvIj4KICAgICAgPHBhdGggZD0iTTAsMCBMNiwzIEwwLDYgWiIgZmlsbD0iIzFhMWExYSIgc3Ryb2tlPSJub25lIi8+CiAgICA8L21hcmtlcj4KICA8L2RlZnM+CgogIDwhLS0gdG9wIGJhbm5lciAtLT4KICA8cmVjdCB4PSI0MCIgeT0iMTAiIHdpZHRoPSI0NDAiIGhlaWdodD0iNDAiIHJ4PSI0IiBmaWxsPSIjMWExYTFhIiBmaWxsLW9wYWNpdHk9IjAuMDYiLz4KICA8dGV4dCB4PSIyNjAiIHk9IjM1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE0IiBmb250LXdlaWdodD0iNzAwIiBzdHJva2U9Im5vbmUiIGZpbGw9IiMxYTFhMWEiPkxBU1QgUkVTT1JUIE9OTFkg4oCUIE5FVkVSIEZPUiBNVVNIUk9PTVM8L3RleHQ+CgogIDwhLS0gc3RlcCBib3hlcyAtLT4KICA8ZyBmb250LXNpemU9IjEzIiBzdHJva2U9Im5vbmUiIGZpbGw9IiMxYTFhMWEiPgogICAgPCEtLSAxIC0tPgogICAgPHJlY3QgeD0iMTQwIiB5PSI3MCIgd2lkdGg9IjI0MCIgaGVpZ2h0PSI0NiIgcng9IjYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzFhMWExYSIgc3Ryb2tlLXdpZHRoPSIyIi8+CiAgICA8dGV4dCB4PSIyNjAiIHk9IjkwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNzAwIj4xLiBTZXBhcmF0ZSBpbnRvIHBhcnRzPC90ZXh0PgogICAgPHRleHQgeD0iMjYwIiB5PSIxMDYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTEiPnRlc3Qgb25lIHBhcnQgYXQgYSB0aW1lPC90ZXh0PgoKICAgIDwhLS0gMiAtLT4KICAgIDxyZWN0IHg9IjE0MCIgeT0iMTQ2IiB3aWR0aD0iMjQwIiBoZWlnaHQ9IjQ2IiByeD0iNiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMWExYTFhIiBzdHJva2Utd2lkdGg9IjIiLz4KICAgIDx0ZXh0IHg9IjI2MCIgeT0iMTY2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNzAwIj4yLiBTbWVsbCB0ZXN0PC90Z T0iMjYwIiB5MT0iNjYwIiB4Mj0iMjYwIiB5Mj0iNjg4Ii8+CiAgPC9nPgoKICA8IS0tIHNpZGUgYnJhbmNoZXMgdG8gU1RPUCBib3ggZnJvbSBzdGVwcyAzLTggLS0+CiAgPGcgc3Ryb2tlPSIjMWExYTFhIiBzdHJva2Utd2lkdGg9IjEuNCIgc3Ryb2tlLWRhc2hhcnJheT0iNCwzIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSI+CiAgICA8bGluZSB4MT0iMzgwIiB5MT0iMjQ1IiB4Mj0iNDE4IiB5Mj0iMzgwIi8+CiAgICA8bGluZSB4MT0iMzgwIiB5MT0iMzIxIiB4Mj0iNDE4IiB5Mj0iNDAwIi8+CiAgICA8bGluZSB4MT0iMzgwIiB5MT0iMzk3IiB4Mj0iNDE4IiB5Mj0iNDIwIi8+CiAgICA8bGluZSB4MT0iMzgwIiB5MT0iNDczIiB4Mj0iNDE4IiB5Mj0iNDYwIi8+CiAgICA8bGluZSB4MT0iMzgwIiB5MT0iNTUyIiB4Mj0iNDE4IiB5Mj0iNTAwIi8+CiAgICA8bGluZSB4MT0iMzgwIiB5MT0iNjM0IiB4Mj0iNDE4IiB5Mj0iNTYwIi8+CiAgPC9nPgoKICA8IS0tIGJvdHRvbSBub3RlIC0tPgogIDx0ZXh0IHg9IjI2MCIgeT0iNzc1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjEyIiBmb250LXN0eWxlPSJpdGFsaWMiIGZpbGw9IiMxYTFhMWEiIHN0cm9rZT0ibm9uZSI+RnVsbCB0ZXh0LCByZWQtZmxhZyBleGNsdXNpb25zLCBhbmQgbGltaXRhdGlvbnM6IHVuaXZlcnNhbC1lZGliaWxpdHktdGVzdC5tZDwvdGV4dD4KPC9zdmc+Cg==)\n\n## The test \u2014 each step is a separate several-hour stage\n1. **Separate the plant into parts** (roots, stems, leaves, buds, flowers) \u2014 test only one part at a time, since edibility can differ between parts of the same plant.\n2. **Smell test**: crush a portion, smell for strong/acrid odors \u2014 a strongly disagreeable smell is a reason to stop with that part.\n3. **Skin contact test**: place a piece on the inner wrist or elbow for 15 minutes. Reaction (burning, itching, rash) = do not proceed with that part.\n4. **Lip test**: touch a small piece to your lips for 3 minutes, watching for burning/itching/numbness. Any reaction = stop.\n5. **Tongue test**: place a small piece on your tongue, hold for 15 minutes without swallowing. Any burning, numbness, or strong unpleasant reaction = stop.\n6. **Chew test**: chew a small piece for 15 minutes without swallowing, watching for the same reactions. Spit out.\n7. **Swallow test**: if no reaction through the above, swallow a small piece and wait **8 hours** without eating anything else, watching for nausea, cramping, or other symptoms.\n8. **Small quantity test**: if no reaction after 8 hours, eat a slightly larger quantity (about a quarter cup) prepared the same way and wait another **8 hours**.\n9. Only after both waiting periods produce no reaction should the plant part be considered acceptable to eat in normal quantities \u2014 and even then, in moderation, since this test cannot rule out cumulative or delayed effects.\n\n## Important limitations\n- This process takes at minimum ~24 hours per plant part and provides no protection against delayed-onset toxins (some serious plant toxins don't produce symptoms for a day or more).\n- It provides no protection at all against fungal toxins \u2014 never apply it to mushrooms.\n- A plant passing this test is not necessarily nutritionally worthwhile \u2014 palatability and food value are separate questions from safety.\n- This exists as a last-resort tool for genuine survival situations with no other option, not as a general foraging method \u2014 always prefer positive identification first.\n"}]}, {"id": "06", "label": "06 \u00b7 Animals & Insects", "files": [{"path": "06-animals-insects/README.md", "title": "README", "group": null, "content": "# 06 \u2014 Animals & Insects\n\n## Contents\n- [x] `dangerous-species-general-principles.md` \u2014 general (non-regional) venomous species and predator-avoidance principles\n- [x] `livestock-basics.md` \u2014 chickens, goats, rabbits starter care\n- [x] `edible-insects-basics.md` \u2014 safety principles, commonly-eaten categories, small-scale farming over wild foraging\n- [x] `hunting-trapping-basics.md` \u2014 trap types, processing basics\n- [x] `pest-disease-vectors.md` \u2014 mosquitoes, ticks, rodents, stored-food pests\n- [ ] `regional/` \u2014 region-specific dangerous species identification, keyed to `docs/REGIONS.md` \u2014 not yet built\n\n## Curation note\nSame safety-critical standard as `05-plants-fungi/` applies to any specific species-identification content (especially venomous species) \u2014 two independent identifying features, named similar/confusable species, source citation. General principles here are lower-risk than species-level ID and are covered; species-level regional identification is intentionally left for `regional/` to be built with proper sourcing.\n\n## Still to build\n- `regional/` species identification, mirroring `02-first-aid-medical/regional-health-considerations/` and `05-plants-fungi/regional/`\n- Larger livestock (cattle, pigs, sheep)\n- Detailed trap construction and primitive weapon-making\n"}, {"path": "06-animals-insects/dangerous-species-general-principles.md", "title": "Dangerous Species General Principles", "group": null, "content": "# Dangerous Species \u2014 General Principles\n\nGeneral, non-regional principles for assessing animal/insect danger. Pair with `regional/` (once populated) for species-specific identification, and `02-first-aid-medical/trauma-and-wound-care.md` for bite/sting treatment.\n\n## General venomous-snake recognition (not universal \u2014 always defer to regional guides)\n- No single reliable global visual rule exists (\"triangular head,\" \"vertical pupils,\" etc. all have exceptions by region) \u2014 the only fully reliable method is knowing the specific species present in your area.\n- Default behavior around any unidentified snake: leave it alone, keep a wide distance, do not attempt to handle or kill it \u2014 most bites happen when someone tries to interact with the animal.\n- Watch step placement and hand placement (rocks, logs, gathering firewood) in any region with venomous species \u2014 most bites are defensive, on the hands/feet, from an animal that was startled or grabbed blind.\n\n## General principles for large/predatory animals\n- Most large predators avoid humans by default; encounters are more common when animals are habituated to human food (secure food/garbage, never feed wildlife) or surprised at close range.\n- Making noise while moving through dense/limited-visibility terrain reduces surprise encounters.\n- Group size deters most predators \u2014 solo travel in known predator habitat carries higher risk.\n- Know the specific \"what to do\" for locally present large predators (e.g. play dead vs. fight back varies by species \u2014 bears are not uniform on this) \u2014 see regional files as they're built.\n\n## Insects and disease vectors\n- Most serious insect-related harm globally comes from disease transmission (mosquitoes, ticks) rather than direct venom \u2014 see `02-first-aid-medical/regional-health-considerations/` for regional disease patterns tied to specific vectors.\n- Basic protective measures apply broadly: covering skin at dawn/dusk (peak mosquito activity for many species), permethrin-treated clothing, checking for ticks after time in brush, sealing food against rodents/insects.\n\n## General sting/bite response\n- See `02-first-aid-medical/trauma-and-wound-care.md` (\"Animal/insect bites and stings\") for immediate response steps.\n- Note distinguishing features of the animal if safely possible, without risking further exposure \u2014 helps identify appropriate antivenom/treatment.\n\n## Needs deeper research\nRegion-specific species identification (venomous snakes, spiders, marine life, large predators) \u2014 see `06-animals-insects/regional/` once populated, following the same lat/long taxonomy as `02-first-aid-medical/regional-health-considerations/`.\n"}, {"path": "06-animals-insects/edible-insects-basics.md", "title": "Edible Insects Basics", "group": null, "content": "# Edible Insects \u2014 Basics\n\nEntomophagy (eating insects) is a well-established, high-protein food source in much of the world, though culturally unfamiliar in others. Basic safety and starting points.\n\n## General safety principles\n- **Always cook insects before eating** \u2014 reduces parasite/pathogen risk significantly; raw insects carry meaningfully higher risk than raw plants.\n- **Avoid brightly colored insects** \u2014 bright coloration is often (not always, but commonly enough to be a useful default) a warning signal (aposematism) for toxicity in the insect world.\n- **Avoid insects with a strong odor when disturbed** \u2014 often indicates a chemical defense compound.\n- **Avoid any insect that has been in contact with pesticides** \u2014 insects from treated agricultural areas or gardens may carry chemical residue.\n- People with shellfish allergies should be cautious \u2014 insects share some of the same proteins (chitin, tropomyosin) that trigger shellfish allergic reactions.\n\n## Commonly eaten, widely corroborated categories\n- **Crickets and grasshoppers** \u2014 widely eaten globally, generally considered safe when cooked, avoid ones that may have contacted pesticides.\n- **Mealworms** (beetle larvae) \u2014 easy to farm in a controlled setting (see below), commonly eaten, low risk since farmed rather than wild-caught.\n- **Termites and ants** \u2014 eaten in many cultures, generally safe cooked; avoid ants with strong chemical defenses (some large ant species have painful/toxic bites, not just stings).\n\n## What to avoid entirely\n- Any insect you cannot identify with confidence.\n- Caterpillars/larvae in general, unless specifically known-safe for your region \u2014 many have irritant hairs or sequester plant toxins from what they eat.\n- Spiders, scorpions, and other arachnids are a separate category from insects and carry higher identification/safety risk \u2014 not covered by general insect-eating guidance.\n\n## Small-scale insect farming (lower risk than wild foraging)\n- **Mealworms** \u2014 easy to raise in a container with bran/oats as substrate and occasional vegetable scraps for moisture; a well-documented, low-effort protein source.\n- **Black soldier fly larvae** \u2014 used in some small-scale systems to process food waste into a protein source; requires more specific setup knowledge.\n- Farming known, controlled insect populations avoids the wild-identification risk entirely, similar to the mushroom-cultivation-over-foraging principle in `05-plants-fungi/fungi-foraging-safety.md`.\n\n## Needs deeper research\nRegion-specific edible insect species and traditional preparation methods; detailed mealworm/soldier fly farming setup instructions.\n"}, {"path": "06-animals-insects/hunting-trapping-basics.md", "title": "Hunting Trapping Basics", "group": null, "content": "# Hunting & Trapping Basics\n\nStarter overview. Legal/ethical hunting practice depends heavily on jurisdiction and situation \u2014 this covers general survival-context principles, not region-specific regulation (irrelevant in a true survival scenario, but worth knowing in normal times).\n\n## General principles\n- Trapping is generally more energy-efficient than active hunting \u2014 a set trap works while you do other tasks; this matters a great deal in a sustained survival/resource-constrained situation.\n- Small game (rabbits, squirrels, birds) is more consistently available and easier to process than large game, and carries lower risk (large game hunting carries injury risk from the animal itself and from processing).\n- Understanding local animal sign (tracks, scat, trails, feeding sign) is the foundation of both hunting and trapping \u2014 placement matters more than the specific trap/weapon design.\n\n## Basic trap types (general concepts, not detailed build instructions)\n- **Snares** \u2014 a noose set on an animal trail/den entrance, tightens when the animal moves through it; effective for small-to-medium game, requires knowledge of trail placement.\n- **Deadfalls** \u2014 a weighted object triggered to fall on the animal; various trigger mechanisms (figure-4 trigger is a widely documented basic design).\n- **Funnel/box traps** \u2014 direct animal movement toward a catch point using natural or constructed barriers; useful for both live-catch and lethal setups.\n\n## Processing basics\n- Field dress (remove internal organs) as soon as practical after a kill \u2014 delays increase spoilage risk and taint meat quality, especially in warm weather.\n- Cool the carcass as quickly as possible; hang/skin promptly.\n- Avoid gut contents contaminating meat during field dressing \u2014 this is the primary technique to get right.\n- Cook thoroughly \u2014 wild game carries higher parasite risk than commercially processed meat in many regions (see `02-first-aid-medical/regional-health-considerations/` for regional disease patterns, some of which are animal-contact or bushmeat-associated).\n\n## Needs deeper research\nDetailed trap construction diagrams, region-specific game species and behavior, detailed butchering/processing technique, bow/primitive weapon construction.\n"}, {"path": "06-animals-insects/livestock-basics.md", "title": "Livestock Basics", "group": null, "content": "# Livestock Basics\n\nStarter overview for small-scale animal keeping. Cross-reference `04-food-agriculture/` for feed/food-system integration.\n\n## Chickens\n- Low barrier to entry, fast return (eggs within ~5-6 months from chick, meat birds faster), omnivorous (kitchen scraps, bugs, feed).\n- Basic needs: predator-proof coop (secure at night especially), ~2-4 sq ft per bird indoor space, nesting boxes, clean water, roosting bars.\n- Common issues: mites/lice, respiratory illness in damp/poorly ventilated coops, predation (foxes, raccoons, hawks, snakes taking eggs).\n\n## Goats\n- Good for milk and meat in varied terrain, including marginal land unsuitable for crops; browse rather than graze (eat brush/shrubs preferentially).\n- Basic needs: secure fencing (goats are notorious escape artists \u2014 climb and push through weak points), shelter from rain/wind, mineral supplementation, hoof trimming.\n- Common issues: internal parasites (rotate pasture where possible), bloat if given excess rich feed too quickly.\n\n## Rabbits\n- Fast breeding cycle, efficient feed-to-meat conversion, quiet, low land requirement relative to larger livestock.\n- Basic needs: secure hutch/cage (protected from predators and temperature extremes), consistent feed (hay-heavy diet), clean water.\n- Common issues: heat stress (rabbits are vulnerable to high heat), respiratory illness in damp conditions.\n\n## General livestock principles\n- Water access and quality matters as much as feed \u2014 check daily.\n- Isolate sick animals promptly to limit spread within a small herd/flock.\n- Breeding pair/small-group planning matters for sustainability \u2014 avoid inbreeding depression by planning genetic diversity (multiple unrelated breeding lines) from the start if building a long-term herd.\n- Vaccination/veterinary access will likely not exist in a prolonged crisis \u2014 basic husbandry (clean water, adequate space, good nutrition, prompt isolation of sick animals) is the primary disease-prevention tool available.\n\n## Needs deeper research\nLarger livestock (cattle, pigs, sheep), region-specific breed selection, detailed feed formulation, and disease identification/treatment without veterinary access.\n"}, {"path": "06-animals-insects/pest-disease-vectors.md", "title": "Pest Disease Vectors", "group": null, "content": "# Pest & Disease Vector Management\n\nCross-references `02-first-aid-medical/sanitation-hygiene.md` and the regional disease patterns in `02-first-aid-medical/regional-health-considerations/`.\n\n## Mosquitoes\n- Eliminate standing water near living areas \u2014 even small amounts (bottle caps, tire ruts, blocked gutters) are enough to breed.\n- Netting (ideally insecticide-treated) over sleeping areas in mosquito-prone regions is one of the highest-value, lowest-cost interventions available for malaria/dengue/other mosquito-borne disease prevention.\n- Cover skin and use repellent at dawn/dusk in regions with day-and-dusk-biting species.\n\n## Ticks\n- Check thoroughly after time in brush/tall grass/wooded areas \u2014 a tick generally needs many hours of attachment to transmit disease, so prompt removal meaningfully reduces risk.\n- Remove with fine-tipped tweezers, grasping close to the skin, pulling straight out with steady pressure \u2014 don't twist, don't use folk methods (heat, petroleum jelly) which can increase disease transmission risk by agitating the tick.\n- Light-colored clothing makes ticks easier to spot before they attach.\n\n## Rodents\n- Seal food storage completely \u2014 rodents both eat stored food and contaminate remaining food with urine/droppings (a disease transmission route, see hantavirus/Lassa fever notes in relevant regional health files).\n- Keep living/storage areas clear of clutter that provides nesting habitat.\n- Ventilate before cleaning any area with heavy rodent droppings, avoid dry-sweeping (aerosolizes contaminated dust) \u2014 dampen first.\n\n## Flies and general sanitation pests\n- Directly tied to waste management \u2014 see `02-first-aid-medical/sanitation-hygiene.md` for latrine covering/ash application and garbage management, both of which are the primary fly-control method available without pesticides.\n\n## Stored-food pests (weevils, grain moths, etc.)\n- Store dry goods in sealed, hard containers (glass, metal, thick plastic) rather than original packaging.\n- Diatomaceous earth (food-grade) mixed into stored grain is a widely used, low-tech deterrent for some stored-product pests.\n- Inspect stored food periodically; discard visibly infested stock rather than risking spread to clean stores.\n\n## Needs deeper research\nRegion-specific pest species, non-chemical pest control techniques in more depth, integration with `04-food-agriculture/` crop pest management.\n"}]}, {"id": "07", "label": "07 \u00b7 Shelter & Construction", "files": [{"path": "07-shelter-construction/README.md", "title": "README", "group": null, "content": "# 07 \u2014 Shelter & Construction\n\n## Contents\n- [x] `emergency-shelter-basics.md` \u2014 expands on the quick-reference fire/shelter card\n- [x] `basic-carpentry-joinery.md` \u2014 wood joinery without metal fasteners, basic tools\n- [x] `basic-masonry-earthbuilding.md` \u2014 cob, adobe, rammed earth, stone masonry\n- [x] `structural-basics.md` \u2014 load paths, foundations, roofing, openings\n- [x] `sanitation-infrastructure-basics.md` \u2014 latrine/composting toilet/greywater construction\n\n## Still to build\n- Detailed build diagrams/dimensions for each structure type\n- Region/climate-specific shelter designs (desert, tropical, arctic)\n- Lime mortar and other from-scratch building material production\n"}, {"path": "07-shelter-construction/basic-carpentry-joinery.md", "title": "Basic Carpentry Joinery", "group": null, "content": "# Basic Carpentry & Joinery\n\nStarter overview for building with wood without power tools or manufactured hardware.\n\n## Core joinery concepts (no metal fasteners required)\n- **Notched joints** (e.g. log cabin corner notching) \u2014 logs/timbers cut with matching notches that interlock under their own weight, a foundational technique for log structures.\n- **Mortise and tenon** \u2014 a projecting tenon on one piece fits into a cut mortise (slot) on another; one of the strongest traditional wood joints, used for frames.\n- **Lashing/binding** \u2014 rope, vine, or cordage wrapped and tightened around a joint (e.g. lashing poles into an A-frame); fast, requires no cutting precision, weaker than interlocking joints but very practical for quick construction.\n- **Pegged joints** \u2014 a hole drilled through an assembled joint and a wooden peg driven through to lock it, used historically before widespread metal fastener availability (timber framing tradition).\n\n## Basic tool set (minimum viable)\n- Axe (felling and general shaping)\n- Hand saw\n- Chisel and mallet\n- Hand drill/auger (for peg holes)\n- Measuring/marking tools (string line, straightedge)\n- A drawknife is a significant efficiency upgrade for shaping round stock but not strictly required to start\n\n## Wood selection basics\n- Green (freshly cut) wood is easier to work but shrinks/warps as it dries \u2014 account for this in joinery (a peg or lashing can be re-tightened; a tight-fit interlocking joint made with green wood may loosen as it dries).\n- Straight-grained wood is stronger and easier to work than twisted-grain wood.\n- Rot resistance varies significantly by species \u2014 some woods (varies regionally) are far better suited to ground contact or wet exposure; a load-bearing outdoor structure benefits from knowing locally rot-resistant species.\n\n## Needs deeper research\nSpecies-specific wood properties by region, detailed timber-framing technique, tool sharpening/maintenance, furniture-level joinery beyond structural basics.\n"}, {"path": "07-shelter-construction/basic-masonry-earthbuilding.md", "title": "Basic Masonry Earthbuilding", "group": null, "content": "# Basic Masonry & Earthbuilding\n\nStarter overview for building with stone, earth, and clay \u2014 durable, often fire-resistant, and usable with locally available materials in many regions.\n\n## Cob (clay, sand, straw, water)\n- A mix of clay-rich subsoil, sand, straw (or other fiber), and water, built up by hand in layers without forms.\n- Basic soil test: a jar test (mix soil with water in a clear jar, let settle) roughly separates sand/silt/clay layers by particle size and weight, giving a rough sense of your soil's clay content before building.\n- Good thermal mass (moderates indoor temperature swings), no specialized tools required, but slow to build and needs a dry climate or good roof overhang to avoid erosion.\n\n## Adobe (sun-dried mud brick)\n- Similar mix to cob (clay, sand, straw) but formed into bricks in molds and sun-dried before use, rather than built up wet in place.\n- Faster wall construction once bricks are made (bricks can be pre-made in batches), traditional in arid/semi-arid climates worldwide.\n- Same erosion vulnerability as cob \u2014 needs a roof overhang and/or a protective render (plaster) for longevity, especially in any rain.\n\n## Rammed earth\n- Damp subsoil (a specific moisture/clay ratio, not the same as cob) compacted in layers within a temporary formwork, producing a dense, wall-like monolithic structure.\n- Requires more equipment (formwork, a tamper) than cob but produces a notably strong, dense wall.\n\n## Stone masonry (dry-stack vs. mortared)\n- **Dry-stack**: stones fitted together using gravity and shape alone, no mortar \u2014 requires more skill in stone selection/fitting, very durable, traditional in many regions for field walls and foundations.\n- **Mortared**: stones bonded with a mortar (traditionally lime-based, or clay-based in some traditions) \u2014 allows less-perfectly-shaped stones to be used, generally faster for a beginner.\n\n## General principles\n- A stone or masonry foundation under a wood/earth structure meaningfully reduces moisture wicking into the main structure \u2014 worth prioritizing even in an otherwise wood-framed building.\n- Fire resistance is a major advantage of masonry/earth construction over wood-only structures, relevant for cooking-fire-adjacent structures specifically.\n\n## Needs deeper research\nLime mortar production from scratch (burning limestone), detailed cob/adobe mix ratios by regional soil type, structural limits (roof span, wall height) for each method.\n"}, {"path": "07-shelter-construction/emergency-shelter-basics.md", "title": "Emergency Shelter Basics", "group": null, "content": "# Emergency Shelter \u2014 Basics\n\nExpands on `01-quick-reference/fire-shelter-signal.md` with more construction detail.\n\n## Core principles (apply regardless of shelter type)\n1. **Insulate from the ground first** \u2014 you lose heat fastest downward through contact/conduction, not to the air. A thick layer of dry debris, branches, or a sleeping pad matters more than an elaborate roof.\n2. **Size to your body** \u2014 a shelter just big enough to lie in traps body heat far more effectively than a larger one.\n3. **Site selection** \u2014 avoid dead standing trees/branches overhead (\"widowmakers\"), low ground prone to flash flooding or cold air pooling, exposed ridgelines, and animal trails/nests.\n4. **Layer for the actual threat** \u2014 wind protection, rain protection, and ground insulation are three separate problems; identify which is most urgent for your specific conditions before building.\n\n## Common shelter types\n- **Debris hut**: a ridge pole leaned against a support (tree, rock), with ribbing sticks leaned against both sides, covered in a thick (12in+/30cm+) layer of leaves/debris for insulation. Effective in forested temperate climates with available leaf litter.\n- **Lean-to**: a single angled wall/roof against the prevailing wind direction, open on the leeward side, often paired with a reflecting fire on the open side. Faster to build than a debris hut, less insulating.\n- **Snow shelter (quinzhee/snow cave)**: dug into a snow drift or mounded and hollowed snow; walls should stay 12in+/30cm+ thick for insulation, and a ventilation hole is essential \u2014 carbon dioxide buildup/suffocation is a real risk in a sealed snow shelter.\n- **Tarp/poncho shelter**: fastest to deploy with prepared materials; various configurations (A-frame, lean-to) depending on wind direction and available anchor points.\n\n## Longer-term/semi-permanent shelter considerations\n- Once past the immediate emergency, shift toward `basic-carpentry-joinery.md` and `basic-masonry-earthbuilding.md` for structures meant to last \u2014 emergency shelters are not built for durability.\n- Fire safety: any enclosed structure with an internal fire needs deliberate ventilation planning (carbon monoxide risk) \u2014 don't seal a heated shelter completely.\n\n## Needs deeper research\nRegion-specific/climate-specific shelter designs (desert shade shelters, tropical elevated structures, arctic snow structures in more depth), detailed material lists and build sequences with diagrams.\n"}, {"path": "07-shelter-construction/sanitation-infrastructure-basics.md", "title": "Sanitation Infrastructure Basics", "group": null, "content": "# Sanitation Infrastructure \u2014 Construction Basics\n\nConstruction-focused companion to `02-first-aid-medical/sanitation-hygiene.md`, which covers the health rationale and usage practices.\n\n## Pit latrine construction\n- Dig at least 30m/100ft from any water source, downhill/downstream of it, and away from the foundation of any structure (undermining risk to nearby buildings if dug too close).\n- Depth: 1.5-3m/5-10ft depending on expected use duration and household size \u2014 deeper for longer-term or higher-use installations.\n- Lining the pit (with brick, stone, or other durable material) prevents collapse, especially in loose/sandy soil \u2014 an unlined pit in unstable soil is a real safety hazard, not just a durability issue.\n- A simple platform/slab over the pit with a properly sized opening, plus a fitted cover/lid, reduces odor, fly access, and accident risk.\n- A vent pipe from the pit to above roof height, screened at the top, meaningfully reduces both odor and flies inside an enclosed latrine structure (this is the core idea behind a \"VIP\" \u2014 ventilated improved pit \u2014 latrine, a widely used low-cost design).\n\n## Composting toilet basics\n- Separates solid waste for aerobic decomposition (with a carbon-rich cover material like sawdust or ash added after each use) rather than pit disposal \u2014 produces usable compost over time and avoids groundwater contamination risk entirely, useful where a dug pit isn't practical (high water table, rocky ground).\n- Requires more active management (turning/monitoring the compost, ensuring adequate carbon material) than a simple pit latrine.\n\n## Greywater management\n- Greywater (from washing, not toilet waste) can often be directed to a simple gravel-filled soak pit or used for non-food-crop irrigation rather than being wasted or allowed to pool.\n- Avoid greywater containing harsh chemicals (strong soaps/detergents in quantity) if it will be used for irrigation.\n\n## General siting principle\nAny sanitation infrastructure should be positioned with prevailing wind direction in mind relative to living/cooking areas, in addition to the water-source distance rule above.\n\n## Needs deeper research\nDetailed VIP latrine construction dimensions, composting toilet management schedules, greywater filtration system design.\n"}, {"path": "07-shelter-construction/structural-basics.md", "title": "Structural Basics", "group": null, "content": "# Structural Basics\n\nFundamental concepts for building something that stays standing and doesn't collapse on its occupants.\n\n## Load paths \u2014 the core concept\nEvery structure needs a continuous path for weight (the structure's own weight, plus anything on/in it \u2014 people, snow load, wind) to travel from where it's applied down to the ground. A structural failure is usually a break somewhere in that path: a beam spanning too far without support, a wall opening (door/window) that removes support without compensating for it elsewhere, a foundation that can't bear the load above it.\n\n## Foundations\n- Purpose: spread the structure's weight over enough ground area that the soil can support it without sinking/shifting, and to keep the structure's wood/earth components away from ground moisture.\n- Even a simple raised foundation (stone footings, or a wood structure raised on posts/piers) meaningfully extends a structure's life by reducing ground-moisture contact with load-bearing wood.\n- Frost heave (soil expansion from freezing groundwater) is a real risk in cold climates \u2014 a foundation resting above the frost line can be pushed unevenly, cracking the structure above it; footings dug below the local frost depth avoid this.\n\n## Roofing basics\n- A roof needs adequate pitch (slope) to shed water/snow effectively \u2014 pitch requirements vary by roofing material and climate (heavy snow load areas generally need steeper pitches than the minimum needed just for rain).\n- Roof overhangs protect walls (especially earth/masonry walls, per `basic-masonry-earthbuilding.md`) from rain erosion \u2014 a wider overhang is cheap insurance for wall longevity.\n- Snow load: flat or low-pitch roofs in snow-prone regions need to be engineered/braced for significant accumulated weight, or actively cleared \u2014 this is a genuine collapse risk if underestimated.\n\n## Openings (doors/windows)\n- Removing material from a wall for an opening removes load-bearing capacity at that point \u2014 a header (a stronger beam spanning above the opening) is needed to redirect the load around the opening rather than through it.\n\n## General safety principle\nWhen in doubt about a structure's load capacity, over-build rather than under-build \u2014 the cost of extra material is almost always lower than the cost of a structural failure, especially for anything people will sleep under or spend significant time in.\n\n## Needs deeper research\nSpecific span tables (how far a beam of a given size/material can safely span), wind/seismic bracing basics, foundation engineering detail by soil type.\n"}]}, {"id": "08", "label": "08 \u00b7 Energy & Power", "files": [{"path": "08-energy-power/README.md", "title": "README", "group": null, "content": "# 08 \u2014 Energy & Power\n\n## Contents\n- [x] `off-grid-electrical-basics.md` \u2014 solar system chain, wiring safety, basic wind power\n- [x] `battery-storage-basics.md` \u2014 lead-acid vs. lithium, care principles, non-electrical storage\n- [x] `mechanical-power-basics.md` \u2014 water/wind/animal power without an electrical step\n- [x] `fuels-basics.md` \u2014 wood, charcoal, biogas, biodiesel, safety/storage\n\n## Still to build\n- Detailed system sizing worksheets and wiring diagrams\n- Small hydro power in depth\n- Charcoal kiln, biogas digester, and biodiesel production process detail\n"}, {"path": "08-energy-power/battery-storage-basics.md", "title": "Battery Storage Basics", "group": null, "content": "# Battery Storage Basics\n\n## Why storage matters\nMost renewable sources (solar, wind) are intermittent \u2014 storage bridges the gap between generation and when power is actually needed (night, calm periods), and smooths out variable output.\n\n## Common battery types for off-grid use\n- **Lead-acid (flooded)**: cheapest upfront, well-understood technology, but needs regular maintenance (checking/topping electrolyte fluid), ventilation (hydrogen gas during charging), and shouldn't be discharged below roughly 50% regularly without shortening lifespan significantly.\n- **Sealed lead-acid (AGM/gel)**: no maintenance/topping needed, safer for enclosed spaces, generally more expensive than flooded, still has a discharge-depth lifespan tradeoff similar to flooded lead-acid.\n- **Lithium (LiFePO4 common for off-grid)**: significantly longer lifespan and more usable capacity (can be discharged much deeper without damage) than lead-acid, but higher upfront cost; increasingly the preferred choice for new off-grid systems where budget allows.\n\n## Basic care principles (apply broadly across types)\n- Avoid deep discharge below the manufacturer's recommended threshold \u2014 this is one of the most damaging things you can do to most battery chemistries.\n- Avoid extreme temperature exposure \u2014 both charging and capacity are affected by heat and cold; very cold conditions in particular reduce usable capacity temporarily.\n- Keep terminals clean and connections tight \u2014 corrosion/loose connections cause resistance, heat, and power loss.\n- Match your charge controller/charging source to the specific battery chemistry \u2014 charging profiles (voltage curves) differ between lead-acid and lithium, and using the wrong profile damages the battery or reduces its lifespan.\n\n## Simple non-electrical energy storage worth knowing\n- **Thermal mass** (masonry, water) stores heat energy directly \u2014 a well-designed structure using thermal mass (see `07-shelter-construction/basic-masonry-earthbuilding.md`) reduces the energy needed for heating/cooling in the first place, which is often more efficient than storing electricity to run heating/cooling equipment.\n- **Pumped water storage** (pumping water uphill when power is available, running it through a small turbine when needed) is a legitimate but infrastructure-heavy storage method, more relevant at a community scale than an individual household.\n\n## Needs deeper research\nDetailed battery bank sizing/wiring (series vs. parallel configurations), specific charge controller settings by battery chemistry, battery reconditioning/troubleshooting.\n"}, {"path": "08-energy-power/fuels-basics.md", "title": "Fuels Basics", "group": null, "content": "# Fuels Basics\n\n## Wood\n- The most universally accessible fuel in forested regions; seasoning (drying, typically 6-12+ months depending on species/climate) significantly improves burn efficiency and reduces smoke/creosote buildup versus burning green wood.\n- Different species burn differently \u2014 generally, denser hardwoods burn longer and hotter than softer woods, which tend to burn faster and can produce more resin/creosote buildup in enclosed stoves/chimneys.\n\n## Charcoal\n- Produced by heating wood in a low-oxygen environment (pyrolysis) rather than burning it fully \u2014 burns hotter and cleaner than raw wood, useful for cooking and some craft/metalworking applications.\n- Basic production method: a controlled, mostly-sealed burn (traditional earth mound or metal container methods both work) that lets wood smolder rather than fully combust, driving off volatile compounds and leaving carbon-rich charcoal behind.\n\n## Biogas\n- Produced by anaerobic digestion (bacterial breakdown without oxygen) of organic waste (manure, food scraps, other biodegradable material) in a sealed digester, producing mostly methane \u2014 usable for cooking or heating with appropriate burners.\n- Requires a sealed digester vessel and a consistent supply of organic feedstock; more infrastructure-intensive to set up than wood/charcoal but turns waste into usable fuel and produces a nutrient-rich byproduct usable as fertilizer.\n\n## Biodiesel\n- Produced from vegetable oil (fresh or used) through a chemical process (transesterification, using a catalyst like lye and an alcohol like methanol) that converts the oil into a diesel-compatible fuel.\n- Requires more chemical process knowledge and specific ingredients than the other fuels here \u2014 see `10-chemistry-materials/` as that folder develops for the underlying chemistry.\n- Caustic chemicals involved (lye) require the same safety handling as in `05-plants-fungi`-adjacent... actually see general chemical safety principles once `10-chemistry-materials/` is built out \u2014 treat with real caution, not casual DIY handling.\n\n## General fuel safety and storage\n- Store fuel away from living/sleeping areas where practical, particularly anything flammable/combustible in quantity.\n- Any enclosed-space fuel combustion (heating, cooking) needs deliberate ventilation planning \u2014 carbon monoxide poisoning from unventilated combustion is a real and serious risk, not a minor concern.\n- Rotate stored fuel where it degrades over time (some liquid fuels degrade/gum up after extended storage) \u2014 know the shelf life of whatever fuel you're relying on.\n\n## Needs deeper research\nDetailed charcoal kiln/retort designs, biogas digester construction and sizing, biodiesel production process and safety in full detail.\n"}, {"path": "08-energy-power/mechanical-power-basics.md", "title": "Mechanical Power Basics", "group": null, "content": "# Mechanical Power Basics\n\nPower that doesn't route through electricity at all \u2014 often simpler to build and maintain than an electrical system, and worth knowing as a direct-use alternative (e.g. a water wheel directly turning a grinding stone, rather than generating electricity to run an electric grinder).\n\n## Water power\n- A **water wheel** (various designs \u2014 overshot, undershot, breastshot, differing in how water contacts the wheel) converts flowing/falling water directly into rotational mechanical power; works well for tasks like grinding grain or powering simple machinery directly via a shaft/gear connection.\n- Site requirements: reliable water flow (volume) and/or fall height (head) \u2014 the specific wheel design should match what your site actually offers (a low-flow, high-head site favors different designs than a high-flow, low-head site).\n- Can also drive a generator for electrical output (small hydro) rather than direct mechanical use \u2014 see `off-grid-electrical-basics.md`.\n\n## Wind power (mechanical, not electrical)\n- Traditional windmills convert wind directly to mechanical power (grinding, water pumping) without an electrical conversion step \u2014 often simpler and more robust than a wind turbine generator for a specific fixed task.\n- Same siting consideration as electrical wind power: consistent average wind speed matters more than occasional strong gusts.\n\n## Animal and human power\n- A treadmill/treadwheel or a rotating harness setup can convert animal (or human) motion into rotational power for grinding, pumping, or other mechanical tasks \u2014 low-tech, doesn't depend on any fuel or weather condition, but limited in sustained power output and requires the animal/person's ongoing physical effort.\n- Simple mechanical advantage tools (levers, pulleys, gear trains) can multiply human effort significantly for tasks like lifting or pumping water, worth understanding as a baseline even before considering powered alternatives.\n\n## General principle\nBefore building an electrical system for a specific task (grinding grain, pumping water), consider whether a direct mechanical solution accomplishes the same task with less complexity and fewer failure points \u2014 electrical conversion adds efficiency losses and additional components that can fail.\n\n## Needs deeper research\nDetailed water wheel/windmill design and construction, gear ratio calculations, specific mechanical advantage tool-building instructions.\n"}, {"path": "08-energy-power/off-grid-electrical-basics.md", "title": "Off Grid Electrical Basics", "group": null, "content": "# Off-Grid Electrical Basics\n\n## Solar power fundamentals\n- **Panel \u2192 charge controller \u2192 battery \u2192 inverter (if AC needed)** is the standard basic system chain. The charge controller prevents overcharging the battery; the inverter converts stored DC power to AC for standard household devices, if needed (many devices can also run directly on DC, avoiding inverter losses).\n- Panel output is rated in watts under ideal conditions \u2014 real-world output varies with sun angle, cloud cover, panel temperature, and dust/dirt accumulation; plan for meaningfully less than the rated output on average.\n- System sizing starts from your actual power needs (add up device wattage \u00d7 hours used per day) rather than from an arbitrary panel size \u2014 oversizing wastes money, undersizing leaves you short.\n\n## Basic wiring safety\n- Match wire gauge to the current (amperage) it will carry \u2014 undersized wire overheats and is a fire risk; this matters more than most people expect, especially over longer wire runs.\n- Fuses/breakers sized appropriately for the circuit protect against overcurrent \u2014 don't bypass or oversize a fuse \"to stop it tripping,\" that removes the safety margin it exists for.\n- Batteries (especially lead-acid) can produce explosive hydrogen gas while charging \u2014 ventilate battery storage/charging areas, keep open flame and sparks away.\n- Always treat any circuit as live until confirmed otherwise with a meter, not by assumption.\n\n## Small-scale wind power\n- Effective mainly in consistently windy sites \u2014 average wind speed matters far more than peak gusts for realistic power output.\n- Requires a sturdy tower/mount given the forces involved in wind \u2014 a poorly mounted turbine is both an underperformer and a hazard.\n\n## Basic system components worth understanding\n- **Charge controller types**: PWM (simpler, cheaper) vs. MPPT (more efficient, especially with larger arrays or cooler climates) \u2014 MPPT is generally worth the added cost for anything beyond a small system.\n- **Battery types**: lead-acid (cheaper, shorter lifespan, needs ventilation) vs. lithium (more expensive, longer lifespan, more forgiving of partial discharge) \u2014 either can work for an off-grid system, the choice depends on budget and maintenance tolerance.\n\n## Needs deeper research\nDetailed system sizing calculations/worksheets, specific wiring diagrams, small hydro power basics, generator maintenance and safe operation.\n"}]}, {"id": "09", "label": "09 \u00b7 Tools & Manufacturing", "files": [{"path": "09-tools-manufacturing/README.md", "title": "README", "group": null, "content": "# 09 \u2014 Tools & Manufacturing\n\n## Contents\n- [x] `blacksmithing-basics.md` \u2014 minimum viable forge setup, core process concepts, heat treatment\n- [x] `woodworking-toolmaking-basics.md` \u2014 hand tool priorities, handle-making, basic carved items\n- [x] `general-repair-principles.md` \u2014 diagnostic approach, mechanical/electrical repair, preventive maintenance\n- [x] `textiles-leatherwork-basics.md` \u2014 fiber sources, spinning/weaving chain, tanning basics\n\n## Still to build\n- Tool-specific forging sequences with detail (knife, axe, hoe)\n- Natural adhesive recipes\n- Detailed tanning process by method\n- iFixit-style general repair guides once the Kiwix pack is loaded (see `scripts/download-kiwix.sh`)\n"}, {"path": "09-tools-manufacturing/blacksmithing-basics.md", "title": "Blacksmithing Basics", "group": null, "content": "# Blacksmithing Basics\n\nWorking iron/steel by heating and shaping \u2014 the foundation of most other tool-making in a rebuilding scenario, since blacksmithing is how you make and repair the tools everything else depends on.\n\n## Minimum viable setup\n- **Forge**: a source of concentrated, sustained high heat \u2014 a simple coal/charcoal forge with a forced air supply (bellows or blower) reaches the temperatures needed for most blacksmithing work. Charcoal (see `08-energy-power/fuels-basics.md`) is a workable fuel where mineral coal isn't available.\n- **Anvil**: a heavy, hard, flat-ish steel surface to work metal against \u2014 a large chunk of steel (even an improvised one, like a length of railroad rail) can substitute for a purpose-built anvil.\n- **Hammer(s)**: at minimum one general-purpose forging hammer.\n- **Tongs**: to hold hot metal safely \u2014 improvised tongs can be forged as an early, foundational project.\n- **Quench container**: water or oil, for controlling cooling rate during heat treatment.\n\n## Core process concepts\n- **Heating to workable temperature**: steel becomes workable (malleable enough to shape by hammering) at high heat, indicated traditionally by color (dull red through orange to yellow as temperature increases) \u2014 color-based temperature judgment is a real, widely used skill, though it takes practice to calibrate.\n- **Drawing out**: hammering to lengthen and thin a piece of metal.\n- **Upsetting**: hammering to shorten and thicken a piece (the reverse of drawing out).\n- **Bending, punching, splitting**: shaping techniques for specific forms (hooks, holes, forks/tines).\n- **Heat treatment (hardening and tempering)**: heating steel to a specific temperature and then rapidly cooling (quenching) hardens it, but also makes it brittle; a subsequent tempering step (reheating to a lower temperature) reduces brittleness while retaining most of the hardness \u2014 both steps matter for a durable tool edge, skipping tempering produces a tool that chips/cracks easily.\n\n## Safety\n- Burns are the most common injury \u2014 treat every piece of metal near or in the forge as hot until proven otherwise.\n- Eye protection matters, especially when hammering (scale/sparks fly off the workpiece).\n- Ventilation matters for any enclosed forge space \u2014 combustion byproducts accumulate.\n\n## Needs deeper research\nSpecific heat-treatment temperatures/timing by steel type, welding techniques (forge welding), tool-specific forging sequences (knife, axe, hoe, nails), and where to source/identify usable scrap steel.\n"}, {"path": "09-tools-manufacturing/general-repair-principles.md", "title": "General Repair Principles", "group": null, "content": "# General Repair Principles\n\nA repair mindset \u2014 applicable across mechanical, electrical, and general equipment \u2014 rather than device-specific instructions (which age quickly and vary too much to generalize).\n\n## Diagnostic approach\n1. **Confirm the actual symptom before assuming a cause** \u2014 don't skip straight to a fix based on a guess; observe what's actually happening first.\n2. **Check the simple/common causes before the complex/rare ones** \u2014 a dead battery is far more likely than a failed circuit board; a loose connection is far more likely than a component failure.\n3. **Isolate the problem** \u2014 test/inspect one component or connection point at a time rather than replacing multiple things at once, so you actually learn what was wrong (important when parts are scarce and you can't afford to guess wrong repeatedly).\n4. **Compare to a known-working reference** when possible \u2014 a working example of the same item, or documentation, tells you what \"normal\" looks like.\n\n## General mechanical repair\n- Most mechanical failures trace back to one of a few common categories: wear (parts degrading with use), lubrication failure (friction/heat damage from inadequate lubrication), fastener failure (loose/broken/corroded fasteners), or contamination (dirt/debris interfering with moving parts).\n- Cleaning and proper lubrication resolve a surprising fraction of \"broken\" mechanical equipment \u2014 check these before assuming a part needs replacement.\n- Keep failed/worn parts as patterns for fabricating replacements, and as a source of raw material \u2014 see `09-tools-manufacturing/` blacksmithing and woodworking files for fabrication.\n\n## General electrical repair\n- Most electrical failures trace back to: a blown fuse/breaker (protective device doing its job \u2014 find and fix the underlying overcurrent cause before just replacing the fuse), a loose/corroded connection, or a failed component.\n- A multimeter (measuring voltage, resistance/continuity, and current) is the single most valuable diagnostic tool for electrical work \u2014 learning to use one is a high-value skill.\n- Always treat a circuit as live until confirmed otherwise \u2014 see `08-energy-power/off-grid-electrical-basics.md` for wiring safety principles.\n\n## Fastener and adhesive basics\n- Learn to identify and improvise common fastener types (threads, pins, wedges) since manufactured replacement parts won't always be available \u2014 a well-fitted wooden peg or forged pin can substitute for a manufactured bolt in many applications.\n- Natural adhesives (hide glue from animal collagen, pine pitch/resin-based glues) are traditional, functional options when manufactured adhesives aren't available \u2014 worth knowing as a category even before detailed recipes are added.\n\n## Preventive maintenance mindset\nRegular inspection and minor maintenance (cleaning, lubrication, tightening) prevents most major failures \u2014 in a context where replacement parts/tools are scarce, prevention is disproportionately more valuable than in normal times where replacement is easy.\n\n## Needs deeper research\nNatural adhesive recipes and application, detailed multimeter usage guide, common failure patterns for specific equipment categories (pumps, engines, hand tools).\n"}, {"path": "09-tools-manufacturing/textiles-leatherwork-basics.md", "title": "Textiles Leatherwork Basics", "group": null, "content": "# Textiles & Leatherwork Basics\n\n## Fiber sources\n- **Animal**: wool (sheep, goat, alpaca and relatives), silk (from silkworm cocoons, more infrastructure-intensive to produce), various hair/fur fibers.\n- **Plant**: cotton, flax (linen), hemp, and various other regional fiber plants \u2014 each has a different processing sequence to go from raw plant material to spinnable fiber.\n- Fiber choice affects warmth (wool retains insulating properties even when damp, a genuinely useful cold-weather property that cotton lacks), durability, and processing complexity.\n\n## Basic textile process chain\n1. **Harvesting/shearing** the raw fiber material.\n2. **Cleaning/processing** \u2014 removing debris, oils (in wool, this is scouring), or plant matter (retting, for plant fibers like flax, which involves controlled rotting to separate fiber from the woody stem).\n3. **Carding/combing** \u2014 aligning fibers in preparation for spinning.\n4. **Spinning** \u2014 twisting fibers into continuous thread/yarn, traditionally with a drop spindle (simple, portable, low-tech) or a spinning wheel (faster, more equipment-intensive).\n5. **Weaving or knitting** \u2014 turning thread/yarn into fabric. A simple frame loom is a viable starting point for weaving without complex equipment.\n\n## Basic mending and repair\n- Hand-sewing (running stitch, backstitch, whip stitch) covers most repair needs without a machine.\n- Darning (a woven patch technique for holes, especially in knitted fabric) extends the life of worn clothing significantly.\n- Keep worn-out textiles as a raw material source (patches, stuffing, rags) rather than discarding \u2014 nothing goes to waste when replacement fabric is hard to come by.\n\n## Leatherworking basics\n- **Tanning** converts raw animal hide (which will rot) into stable, usable leather \u2014 traditional methods include vegetable tanning (using tannin-rich plant material, notably tree bark from certain species) and brain tanning (a traditional indigenous method using the animal's own brain tissue, which contains suitable fats/oils) \u2014 both are genuine, functional processes, though real detail on either requires more specific instruction than fits here.\n- Basic leatherworking tools: an awl (for punching stitch holes), a sharp knife, and waxed thread cover most repair and basic construction needs (footwear repair, straps, containers).\n- Leather is disproportionately valuable for durable, repairable items (footwear, tool sheaths, straps/harnesses) given how labor-intensive it is to produce from scratch \u2014 prioritize accordingly.\n\n## Needs deeper research\nDetailed tanning process and timing by method, spinning wheel/loom construction, dye sources (plant-based dyes by region), footwear construction.\n"}, {"path": "09-tools-manufacturing/woodworking-toolmaking-basics.md", "title": "Woodworking Toolmaking Basics", "group": null, "content": "# Woodworking & Tool-Making Basics\n\nComplements `07-shelter-construction/basic-carpentry-joinery.md` (structural focus) with a tool- and craft-making focus.\n\n## Hand tools worth prioritizing (in rough order of general usefulness)\n1. **Axe** \u2014 felling, splitting, rough shaping; arguably the single most versatile wood tool.\n2. **Knife** \u2014 general-purpose cutting, carving, fine work.\n3. **Saw** \u2014 controlled, precise cuts that an axe can't achieve.\n4. **Chisels** \u2014 precise material removal, joinery work.\n5. **Drawknife** \u2014 efficient shaping of round/curved stock (tool handles, spokes, bows).\n6. **Hand drill/auger** \u2014 holes for pegs, joinery.\n\n## Tool handle making\n- A well-fitted handle (haft) is as important as the tool head itself \u2014 a loose or poorly shaped handle is both inefficient and dangerous (risk of the head flying off during use).\n- Straight-grained wood, selected so the grain runs parallel to the length of the handle (not diagonally across it), resists breaking under stress far better than a handle cut without attention to grain direction.\n- A wedge (wood or metal) driven into a slot at the top of the handle, inside the tool head's eye, is the traditional method for locking a handle in place permanently.\n\n## Basic carved/shaped items worth knowing as building-block skills\n- **Wooden pegs/dowels** \u2014 for joinery (see `basic-carpentry-joinery.md`).\n- **Wedges** \u2014 for splitting wood, tool handle locking, and other mechanical-advantage uses.\n- **Spoons and basic containers** \u2014 foundational carving practice that transfers directly to more complex shaping tasks.\n- **Wooden gears/mechanical parts** \u2014 for simple machinery (see `08-energy-power/mechanical-power-basics.md`), a more advanced application of the same shaping skills.\n\n## Wood selection\n- See `07-shelter-construction/basic-carpentry-joinery.md` for general wood property notes \u2014 the same rot-resistance and grain principles apply to tool-making, with an added emphasis on shock resistance (a tool handle needs to absorb repeated impact without cracking, a property that varies significantly by species).\n\n## Needs deeper research\nSpecies-specific wood selection for tool handles by region, steam-bending technique, wooden gear-cutting detail, traditional joinery for furniture-grade work.\n"}]}, {"id": "10", "label": "10 \u00b7 Chemistry & Materials", "files": [{"path": "10-chemistry-materials/README.md", "title": "README", "group": null, "content": "# 10 \u2014 Chemistry & Materials\n\n## Contents\n- [x] `basic-chemistry-reference.md` \u2014 core concepts (elements/compounds, pH, oxidation, solutions), lab safety principles\n- [x] `soap-and-cleaning-agents.md` \u2014 saponification chemistry and process, lye safety, alternative cleaning agents\n- [x] `fuels-combustion-basics.md` \u2014 combustion chemistry, complete vs. incomplete combustion, fire triangle\n- [x] `metallurgy-basics.md` \u2014 iron/steel/cast iron distinctions, heat treatment chemistry, corrosion, other metals\n\n## Still to build\n- Periodic table / element reference relevant to materials work\n- Detailed reaction ratios and recipes (soap, biodiesel)\n- Ore identification and smelting basics\n- Glass and ceramics (not yet started)\n"}, {"path": "10-chemistry-materials/basic-chemistry-reference.md", "title": "Basic Chemistry Reference", "group": null, "content": "# Basic Chemistry Reference\n\nFoundational concepts referenced throughout the archive (soap-making, fuels, materials, medicine preparation). Not a full chemistry course \u2014 see `12-science-education/` for that once built out.\n\n## Core concepts\n- **Elements, compounds, mixtures**: elements are pure substances that can't be broken down further chemically; compounds are two or more elements chemically bonded (fixed ratio, new properties); mixtures are physically combined substances that retain their individual properties and can often be separated by physical means (filtering, evaporation, etc.).\n- **Acids and bases (pH)**: pH measures how acidic or basic (alkaline) a solution is, on a roughly 0-14 scale, 7 being neutral. Acids (low pH) and bases (high pH) react with and can neutralize each other. Practical relevance: soap-making (`soap-and-cleaning-agents.md`) is fundamentally an acid-base-type reaction (saponification); many food preservation and cleaning applications depend on pH.\n- **Oxidation and combustion**: burning is a rapid oxidation reaction (combining with oxygen, releasing energy as heat/light) \u2014 relevant to every fuel discussion in `08-energy-power/`. Slower oxidation (like rusting metal) is the same basic chemistry at a much slower rate.\n- **Solutions and concentration**: how much of a substance is dissolved in another (e.g. salt in water) \u2014 relevant to water purification dosing (`01-quick-reference/water-purification-quicksteps.md`), medicine dosing caution (`05-plants-fungi/medicinal-plants-general-principles.md`),
