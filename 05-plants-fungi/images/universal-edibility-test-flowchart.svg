<svg viewBox="0 0 520 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Universal Edibility Test — procedural flowchart, last resort only, never for fungi</title>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a" stroke="none"/>
    </marker>
  </defs>

  <!-- top banner -->
  <rect x="40" y="10" width="440" height="40" rx="4" fill="#1a1a1a" fill-opacity="0.06"/>
  <text x="260" y="35" text-anchor="middle" font-size="14" font-weight="700" stroke="none" fill="#1a1a1a">LAST RESORT ONLY — NEVER FOR MUSHROOMS</text>

  <!-- step boxes -->
  <g font-size="13" stroke="none" fill="#1a1a1a">
    <!-- 1 -->
    <rect x="140" y="70" width="240" height="46" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="90" text-anchor="middle" font-weight="700">1. Separate into parts</text>
    <text x="260" y="106" text-anchor="middle" font-size="11">test one part at a time</text>

    <!-- 2 -->
    <rect x="140" y="146" width="240" height="46" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="166" text-anchor="middle" font-weight="700">2. Smell test</text>
    <text x="260" y="182" text-anchor="middle" font-size="11">strong/acrid odor → stop</text>

    <!-- 3 -->
    <rect x="140" y="222" width="240" height="46" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="242" text-anchor="middle" font-weight="700">3. Skin contact — 15 min</text>
    <text x="260" y="258" text-anchor="middle" font-size="11">inner wrist/elbow</text>

    <!-- 4 -->
    <rect x="140" y="298" width="240" height="46" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="318" text-anchor="middle" font-weight="700">4. Lip test — 3 min</text>

    <!-- 5 -->
    <rect x="140" y="374" width="240" height="46" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="394" text-anchor="middle" font-weight="700">5. Tongue test — 15 min</text>
    <text x="260" y="410" text-anchor="middle" font-size="11">do not swallow</text>

    <!-- 6 -->
    <rect x="140" y="450" width="240" height="46" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="470" text-anchor="middle" font-weight="700">6. Chew test — 15 min</text>
    <text x="260" y="486" text-anchor="middle" font-size="11">spit out, do not swallow</text>

    <!-- 7 -->
    <rect x="140" y="526" width="240" height="52" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="546" text-anchor="middle" font-weight="700">7. Swallow a small piece</text>
    <text x="260" y="562" text-anchor="middle" font-size="11">wait 8 hours, eat nothing else</text>

    <!-- 8 -->
    <rect x="140" y="608" width="240" height="52" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="628" text-anchor="middle" font-weight="700">8. Eat ~1/4 cup</text>
    <text x="260" y="644" text-anchor="middle" font-size="11">wait another 8 hours</text>

    <!-- 9 -->
    <rect x="120" y="690" width="280" height="58" rx="6" fill="#1a1a1a" fill-opacity="0.06" stroke="#1a1a1a" stroke-width="2"/>
    <text x="260" y="712" text-anchor="middle" font-weight="700">9. Acceptable in moderation</text>
    <text x="260" y="728" text-anchor="middle" font-size="11">no protection from delayed-onset toxins</text>

    <!-- STOP box, off to the right, shared by every step -->
    <rect x="420" y="360" width="90" height="280" rx="8" fill="#1a1a1a" fill-opacity="0.08" stroke="#1a1a1a" stroke-width="2"/>
    <text x="465" y="500" text-anchor="middle" font-weight="700" transform="rotate(-90 465 500)">ANY REACTION → STOP, DISCARD THIS PART</text>
  </g>

  <!-- vertical connector arrows -->
  <g stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="260" y1="116" x2="260" y2="144"/>
    <line x1="260" y1="192" x2="260" y2="220"/>
    <line x1="260" y1="268" x2="260" y2="296"/>
    <line x1="260" y1="344" x2="260" y2="372"/>
    <line x1="260" y1="420" x2="260" y2="448"/>
    <line x1="260" y1="496" x2="260" y2="524"/>
    <line x1="260" y1="578" x2="260" y2="606"/>
    <line x1="260" y1="660" x2="260" y2="688"/>
  </g>

  <!-- side branches to STOP box from steps 3-8 -->
  <g stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)">
    <line x1="380" y1="245" x2="418" y2="380"/>
    <line x1="380" y1="321" x2="418" y2="400"/>
    <line x1="380" y1="397" x2="418" y2="420"/>
    <line x1="380" y1="473" x2="418" y2="460"/>
    <line x1="380" y1="552" x2="418" y2="500"/>
    <line x1="380" y1="634" x2="418" y2="560"/>
  </g>

  <!-- bottom note -->
  <text x="260" y="775" text-anchor="middle" font-size="12" font-style="italic" fill="#1a1a1a" stroke="none">Full text, red-flag exclusions, and limitations: universal-edibility-test.md</text>
</svg>
