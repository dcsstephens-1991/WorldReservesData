<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <title>Umbrella-shaped flower cluster (umbel) — carrot/parsley family shape shared by edible and deadly species</title>

  <!-- stem -->
  <line x1="240" y1="300" x2="240" y2="160" stroke-width="3"/>

  <!-- umbel: radiating spokes from one point, each ending in a small flower cluster (compound umbel) -->
  <g stroke-width="1.6">
    <line x1="240" y1="160" x2="140" y2="90"/>
    <line x1="240" y1="160" x2="175" y2="80"/>
    <line x1="240" y1="160" x2="210" y2="72"/>
    <line x1="240" y1="160" x2="240" y2="68"/>
    <line x1="240" y1="160" x2="270" y2="72"/>
    <line x1="240" y1="160" x2="305" y2="80"/>
    <line x1="240" y1="160" x2="340" y2="90"/>
  </g>

  <!-- small secondary umbellets at each spoke tip -->
  <g stroke-width="1.2">
    <g transform="translate(140,90)"><line x1="0" y1="0" x2="-14" y2="-10"/><line x1="0" y1="0" x2="-4" y2="-16"/><line x1="0" y1="0" x2="8" y2="-14"/><circle cx="-14" cy="-10" r="2.5" fill="#1a1a1a"/><circle cx="-4" cy="-16" r="2.5" fill="#1a1a1a"/><circle cx="8" cy="-14" r="2.5" fill="#1a1a1a"/></g>
    <g transform="translate(175,80)"><line x1="0" y1="0" x2="-10" y2="-12"/><line x1="0" y1="0" x2="2" y2="-16"/><line x1="0" y1="0" x2="12" y2="-10"/><circle cx="-10" cy="-12" r="2.5" fill="#1a1a1a"/><circle cx="2" cy="-16" r="2.5" fill="#1a1a1a"/><circle cx="12" cy="-10" r="2.5" fill="#1a1a1a"/></g>
    <g transform="translate(210,72)"><line x1="0" y1="0" x2="-10" y2="-12"/><line x1="0" y1="0" x2="2" y2="-16"/><line x1="0" y1="0" x2="12" y2="-10"/><circle cx="-10" cy="-12" r="2.5" fill="#1a1a1a"/><circle cx="2" cy="-16" r="2.5" fill="#1a1a1a"/><circle cx="12" cy="-10" r="2.5" fill="#1a1a1a"/></g>
    <g transform="translate(240,68)"><line x1="0" y1="0" x2="-10" y2="-12"/><line x1="0" y1="0" x2="2" y2="-16"/><line x1="0" y1="0" x2="12" y2="-10"/><circle cx="-10" cy="-12" r="2.5" fill="#1a1a1a"/><circle cx="2" cy="-16" r="2.5" fill="#1a1a1a"/><circle cx="12" cy="-10" r="2.5" fill="#1a1a1a"/></g>
    <g transform="translate(270,72)"><line x1="0" y1="0" x2="-12" y2="-10"/><line x1="0" y1="0" x2="-2" y2="-16"/><line x1="0" y1="0" x2="10" y2="-12"/><circle cx="-12" cy="-10" r="2.5" fill="#1a1a1a"/><circle cx="-2" cy="-16" r="2.5" fill="#1a1a1a"/><circle cx="10" cy="-12" r="2.5" fill="#1a1a1a"/></g>
    <g transform="translate(305,80)"><line x1="0" y1="0" x2="-12" y2="-10"/><line x1="0" y1="0" x2="-2" y2="-16"/><line x1="0" y1="0" x2="10" y2="-12"/><circle cx="-12" cy="-10" r="2.5" fill="#1a1a1a"/><circle cx="-2" cy="-16" r="2.5" fill="#1a1a1a"/><circle cx="10" cy="-12" r="2.5" fill="#1a1a1a"/></g>
    <g transform="translate(340,90)"><line x1="0" y1="0" x2="-8" y2="-14"/><line x1="0" y1="0" x2="4" y2="-16"/><line x1="0" y1="0" x2="14" y2="-10"/><circle cx="-8" cy="-14" r="2.5" fill="#1a1a1a"/><circle cx="4" cy="-16" r="2.5" fill="#1a1a1a"/><circle cx="14" cy="-10" r="2.5" fill="#1a1a1a"/></g>
  </g>

  <!-- feathery leaves at base -->
  <path d="M240,300 C210,290 190,270 180,250 M240,300 C215,285 200,260 195,235 M240,290 C265,278 285,260 295,240 M240,290 C260,272 275,250 280,225" stroke-width="1.4"/>

  <!-- caution banner -->
  <rect x="30" y="20" width="420" height="34" rx="4" fill="#1a1a1a" fill-opacity="0.06" stroke-width="1.6"/>
  <text x="240" y="42" text-anchor="middle" font-size="14" font-weight="700" stroke="none" fill="#1a1a1a">"UMBEL" SHAPE — SHARED BY EDIBLE &amp; DEADLY SPECIES ALIKE</text>

  <text x="240" y="310" text-anchor="middle" font-size="12" font-style="italic" stroke="none" fill="#1a1a1a">Shape alone never confirms species — see toxic-plants-widely-confused.md</text>
</svg>
