<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Lean-to shelter — angled wall against prevailing wind, open leeward side, reflecting fire</title>

  <!-- ground -->
  <line x1="20" y1="260" x2="460" y2="260" stroke-width="1.6"/>

  <!-- two upright supports -->
  <line x1="120" y1="260" x2="120" y2="130" stroke-width="4"/>
  <line x1="340" y1="260" x2="340" y2="130" stroke-width="4"/>
  <!-- horizontal ridge between supports -->
  <line x1="120" y1="130" x2="340" y2="130" stroke-width="4"/>

  <!-- angled roof poles down to ground on windward side -->
  <g stroke-width="2.4">
    <line x1="120" y1="130" x2="60" y2="255"/>
    <line x1="167" y1="130" x2="115" y2="255"/>
    <line x1="214" y1="130" x2="175" y2="255"/>
    <line x1="261" y1="130" x2="235" y2="255"/>
    <line x1="308" y1="130" x2="295" y2="255"/>
    <line x1="340" y1="130" x2="340" y2="255"/>
  </g>
  <!-- cross-hatched covering (leaves/brush) over the angled roof -->
  <g stroke-width="1.1" stroke-opacity="0.5">
    <line x1="70" y1="235" x2="330" y2="150"/>
    <line x1="85" y1="205" x2="330" y2="120" stroke-opacity="0"/>
    <line x1="60" y1="200" x2="320" y2="130"/>
    <line x1="65" y1="165" x2="300" y2="132"/>
  </g>

  <!-- wind arrows hitting the angled side -->
  <g stroke-width="1.8" marker-end="url(#arrow3)">
    <line x1="10" y1="150" x2="45" y2="165"/>
    <line x1="10" y1="185" x2="48" y2="200"/>
    <line x1="10" y1="215" x2="52" y2="225"/>
  </g>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a" stroke="none"/>
    </marker>
  </defs>
  <text x="15" y="130" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">Wind</text>

  <!-- open leeward side + fire -->
  <ellipse cx="400" cy="255" rx="22" ry="10" fill="#1a1a1a" fill-opacity="0.15" stroke-width="2"/>
  <path d="M390,250 C392,240 400,238 398,228 M400,250 C403,238 410,236 406,224 M410,250 C412,242 418,240 415,230" stroke-width="1.6"/>
  <text x="400" y="285" text-anchor="middle" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">Reflecting fire</text>

  <text x="230" y="130" text-anchor="middle" font-size="11" stroke="none" fill="#1a1a1a" transform="translate(0,-8)">Ridge</text>
  <text x="230" y="20" text-anchor="middle" font-size="13" font-weight="700" stroke="none" fill="#1a1a1a">Open leeward side faces the fire — faster to build than a debris hut, less insulating</text>
</svg>
