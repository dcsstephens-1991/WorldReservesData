<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Debris hut — ridge pole, ribbing, thick debris insulation, sized to the body</title>

  <line x1="20" y1="270" x2="460" y2="270" stroke-width="1.6"/>

  <!-- ridge pole leaned against a support (tree/rock at back) -->
  <path d="M420,90 C440,95 448,110 448,130" stroke-width="6"/>
  <line x1="90" y1="255" x2="440" y2="105" stroke-width="5"/>

  <!-- ribbing sticks leaned against both sides of ridge -->
  <g stroke-width="2">
    <line x1="130" y1="255" x2="180" y2="150"/>
    <line x1="150" y1="258" x2="215" y2="155"/>
    <line x1="175" y1="260" x2="250" y2="158"/>
    <line x1="205" y1="262" x2="285" y2="160"/>
    <line x1="235" y1="264" x2="320" y2="130"/>
    <line x1="130" y1="255" x2="200" y2="230"/>
    <line x1="150" y1="258" x2="220" y2="238"/>
    <line x1="175" y1="260" x2="245" y2="243"/>
    <line x1="205" y1="262" x2="270" y2="248"/>
  </g>

  <!-- thick debris covering, drawn as a rough lumpy outline over the ribbing -->
  <path d="M95,258 C130,215 160,175 200,150 C250,120 320,105 420,100 C430,120 430,150 428,175 C400,195 340,215 280,235 C220,255 150,262 95,258 Z"
        fill="#1a1a1a" fill-opacity="0.07" stroke-width="2.2"/>
  <g stroke-width="1" stroke-opacity="0.45">
    <path d="M130,235 C160,210 190,185 230,165"/>
    <path d="M160,245 C195,215 235,190 280,170"/>
    <path d="M200,250 C235,222 275,198 320,178"/>
    <path d="M250,255 C285,228 325,205 370,185"/>
  </g>

  <!-- small entrance at the low front -->
  <ellipse cx="95" cy="258" rx="16" ry="20" fill="#1a1a1a" fill-opacity="0.12" stroke-width="2"/>
  <text x="95" y="295" text-anchor="middle" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">Entrance</text>

  <!-- debris thickness callout -->
  <line x1="330" y1="150" x2="330" y2="185" stroke-width="1.2"/>
  <line x1="322" y1="150" x2="338" y2="150" stroke-width="1.2"/>
  <line x1="322" y1="185" x2="338" y2="185" stroke-width="1.2"/>
  <text x="345" y="172" font-size="12" font-weight="700" stroke="none" fill="#1a1a1a">12in+ / 30cm+ debris</text>

  <text x="240" y="25" text-anchor="middle" font-size="13" font-weight="700" stroke="none" fill="#1a1a1a">Size the inside just big enough to lie in — traps body heat</text>
</svg>
