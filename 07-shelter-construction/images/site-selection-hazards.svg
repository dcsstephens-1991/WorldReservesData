<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" stroke="#1a1a1a" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <title>Site selection — hazards to avoid when choosing where to build</title>

  <text x="240" y="24" text-anchor="middle" font-size="13" font-weight="700" stroke="none" fill="#1a1a1a">Site selection — avoid these</text>

  <!-- dead standing tree / widowmaker -->
  <g>
    <line x1="60" y1="230" x2="60" y2="140" stroke-width="4"/>
    <line x1="60" y1="150" x2="30" y2="115" stroke-width="2.5"/>
    <line x1="60" y1="160" x2="90" y2="120" stroke-width="2.5"/>
    <line x1="60" y1="180" x2="35" y2="150" stroke-width="2"/>
    <g stroke-width="2">
      <line x1="45" y1="95" x2="55" y2="108"/>
      <line x1="55" y1="95" x2="45" y2="108"/>
    </g>
    <text x="60" y="255" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">Dead tree /</text>
    <text x="60" y="269" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">"widowmaker"</text>
  </g>

  <!-- low ground / flash flood + cold air pooling -->
  <g transform="translate(140,0)">
    <path d="M20,235 C40,225 60,225 80,235 C60,245 40,245 20,235 Z" fill="#1a1a1a" fill-opacity="0.1" stroke-width="2"/>
    <path d="M15,215 C35,205 65,205 85,215" stroke-width="1.4" stroke-dasharray="3,3"/>
    <path d="M20,225 L20,180 M50,225 L50,170 M80,225 L80,185" stroke-width="1.4" stroke-dasharray="2,4"/>
    <text x="50" y="255" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">Low ground —</text>
    <text x="50" y="269" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">flood / cold air pools</text>
  </g>

  <!-- exposed ridgeline -->
  <g transform="translate(260,0)">
    <path d="M15,235 L55,150 L95,235 Z" fill="#1a1a1a" fill-opacity="0.06" stroke-width="2"/>
    <g stroke-width="1.6" marker-end="url(#arrowh)">
      <line x1="5" y1="140" x2="35" y2="155"/>
      <line x1="5" y1="165" x2="38" y2="175"/>
    </g>
    <g stroke-width="1.6" marker-end="url(#arrowh)">
      <line x1="115" y1="140" x2="75" y2="155"/>
      <line x1="115" y1="165" x2="72" y2="175"/>
    </g>
    <text x="55" y="255" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">Exposed ridgeline —</text>
    <text x="55" y="269" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">full wind exposure</text>
  </g>

  <!-- animal trail -->
  <g transform="translate(380,0)">
    <path d="M0,220 C15,215 15,205 30,200 C45,195 45,185 60,180" stroke-width="2" stroke-dasharray="1,7"/>
    <ellipse cx="30" cy="230" rx="14" ry="6" fill="#1a1a1a" fill-opacity="0.1" stroke-width="1.6"/>
    <ellipse cx="45" cy="222" rx="10" ry="5" fill="#1a1a1a" fill-opacity="0.1" stroke-width="1.4"/>
    <text x="30" y="255" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">Animal trail /</text>
    <text x="30" y="269" text-anchor="middle" font-size="11" font-weight="700" stroke="none" fill="#1a1a1a">nest nearby</text>
  </g>

  <defs>
    <marker id="arrowh" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a" stroke="none"/>
    </marker>
  </defs>

  <line x1="20" y1="290" x2="460" y2="290" stroke-width="1" stroke-dasharray="1,5"/>
  <text x="240" y="308" text-anchor="middle" font-size="11" font-style="italic" stroke="none" fill="#1a1a1a">Full principles: emergency-shelter-basics.md</text>
</svg>
